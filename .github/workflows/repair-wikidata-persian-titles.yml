name: Repair Persian titles from Wikidata

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-wikidata-persian-title-fallback.mjs
      - .github/workflows/repair-wikidata-persian-titles.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout latest content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply Wikidata fallback repair
        run: node scripts/apply-wikidata-persian-title-fallback.mjs

      - name: Verify syntax and Wikidata guards
        run: |
          node --check scripts/enrich-persian-titles.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('scripts/enrich-persian-titles.mjs', 'utf8');
          const required = [
            'const WIKIDATA_TITLE_VERSION = 1;',
            'needsWikidataUpgrade',
            '/external_ids',
            'wikidataPersianTitle',
            "sitefilter', 'fawiki'",
            'wikidataTitleVersion: WIKIDATA_TITLE_VERSION',
          ];
          for (const value of required) {
            if (!source.includes(value)) throw new Error(`Missing Wikidata guard: ${value}`);
          }
          console.log('Wikidata title fallback regression guards passed.');
          NODE

      - name: Commit verified enrichment logic
        run: |
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/enrich-persian-titles.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix: use Wikidata as final Persian title source"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enrich all remaining Latin titles
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PERSIAN_TITLE_MAX_TITLES_PER_RUN: '1500'
          PERSIAN_TITLE_REQUEST_DELAY_MS: '70'
          PERSIAN_TITLE_NEGATIVE_CACHE_HOURS: '1'
        run: node scripts/enrich-persian-titles.mjs

      - name: Audit remaining Latin display titles
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const hasPersian = (v) => /[\u0600-\u06FF]/.test(String(v || ''));
          const missing = (catalog.items || []).filter((item) =>
            item && ['movie','series'].includes(item.type) && !hasPersian(item.nameFa)
          );
          const iranian = missing.filter((item) =>
            item.ir === true || item.isIranian === true ||
            (item.countryCodes || []).includes('IR') ||
            (item.categoryKeys || []).some((key) => /^iranian-(?:movies|series)$/i.test(String(key)))
          );
          console.log(`LATIN_TITLES_AFTER_WIKIDATA=${missing.length}`);
          console.log(`IRANIAN_LATIN_AFTER_WIKIDATA=${iranian.length}`);
          console.log(JSON.stringify(missing.slice(0, 80).map((item) => ({ id:item.id, name:item.name, nameFa:item.nameFa, year:item.year, tmdb:item.tmdb?.id || null })), null, 2));
          if (missing.length >= 940) throw new Error(`Wikidata fallback recovered no titles; still ${missing.length}.`);
          NODE

      - name: Commit recovered titles and client catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-items catalog-manifest.json persian-title-cache.json
          if git diff --cached --quiet; then
            echo "No Wikidata title changes to commit."
            exit 0
          fi
          git commit -m "fix: fill Persian titles available from Wikidata"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
