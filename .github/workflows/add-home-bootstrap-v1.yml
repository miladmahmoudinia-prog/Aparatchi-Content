name: Add Home bootstrap v1
# Content-only verification. This never builds an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-home-bootstrap-v1.mjs'
      - 'scripts/tests/home-bootstrap-v1.test.mjs'
      - '.github/workflows/add-home-bootstrap-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-home-bootstrap-v1
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply bootstrap generator patch
        run: node scripts/add-home-bootstrap-v1.mjs

      - name: Verify client catalog regressions
        run: node --test scripts/tests/client-catalog.test.mjs scripts/tests/final-stability.test.mjs scripts/tests/home-bootstrap-v1.test.mjs

      - name: Rebuild current client index and Home bootstrap
        run: node scripts/rebuild-client-index.mjs

      - name: Verify generated Home bootstrap
        run: node --test scripts/tests/home-bootstrap-v1.test.mjs

      - name: Verify catalog files remain valid and non-empty
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const bootstrap = JSON.parse(fs.readFileSync('catalog-bootstrap.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('catalog-manifest.json', 'utf8'));
          if (!Array.isArray(index.items) || index.items.length < 100) throw new Error('catalog-index unexpectedly small');
          if (!Array.isArray(bootstrap.items) || bootstrap.items.length < 20) throw new Error('catalog-bootstrap unexpectedly small');
          if (!bootstrap.imdbTop100?.movies?.length || !bootstrap.imdbTop100?.series?.length) throw new Error('IMDb missing from bootstrap');
          if (manifest.bootstrapIndex !== 'catalog-bootstrap.json') throw new Error('manifest bootstrapIndex missing');
          if (!(Number(manifest.bootstrapSizeBytes) > 0 && Number(manifest.bootstrapSizeBytes) < 1500000)) throw new Error('bootstrap size is not bounded');
          console.log({ fullItems: index.items.length, bootstrapItems: bootstrap.items.length, bootstrapBytes: manifest.bootstrapSizeBytes });
          NODE

      - name: Commit only validated Content changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/client-catalog.mjs scripts/sync-upera.mjs scripts/rebuild-client-index.mjs catalog-bootstrap.json catalog-manifest.json
          if git diff --cached --quiet; then
            echo "Validated Home bootstrap is already current."
            exit 0
          fi
          git commit -m "perf: publish fast Home bootstrap [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
