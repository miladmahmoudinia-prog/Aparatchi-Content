name: Audit CDN index compatibility v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-cdn-index-compat-v1.mjs'
      - '.github/workflows/audit-cdn-index-compat-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Measure stale CDN detail compatibility
        run: node scripts/audit-cdn-index-compat-v1.mjs
