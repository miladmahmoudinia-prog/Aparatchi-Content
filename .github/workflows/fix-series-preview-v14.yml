name: Fix instant series actions v14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-series-preview-v14.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OLD_INDEX_BYTES=$(stat -c%s catalog-index.json)" >> "$GITHUB_ENV"
          echo "OLD_BOOTSTRAP_BYTES=$(stat -c%s catalog-bootstrap.json)" >> "$GITHUB_ENV"

      - name: Apply bounded series preview patch
        run: python3 .github/patch-series-preview-v14.py

      - name: Syntax and full Content regression suite
        run: |
          node --check scripts/client-catalog.mjs
          node --test scripts/tests/*.test.mjs

      - name: Rebuild only client index and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { buildClientCatalogArtifacts } from './scripts/client-catalog.mjs';

          const catalog = JSON.parse(await fs.readFile('catalog.json', 'utf8'));
          const artifacts = buildClientCatalogArtifacts(catalog);
          await fs.writeFile('catalog-index.json', artifacts.indexSerialized, 'utf8');
          await fs.writeFile('catalog-bootstrap.json', artifacts.bootstrapSerialized, 'utf8');
          const manifest = JSON.parse(await fs.readFile('catalog-manifest.json', 'utf8'));
          manifest.clientRevision = artifacts.clientRevision;
          manifest.clientSizeBytes = artifacts.clientSizeBytes;
          manifest.bootstrapRevision = artifacts.bootstrapRevision;
          manifest.bootstrapSizeBytes = artifacts.bootstrapSizeBytes;
          await fs.writeFile('catalog-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify({
            clientSizeBytes: artifacts.clientSizeBytes,
            bootstrapSizeBytes: artifacts.bootstrapSizeBytes,
            indexItems: artifacts.index.items.length,
          }, null, 2));
          NODE

      - name: Verify size, URL truth and scope
        shell: bash
        run: |
          set -euo pipefail
          NEW_INDEX_BYTES=$(stat -c%s catalog-index.json)
          NEW_BOOTSTRAP_BYTES=$(stat -c%s catalog-bootstrap.json)
          echo "index bytes: $OLD_INDEX_BYTES -> $NEW_INDEX_BYTES"
          echo "bootstrap bytes: $OLD_BOOTSTRAP_BYTES -> $NEW_BOOTSTRAP_BYTES"
          [ "$NEW_INDEX_BYTES" -le 12500000 ] || { echo 'Client index exceeded 12.5 MB safety bound' >&2; exit 1; }
          BOOTSTRAP_LIMIT=$(( OLD_BOOTSTRAP_BYTES * 105 / 100 + 4096 ))
          [ "$NEW_BOOTSTRAP_BYTES" -le "$BOOTSTRAP_LIMIT" ] || { echo 'Bootstrap grew beyond 5% safety bound' >&2; exit 1; }

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const bootstrap = JSON.parse(fs.readFileSync('catalog-bootstrap.json', 'utf8'));
          const sourceByKey = new Map((source.items || []).map((item) => [`${item.type}:${item.id}`, item]));
          let previewSeries = 0;
          let previewSections = 0;
          for (const item of index.items || []) {
            if (item.type !== 'series' || !Array.isArray(item.downloads) || !item.downloads.length) continue;
            previewSeries += 1;
            const original = sourceByKey.get(`${item.type}:${item.id}`);
            if (!original) throw new Error(`Missing source series ${item.id}`);
            const sourceUrls = new Set((original.downloads || []).flatMap((section) => (section.files || []).map((file) => String(file.url || '')).filter(Boolean)));
            for (const section of item.downloads) {
              if (!(Number(section.episodeNumber || 0) > 0)) throw new Error(`Non-episode section leaked into preview ${item.id}`);
              if (!Array.isArray(section.files) || section.files.length < 1 || section.files.length > 2) throw new Error(`Preview file bound failed ${item.id}`);
              previewSections += 1;
              for (const file of section.files) {
                if (!sourceUrls.has(String(file.url || ''))) throw new Error(`Invented/lost source URL mapping ${item.id}`);
              }
            }
          }
          if (previewSeries < 1 || previewSections < 1) throw new Error('No series previews were generated');
          const bootstrapSeriesMedia = (bootstrap.items || []).filter((item) => item.type === 'series' && Array.isArray(item.downloads) && item.downloads.length);
          if (bootstrapSeriesMedia.length) throw new Error(`Series previews leaked into bootstrap: ${bootstrapSeriesMedia.length}`);
          console.log(JSON.stringify({ previewSeries, previewSections, bootstrapSeriesMedia: bootstrapSeriesMedia.length }, null, 2));
          NODE

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(catalog-bootstrap.json catalog-index.json catalog-manifest.json scripts/client-catalog.mjs scripts/tests/client-catalog.test.mjs)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "Unexpected modified files: ${changed[*]}" >&2
            exit 1
          fi
          git diff --check

      - name: Commit bounded preview artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/client-catalog.mjs scripts/tests/client-catalog.test.mjs catalog-index.json catalog-bootstrap.json catalog-manifest.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(catalog-bootstrap.json catalog-index.json catalog-manifest.json scripts/client-catalog.mjs scripts/tests/client-catalog.test.mjs)
          if [ "${staged[*]}" != "${expected[*]}" ]; then
            echo "Unexpected staged files: ${staged[*]}" >&2
            exit 1
          fi
          git commit -m "fix: preload bounded series episode actions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
