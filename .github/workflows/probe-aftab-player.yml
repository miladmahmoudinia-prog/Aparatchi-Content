name: Probe Aftab player
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-aftab-player.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Probe exact episode show_links response shape
        env:
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
        run: |
          node - <<'NODE'
          const token = String(process.env.UPERA_PANEL_TOKEN || '').trim();
          const episodeId = 'c91b76e0-06c9-11ed-8ce1-19c7ed2f064e';
          if (!token) throw new Error('UPERA_PANEL_TOKEN missing');
          const url = `https://panel-api.upera.tv/api/v1/owner/show_links/episode/${episodeId}`;
          const authorization = /^Bearer\s+/i.test(token) ? token : `Bearer ${token}`;
          const headers = {Accept:'application/json', Authorization: authorization, 'Content-Type':'application/json'};
          const res = await fetch(url,{headers});
          console.log('status',res.status);
          const json = await res.json();
          const scrub = (v, depth=0) => {
            if (depth > 8) return '[depth]';
            if (Array.isArray(v)) return v.slice(0,30).map(x=>scrub(x,depth+1));
            if (!v || typeof v !== 'object') return v;
            const out={};
            for (const [k,val] of Object.entries(v)) {
              if (/token|authorization|secret/i.test(k)) continue;
              out[k]=scrub(val,depth+1);
            }
            return out;
          };
          console.log(JSON.stringify(scrub(json),null,2));
          if (!res.ok) process.exit(1);
          NODE
