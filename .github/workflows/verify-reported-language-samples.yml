name: Verify reported language samples

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-reported-language-samples.mjs'
      - '.github/workflows/verify-reported-language-samples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aparatchi-content-read-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify app-facing language truth for reported titles
        run: node scripts/verify-reported-language-samples.mjs
