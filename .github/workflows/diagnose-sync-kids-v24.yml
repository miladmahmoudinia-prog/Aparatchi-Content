name: Diagnose Sync Kids v24

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run current sync regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Audit kids category
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['catalog-index.json','catalog-bootstrap.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const items = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
            const kids = items.filter((item) => Array.isArray(item.categoryKeys) && item.categoryKeys.includes('kids'));
            console.log(file, 'items=', items.length, 'kids=', kids.length);
            for (const item of kids.slice(0, 80)) {
              console.log('KID', item.type, item.nameFa || item.name || item.id, JSON.stringify(item.categoryKeys || []), JSON.stringify(item.genres || []));
            }
          }
          NODE
