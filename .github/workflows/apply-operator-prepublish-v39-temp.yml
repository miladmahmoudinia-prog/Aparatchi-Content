name: Apply operator prepublish v39 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'RUN OPERATOR PREPUBLISH V39'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/operator-prepublish-v39
          fetch-depth: 20

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Patch client publication gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/client-catalog.mjs')
          text = path.read_text()
          old = "  const operatorVariant = item.operatorOnly === true;\n  const prepared ="
          new = "  const operatorVariant = item.operatorOnly === true;\n  // Do not publish an operator-only transport shell until its real identity has\n  // been resolved. The source record stays in catalog.json and the bounded TMDB\n  // verifier retries it; once verified it can appear in mobile-operator plus its\n  // real category (documentary, short film, Iranian/foreign film or series).\n  if (operatorVariant && (item.operatorClassificationStatus === 'pending' || item.operatorClassificationPending === true)) return null;\n  const prepared ="
          if new in text:
              print('prepublish gate already present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('client-catalog operator anchor not found')
          PY

      - name: Syntax and regression tests
        run: |
          node --check scripts/client-catalog.mjs
          node --check scripts/classification.mjs
          node --test scripts/tests/*.test.mjs

      - name: Commit verified fix to branch
        env:
          TARGET_BRANCH: fix/operator-prepublish-v39
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/client-catalog.mjs scripts/tests/operator-prepublish-shortfilms-v39.test.mjs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix: withhold unclassified operator content v39'
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "operator-prepublish-v39=${{ job.status }}"
