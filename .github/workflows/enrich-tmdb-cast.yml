name: Enrich cast images from TMDB

on:
  schedule:
    # Start after the hourly catalog sync window and finish well before the next one.
    - cron: '4 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify TMDB secret
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "TMDB_READ_ACCESS_TOKEN is missing." >&2
            exit 1
          fi

      - name: Enrich cast, countries and anime classification
        timeout-minutes: 9
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_MAX_TITLES_PER_RUN: '650'
          TMDB_REQUEST_DELAY_MS: '260'
          TMDB_REFRESH_DAYS: '30'
        run: node scripts/enrich-tmdb.mjs

      - name: Repair missing Persian titles, collection names and posters
        timeout-minutes: 6
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PERSIAN_TITLE_MAX_TITLES_PER_RUN: '700'
          PERSIAN_TITLE_REQUEST_DELAY_MS: '80'
          PERSIAN_TITLE_NEGATIVE_CACHE_HOURS: '1'
        run: node scripts/enrich-persian-titles.mjs

      - name: Enforce movie-title and collection-title separation
        timeout-minutes: 4
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TITLE_TRUTH_MAX_API_REPAIRS: '180'
          TITLE_TRUTH_REQUEST_DELAY_MS: '60'
        run: node scripts/title-collection-truth-v18.mjs

      - name: Refresh IMDb Top 100 rankings
        timeout-minutes: 2
        env:
          IMDB_TOP_REFRESH_HOURS: '20'
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/update-imdb-top.mjs

      - name: Commit enriched catalog
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .git/index.lock
          git add catalog.json catalog-index.json catalog-items catalog-stable catalog-manifest.json catalog-bootstrap.json catalog-live.json catalog-live-baseline.json tmdb-cache.json tmdb-enrichment-report.json persian-title-cache.json imdb-top-cache.json
          if [ -d assets/media ]; then
            git add assets/media
          fi
          if git diff --cached --quiet; then
            echo "No TMDB enrichment changes to commit."
            exit 0
          fi
          git commit -m "Enrich cast, countries and Persian metadata from TMDB"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            rm -f .git/index.lock
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
