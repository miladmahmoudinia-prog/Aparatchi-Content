name: Enrich cast images from TMDB

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync Upera Catalog
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: aparatchi-tmdb-cast-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify TMDB secret
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "TMDB_READ_ACCESS_TOKEN is missing." >&2
            exit 1
          fi

      - name: Enrich cast, countries and anime classification
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_MAX_TITLES_PER_RUN: '2500'
          TMDB_REQUEST_DELAY_MS: '300'
          TMDB_REFRESH_DAYS: '30'
        run: node scripts/enrich-tmdb.mjs

      - name: Repair missing Persian titles and posters
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PERSIAN_TITLE_MAX_TITLES_PER_RUN: '1200'
          PERSIAN_TITLE_REQUEST_DELAY_MS: '90'
        run: node scripts/enrich-persian-titles.mjs

      - name: Refresh IMDb Top 100 rankings
        env:
          IMDB_TOP_REFRESH_HOURS: '20'
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/update-imdb-top.mjs

      - name: Commit enriched catalog
        run: |
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json catalog-manifest.json tmdb-cache.json tmdb-enrichment-report.json persian-title-cache.json imdb-top-cache.json
          if [ -d assets/media ]; then
            git add assets/media
          fi
          if git diff --cached --quiet; then
            echo "No TMDB enrichment changes to commit."
            exit 0
          fi
          git commit -m "Enrich cast, countries and anime classification from TMDB"
          git pull --rebase origin main
          git push origin HEAD:main
