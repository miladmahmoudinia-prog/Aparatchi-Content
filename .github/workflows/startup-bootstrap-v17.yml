name: One-shot startup bootstrap repair v17
# retry: bounded Home previews v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-bootstrap-v17.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Expose repair run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run_id=%s\nhead_sha=%s\n' "${{ github.run_id }}" "${{ github.sha }}" > startup-bootstrap-v17-run.txt
          git add startup-bootstrap-v17-run.txt
          git commit -m "chore: expose startup bootstrap v17 run id [skip ci]"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply fast Home bootstrap source patch
        run: node scripts/apply-startup-bootstrap-v17.mjs

      - name: Regenerate client bootstrap and manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { writeClientCatalogArtifacts } from './scripts/client-catalog.mjs';
          const catalog = JSON.parse(await fs.readFile('catalog.json', 'utf8'));
          const artifacts = await writeClientCatalogArtifacts(process.cwd(), catalog);
          const manifest = JSON.parse(await fs.readFile('catalog-manifest.json', 'utf8'));
          manifest.clientRevision = artifacts.clientRevision;
          manifest.clientSizeBytes = artifacts.clientSizeBytes;
          manifest.clientIndex = 'catalog-index.json';
          manifest.bootstrapRevision = artifacts.bootstrapRevision;
          manifest.bootstrapSizeBytes = artifacts.bootstrapSizeBytes;
          manifest.bootstrapIndex = 'catalog-bootstrap.json';
          await fs.writeFile('catalog-manifest.json', JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          console.log(`bootstrap=${artifacts.bootstrapSizeBytes} index=${artifacts.clientSizeBytes} items=${artifacts.bootstrap.items.length}/${artifacts.index.items.length}`);
          if (artifacts.bootstrapSizeBytes >= 1500 * 1024) throw new Error(`startup bootstrap too large: ${artifacts.bootstrapSizeBytes}`);
          if (artifacts.bootstrap.items.length > 400) throw new Error(`startup bootstrap has too many items: ${artifacts.bootstrap.items.length}`);
          NODE

      - name: Run content regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Commit repair and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-startup-bootstrap-v17.mjs .github/workflows/startup-bootstrap-v17.yml startup-bootstrap-v17-run.txt
          git add scripts/client-catalog.mjs catalog-bootstrap.json catalog-manifest.json
          git commit -m "fix: make cold-start Home bootstrap fast and current"
          git pull --rebase origin main
          git push origin HEAD:main
