name: Apply media language truth hotfix

on:
  push:
    paths:
      - 'scripts/apply-media-language-truth-hotfix.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch-test-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 40
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Remove fabricated media-language variants
        run: node scripts/apply-media-language-truth-hotfix.mjs

      - name: Syntax check sync engine
        run: node --check scripts/sync-upera.mjs

      - name: Run regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Exercise real catalog cleanup and audit
        id: source_check
        continue-on-error: true
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: 'NORMAL'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '10'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '12000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_REQUEST_DELAY_MS: '520'
          UPERA_MAX_REQUESTS_PER_RUN: '150'
          UPERA_MEDIA_REPAIR_REQUEST_QUOTA: '90'
          UPERA_RECENT_MOVIE_REQUEST_QUOTA: '12'
          UPERA_RECENT_SERIES_REQUEST_QUOTA: '18'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        run: node scripts/sync-upera.mjs

      - name: Commit validated hotfix and catalog cleanup
        shell: bash
        run: |
          if [ '${{ steps.source_check.outcome }}' = 'failure' ]; then
            echo '::warning title=Source verification::Live Upera check failed; source/tests still passed and the hourly sync will retry the audit.'
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs scripts/apply-media-language-truth-hotfix.mjs catalog.json catalog-index.json catalog-items catalog-manifest.json sync-state.json sync-report*.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "fix: never fabricate dubbed or subtitled media variants"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
