name: Diagnose Iranian episode link source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-iranian-links.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect provider response structure without credentials or URLs
        env:
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
        run: |
          node --input-type=module <<'NODE'
          const panelToken = process.env.UPERA_PANEL_TOKEN || '';
          const auth = /^Bearer\s+/i.test(panelToken) ? panelToken : 'Bearer ' + panelToken;
          console.log(JSON.stringify({panelConfigured: Boolean(panelToken), affiliateConfigured: Boolean(process.env.UPERA_TOKEN)}));
          async function get(label,url,panel=false,method='GET') {
            try {
              const r=await fetch(url,{method,headers: panel ? {Authorization:auth,'Content-Type':'application/json'} : {},signal:AbortSignal.timeout(12000)});
              const text=await r.text();
              let j; try {j=JSON.parse(text);}catch {console.log(JSON.stringify({label,status:r.status,json:false}));return null;}
              const links=[];
              function scan(v,at='',depth=0) {
                if(depth>8||!v||typeof v!=='object')return;
                for(const [k,x] of Object.entries(v)){
                  if(typeof x==='string'&&/^https?:\/\//.test(x)) {
                    try {const u=new URL(x); links.push({field:at+'.'+k,host:u.hostname,pathKind:u.pathname.split('/').slice(0,2).join('/'),extension:u.pathname.match(/\.[a-z0-9]{2,5}$/i)?.[0]||''});}catch{}
                  }
                  if(x&&typeof x==='object')scan(x,at+'.'+k,depth+1);
                }
              }
              scan(j);
              const d=j?.data??j;
              const scalarFlags={};
              function flags(v,depth=0){if(!v||typeof v!=='object'||depth>5)return;for(const [k,x]of Object.entries(v)){if(/^(traffic_oo|amount|price|type|status|success)$/.test(k)&&['number','boolean'].includes(typeof x))scalarFlags[k]=x; if(x&&typeof x==='object')flags(x,depth+1);}}
              flags(j);
              console.log(JSON.stringify({label,status:r.status,keys:Object.keys(j||{}),dataKeys:Object.keys(d||{}).slice(0,20),links:links.slice(0,12),flags:scalarFlags}));
              return d;
            } catch(e){console.log(JSON.stringify({label,error:e.name}));return null;}
          }
          function episodes(v,out=[]){if(!v||typeof v!=='object')return out;if(v.id&&(v.episode_number||v.episode||v.number||v.season_id||v.series_id))out.push(v);for(const x of Object.values(v))if(x&&typeof x==='object')episodes(x,out);return out;}
          for(const [name,id]of [['haft','cf3baa00-82ae-11ee-bbf2-8ffcb51db1b0'],['sayebaz','003d0bb0-2edb-11ee-96d0-7ffb24edcb32']]){
            const d=await get(name+'-detail','https://seeko.film/api/v1/ghost/get/series/'+id+'?affiliate=1');
            const es=[...new Map(episodes(d).filter(x=>x.id!==id).map(x=>[x.id,x])).values()];
            console.log(JSON.stringify({name,episodeCount:es.length,episodeKeys:es[0]?Object.keys(es[0]):[]}));
            if(panelToken)await get(name+'-panel-season','https://panel-api.upera.tv/api/v1/owner/get/series/season/'+id,true,'POST');
            for(const e of [es[0],es.at(-1)].filter(Boolean)){
              if(panelToken)await get(name+'-panel-links','https://panel-api.upera.tv/api/v1/owner/show_links/episode/'+e.id,true);
              const u=new URL('https://seeko.film/api/v1/ghost/get/getaffiliatelinks');
              for(const [k,v]of Object.entries({id:e.id,type:'episode',ref:process.env.UPERA_REF_ID||'',traffic:1,token:process.env.UPERA_TOKEN||''}))u.searchParams.set(k,v);
              await get(name+'-affiliate-links',u,false,'POST');
            }
          }
          NODE
