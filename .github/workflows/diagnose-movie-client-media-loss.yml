name: Diagnose movie client media loss

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-movie-client-media-loss.mjs'
      - '.github/workflows/diagnose-movie-client-media-loss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aparatchi-content-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Diagnose movie client media loss
        run: node scripts/diagnose-movie-client-media-loss.mjs
