name: Verify Iranian series traffic=0 v6 now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-iranian-traffic0-v6.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aparatchi-iranian-v6-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout fixed main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Stop stale pre-fix syncs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh run cancel 34085394897
          gh run cancel 34086723385
          set -e
          for i in $(seq 1 30); do
            OLD="$(gh run view 34085394897 --json status -q .status 2>/dev/null || echo completed)"
            QUEUED="$(gh run view 34086723385 --json status -q .status 2>/dev/null || echo completed)"
            echo "stale=${OLD} queued=${QUEUED}"
            if [ "$OLD" != "in_progress" ] && [ "$OLD" != "queued" ] && [ "$OLD" != "pending" ] && [ "$QUEUED" != "in_progress" ] && [ "$QUEUED" != "queued" ] && [ "$QUEUED" != "pending" ]; then
              break
            fi
            sleep 2
          done

      - name: Validate fixed sync source
        run: |
          node --check scripts/sync-upera.mjs
          grep -F "IRANIAN_SERIES_SCAN_VERSION = 6" scripts/sync-upera.mjs
          grep -F "affiliateScopeName === 'iranian-series' ? 0 : 1" scripts/sync-upera.mjs

      - name: Run focused Iranian series verification
        id: iranian_verify
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: 'IRANIAN'
          UPERA_OPERATOR_DISCOVERY_ENABLED: 'false'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '10'
          APARATCHI_CHECKPOINT_RESERVE_MS: '30000'
          APARATCHI_REQUEST_TIMEOUT_MS: '6000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '1'
          UPERA_MAX_REQUESTS_PER_RUN: '220'
          UPERA_REQUEST_DELAY_MS: '420'
          UPERA_IRANIAN_SERIES_REQUEST_QUOTA: '180'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '6'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '1'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '24'
          UPERA_MAX_EPISODE_PAGES: '80'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        shell: bash
        run: |
          set -euo pipefail

          count_published() {
            node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("catalog.json","utf8")); process.stdout.write(String((c.items||[]).filter(i=>i?.type==="series"&&i?.categoryKeys?.includes("iranian-series")&&i?.publicationStatus==="published").length));'
          }

          START="$(count_published)"
          echo "published_before=${START}" | tee -a "$GITHUB_OUTPUT"
          export APARATCHI_RUN_DEADLINE_AT_MS="$(( $(date +%s) * 1000 + 14 * 60 * 1000 ))"

          for pass in $(seq 1 10); do
            echo "=== fixed Iranian pass ${pass}/10 ==="
            node scripts/sync-upera.mjs || true
            NOW="$(count_published)"
            echo "Published Iranian series: ${NOW} (start ${START})"
            if [ "$NOW" -gt "$START" ]; then
              echo "Published Iranian series increased."
              break
            fi
            if [ "$(( $(date +%s) * 1000 + 60000 ))" -ge "$APARATCHI_RUN_DEADLINE_AT_MS" ]; then
              echo "Verification deadline reached after saved progress."
              break
            fi
          done

          node scripts/rebuild-client-catalog.mjs
          FINAL="$(count_published)"
          echo "published_after=${FINAL}" | tee -a "$GITHUB_OUTPUT"

          node - <<'NODE'
          const fs=require('fs');
          const r=fs.existsSync('sync-report-iranian.json')?JSON.parse(fs.readFileSync('sync-report-iranian.json','utf8')):{};
          const d=Array.isArray(r.iranianSeriesDiagnostics)?r.iranianSeriesDiagnostics:[];
          console.log(JSON.stringify({
            iranianSeriesCandidates:r.iranianSeriesCandidates,
            iranianSeriesAddedOrUpdated:r.iranianSeriesAddedOrUpdated,
            iranianSeriesRejectedNoLinks:r.iranianSeriesRejectedNoLinks,
            episodesProcessed:r.episodesProcessed,
            requestScope:r.affiliateRequestScopes?.['iranian-series'],
            lastDiagnostics:d.slice(-8)
          },null,2));
          NODE

      - name: Commit verified Iranian progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "chore: verify Iranian series traffic v6"
          PUSHED=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            rm -f .git/index.lock
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1

      - name: Report final counts
        if: always()
        run: |
          echo "Published before: ${{ steps.iranian_verify.outputs.published_before }}"
          echo "Published after:  ${{ steps.iranian_verify.outputs.published_after }}"
