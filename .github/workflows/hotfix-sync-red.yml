name: Hotfix Sync Regression Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hotfix-sync-red.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Align stale regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/align-regression-fixtures.mjs

      - name: Commit regression alignment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tests
          if git diff --cached --quiet; then
            echo "Regression fixtures already aligned."
          else
            git commit -m "test: align client fixtures with Persian media truth"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Run full regression suite
        shell: bash
        run: node --test scripts/tests/*.test.mjs
