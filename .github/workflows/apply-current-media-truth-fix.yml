name: Verify current media language truth

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-current-media-truth-fix.mjs'
      - '.github/workflows/apply-current-media-truth-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch-rebuild-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply strict language truth fix
        run: node scripts/apply-current-media-truth-fix.mjs
      - name: Check client catalog syntax
        run: node --check scripts/client-catalog.mjs
      - name: Rebuild strict client catalog
        run: node scripts/client-catalog.mjs
      - name: Run full regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Commit verified media truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts catalog-index.json catalog-items catalog-manifest.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "fix: keep dubbed and subtitled media truthful"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
