name: Diagnose Iranian free hints
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-iranian-free-hints.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare free and paid episode hints
        run: |
          node --input-type=module <<'NODE'
          const titles=[
            ['known-free-shadow','003d0bb0-2edb-11ee-96d0-7ffb24edcb32'],
            ['paid-siavash','9b2e4cc0-3ccd-11f0-9af8-f7fabfe73c25'],
            ['paid-haft','cf3baa00-82ae-11ee-bbf2-8ffcb51db1b0'],
            ['candidate-elclasico','3c240b70-0310-11f0-bf17-a54679145d7c'],
            ['candidate-jansakht','6aa01180-cb71-11ef-a947-65c51cff7cb5'],
          ];
          function collect(v,out=[]){
            if(!v||typeof v!=='object')return out;
            if(v.id&&(Number(v.episode_number)>0||v.type==='episode'))out.push(v);
            for(const [k,x]of Object.entries(v))if(x&&typeof x==='object'&&!/similar|offer|casts|directors/.test(k))collect(x,out);
            return out;
          }
          const val=(e,k)=>k==='master_file'?Boolean(e[k]):e[k];
          for(const [name,id]of titles){
            const r=await fetch('https://seeko.film/api/v1/ghost/get/series/'+id+'?affiliate=1',{signal:AbortSignal.timeout(15000)});
            const j=await r.json(); const d=j?.data??j; const es=[...new Map(collect(d).map(e=>[e.id,e])).values()];
            const keys=['free','traffic','traffic_os','traffic_oo','persian','master_file','price','tvod_price','pass','upera'];
            const samples=[es[0],es[Math.floor(es.length/2)],es.at(-1)].filter(Boolean).map(e=>Object.fromEntries(['episode_number',...keys].map(k=>[k,val(e,k)])));
            const counts=Object.fromEntries(keys.map(k=>[k,es.reduce((a,e)=>{const x=val(e,k);const z=JSON.stringify(x);a[z]=(a[z]||0)+1;return a;},{})]));
            console.log(JSON.stringify({name,status:r.status,episodes:es.length,samples,counts}));
          }
          NODE
