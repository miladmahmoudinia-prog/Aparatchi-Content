name: Fix fast movie media v2
# Content-only verification. This never builds an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-fast-movie-media-v2.mjs'
      - 'scripts/tests/fast-movie-media-v2.test.mjs'
      - '.github/workflows/fix-fast-movie-media-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-fast-movie-media-v2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply fast movie media patch
        run: node scripts/fix-fast-movie-media-v2.mjs

      - name: Verify client catalog regressions before rebuild
        run: node --test scripts/tests/client-catalog.test.mjs scripts/tests/final-stability.test.mjs scripts/tests/home-bootstrap-v1.test.mjs scripts/tests/fast-movie-media-v2.test.mjs

      - name: Rebuild client index, details and Home bootstrap
        run: node scripts/rebuild-client-index.mjs

      - name: Verify generated fast media artifacts
        run: EXPECT_GENERATED_FAST_MEDIA=1 node --test scripts/tests/client-catalog.test.mjs scripts/tests/home-bootstrap-v1.test.mjs scripts/tests/fast-movie-media-v2.test.mjs

      - name: Verify catalog safety and size bounds
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const indexRaw = fs.readFileSync('catalog-index.json', 'utf8');
          const bootstrapRaw = fs.readFileSync('catalog-bootstrap.json', 'utf8');
          const index = JSON.parse(indexRaw);
          const bootstrap = JSON.parse(bootstrapRaw);
          const manifest = JSON.parse(fs.readFileSync('catalog-manifest.json', 'utf8'));
          if (!Array.isArray(index.items) || index.items.length < 100) throw new Error('catalog-index unexpectedly small');
          if (!Array.isArray(bootstrap.items) || bootstrap.items.length < 20) throw new Error('catalog-bootstrap unexpectedly small');
          const immediateMovies = bootstrap.items.filter((item) => item.type === 'movie' && ((item.downloads || []).some((section) => (section.files || []).length) || item.streamUrl));
          if (immediateMovies.length < 5) throw new Error(`too few immediate movie media summaries: ${immediateMovies.length}`);
          if (Buffer.byteLength(bootstrapRaw) >= 1500000) throw new Error('bootstrap grew beyond 1.5 MB bound');
          if (!(Number(manifest.clientSizeBytes) > 0 && Number(manifest.bootstrapSizeBytes) > 0)) throw new Error('manifest sizes missing');
          console.log({ fullItems: index.items.length, immediateMovies: immediateMovies.length, clientBytes: Buffer.byteLength(indexRaw), bootstrapBytes: Buffer.byteLength(bootstrapRaw) });
          NODE

      - name: Commit only validated Content changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/client-catalog.mjs scripts/tests/client-catalog.test.mjs catalog-index.json catalog-bootstrap.json catalog-manifest.json catalog-items catalog-stable
          if git diff --cached --quiet; then
            echo "Validated fast movie media artifacts are already current."
            exit 0
          fi
          git commit -m "perf: expose movie media in lightweight catalog [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
