name: Fix people enrichment queue v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-people-enrichment-v12.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Patch people queue and TMDB commit outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sync_path = Path('scripts/sync-upera.mjs')
          text = sync_path.read_text()

          old_select = """  const start = options.preferRecent ? 0 : state.peopleEnrichmentOffset % candidates.length;
          const selected = Array.from(
            { length: Math.min(maxTitles, candidates.length) },
            (_, index) => candidates[(start + index) % candidates.length],
          );

          let visited = 0;
          for (const item of selected) {
            if (runTimeBudgetReached('people-enrichment', 45000)) break;
            visited += 1;
            stats.peopleEnrichmentProcessed += 1;
"""
          new_select = """  // Keep newly added titles with no people metadata from waiting behind a long
          // historical cursor, while still reserving half of every run for rotating
          // backlog repair. This is generic queue policy; no title is hard-coded.
          const priorityTake = options.preferRecent
            ? 0
            : Math.min(maxTitles, Math.max(1, Math.ceil(maxTitles / 2)));
          const priorityCandidates = options.preferRecent
            ? []
            : candidates
                .filter((item) =>
                  (!Array.isArray(item.people) || item.people.length === 0) &&
                  !cleanText(item.peopleEnrichmentCheckedAt),
                )
                .slice(0, priorityTake);
          const prioritySet = new Set(priorityCandidates);
          const rotatingCandidates = options.preferRecent
            ? candidates
            : candidates.filter((item) => !prioritySet.has(item));
          const start = options.preferRecent
            ? 0
            : rotatingCandidates.length
              ? state.peopleEnrichmentOffset % rotatingCandidates.length
              : 0;
          const selected = options.preferRecent
            ? candidates.slice(0, Math.min(maxTitles, candidates.length))
            : [...priorityCandidates];
          if (!options.preferRecent && rotatingCandidates.length > 0) {
            const remaining = Math.max(0, maxTitles - selected.length);
            for (let index = 0; index < Math.min(remaining, rotatingCandidates.length); index += 1) {
              selected.push(rotatingCandidates[(start + index) % rotatingCandidates.length]);
            }
          }

          let visited = 0;
          let rotatingVisited = 0;
          for (const item of selected) {
            if (runTimeBudgetReached('people-enrichment', 45000)) break;
            visited += 1;
            if (!options.preferRecent && !prioritySet.has(item)) rotatingVisited += 1;
            stats.peopleEnrichmentProcessed += 1;
"""
          if text.count(old_select) != 1:
              raise SystemExit(f'people selection block mismatch: {text.count(old_select)}')
          text = text.replace(old_select, new_select, 1)

          old_offset = """  state.peopleEnrichmentOffset = candidates.length
            ? (start + visited) % candidates.length
            : 0;
          state.lastPeopleEnrichmentAt = new Date().toISOString();
"""
          new_offset = """  if (!options.preferRecent && rotatingCandidates.length > 0 && rotatingVisited > 0) {
            state.peopleEnrichmentOffset =
              (start + rotatingVisited) % rotatingCandidates.length;
          } else if (!options.preferRecent && rotatingCandidates.length === 0) {
            state.peopleEnrichmentOffset = 0;
          }
          state.lastPeopleEnrichmentAt = new Date().toISOString();
"""
          if text.count(old_offset) != 1:
              raise SystemExit(f'people offset block mismatch: {text.count(old_offset)}')
          text = text.replace(old_offset, new_offset, 1)

          old_mode = """if (effectiveSyncMode === 'PEOPLE') {
            // Fill episode artwork first so this user-visible repair cannot be starved
            // by slower external cast lookups. Remaining time continues cast enrichment.
            await syncEpisodeArtworkMetadata();
            if (!runTimeBudgetReached('before-people-metadata', 60000)) {
              await syncPeopleMetadata();
            }
          }
"""
          new_mode = """if (effectiveSyncMode === 'PEOPLE') {
            // PEOPLE mode exists primarily to repair cast/director metadata. Do that first
            // so a large episode-artwork queue cannot consume the entire run budget.
            await syncPeopleMetadata();
            if (!runTimeBudgetReached('before-episode-artwork-metadata', 60000)) {
              await syncEpisodeArtworkMetadata();
            }
          }
"""
          if text.count(old_mode) != 1:
              raise SystemExit(f'PEOPLE mode block mismatch: {text.count(old_mode)}')
          text = text.replace(old_mode, new_mode, 1)
          sync_path.write_text(text)

          workflow_path = Path('.github/workflows/enrich-tmdb-cast.yml')
          workflow = workflow_path.read_text()
          old_add = "git add catalog.json sync-report-min.json sync-report.json catalog-index.json catalog-items catalog-manifest.json"
          new_add = "git add catalog.json catalog-index.json catalog-items catalog-stable catalog-manifest.json catalog-bootstrap.json tmdb-cache.json tmdb-enrichment-report.json sync-report-min.json sync-report.json"
          if workflow.count(old_add) != 1:
              raise SystemExit(f'TMDB git add mismatch: {workflow.count(old_add)}')
          workflow = workflow.replace(old_add, new_add, 1)
          workflow_path.write_text(workflow)
          PY

      - name: Verify syntax and queue behavior
        run: |
          node --check scripts/sync-upera.mjs
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import json

          sync = Path('scripts/sync-upera.mjs').read_text()
          assert sync.index('await syncPeopleMetadata();') < sync.index("await syncEpisodeArtworkMetadata();", sync.index("if (effectiveSyncMode === 'PEOPLE')"))
          assert 'const priorityTake = options.preferRecent' in sync
          assert 'let rotatingVisited = 0;' in sync
          assert '(start + rotatingVisited) % rotatingCandidates.length' in sync

          workflow = Path('.github/workflows/enrich-tmdb-cast.yml').read_text()
          required = ['catalog-bootstrap.json', 'catalog-stable', 'tmdb-cache.json', 'tmdb-enrichment-report.json']
          for value in required:
              assert value in workflow, value

          catalog = json.loads(Path('catalog.json').read_text())
          items = catalog.get('items', [])
          def stamp(item):
              for key in ('mediaUpdatedAt','sourceUpdatedAt','updatedAt','sourceCreatedAt','createdAt'):
                  value = item.get(key)
                  if value:
                      try:
                          from datetime import datetime
                          return datetime.fromisoformat(str(value).replace('Z','+00:00')).timestamp()
                      except Exception:
                          pass
              return 0
          def needs(item):
              people = [p for p in (item.get('people') or []) if p and p.get('role') in ('actor','director')]
              if len(people) < 3: return True
              if not any(p.get('role') == 'director' for p in people): return True
              if len([p for p in people if p.get('role') == 'actor']) < 2: return True
              return False
          candidates = sorted([i for i in items if needs(i)], key=stamp, reverse=True)
          max_titles = 20
          priority = [i for i in candidates if not (i.get('people') or []) and not i.get('peopleEnrichmentCheckedAt')][:10]
          katiusha = next((i for i in items if i.get('id') == 'movie-katiusha-2018'), None)
          if katiusha and not (katiusha.get('people') or []) and not katiusha.get('peopleEnrichmentCheckedAt'):
              assert any(i.get('id') == 'movie-katiusha-2018' for i in priority), [i.get('id') for i in priority]
              print('Katiusha is in the first fresh-empty priority batch.')
          elif katiusha:
              print('Katiusha was already attempted/enriched before validation.')
          else:
              raise SystemExit('Katiusha record disappeared unexpectedly')
          print(f'priority={len(priority)} rotating_capacity={max_titles-len(priority)} candidates={len(candidates)}')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          expected=(.github/workflows/enrich-tmdb-cast.yml scripts/sync-upera.mjs)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo 'Unexpected functional diff scope' >&2
            git diff --name-only >&2
            exit 1
          fi

      - name: Commit functional fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs .github/workflows/enrich-tmdb-cast.yml
          git commit -m "fix: prioritize cast metadata repair [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep $((attempt * 3))
          done
          echo 'Could not push functional fix after retries.' >&2
          exit 1
