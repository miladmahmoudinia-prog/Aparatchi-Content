name: Fix people enrichment queue v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-people-enrichment-v12.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Patch people queue and TMDB commit outputs
        run: echo '' | base64 -d | python3

      - name: Verify syntax and queue behavior
        run: |
          node --check scripts/sync-upera.mjs
          git diff --check
          echo '' | base64 -d | python3
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(.github/workflows/enrich-tmdb-cast.yml scripts/sync-upera.mjs)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo 'Unexpected functional diff scope' >&2
            git diff --name-only >&2
            exit 1
          fi

      - name: Commit functional fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs .github/workflows/enrich-tmdb-cast.yml
          git commit -m "fix: prioritize cast metadata repair [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep $((attempt * 3))
          done
          echo 'Could not push functional fix after retries.' >&2
          exit 1
