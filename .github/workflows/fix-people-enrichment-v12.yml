name: Fix people enrichment queue v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-people-enrichment-v12.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-maintenance-fix-v12
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply audited corrective patch
        run: python3 .github/patch-people-v12.py

      - name: Verify syntax, sync lanes and scope
        run: |
          node --check scripts/sync-upera.mjs
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime

          sync = Path('scripts/sync-upera.mjs').read_text()
          mode = sync.index("if (effectiveSyncMode === 'PEOPLE')")
          iranian = sync.index("} else if (effectiveSyncMode === 'IRANIAN') {", mode)
          backfill = sync.index("} else if (effectiveSyncMode === 'BACKFILL') {", iranian)
          normal = sync.index('} else {', backfill)
          assert mode < iranian < backfill < normal
          assert sync.index('await syncPeopleMetadata();', mode, iranian) < sync.index('await syncEpisodeArtworkMetadata();', mode, iranian)
          for required in (
              'await syncRecentMovieDiscovery();',
              'await syncRecentSeriesDiscovery();',
              'await syncIncompleteMovieMedia();',
              'await syncMovieArchive();',
              'await syncSeriesArchive();',
              "const priorityTake = options.preferRecent",
              'let rotatingVisited = 0;',
              '(start + rotatingVisited) % rotatingCandidates.length',
          ):
              assert required in sync, required

          workflow = Path('.github/workflows/enrich-tmdb-cast.yml').read_text()
          for value in ('catalog-bootstrap.json', 'catalog-stable', 'tmdb-cache.json', 'tmdb-enrichment-report.json'):
              assert value in workflow, value

          catalog = json.loads(Path('catalog.json').read_text())
          items = catalog.get('items', [])
          def stamp(item):
              for key in ('mediaUpdatedAt','sourceUpdatedAt','updatedAt','sourceCreatedAt','createdAt'):
                  value = item.get(key)
                  if value:
                      try:
                          return datetime.fromisoformat(str(value).replace('Z','+00:00')).timestamp()
                      except Exception:
                          pass
              return 0
          def needs(item):
              people = [p for p in (item.get('people') or []) if p and p.get('role') in ('actor','director')]
              return len(people) < 3 or not any(p.get('role') == 'director' for p in people) or len([p for p in people if p.get('role') == 'actor']) < 2
          candidates = sorted([i for i in items if needs(i)], key=stamp, reverse=True)
          priority = [i for i in candidates if not (i.get('people') or []) and not i.get('peopleEnrichmentCheckedAt')][:10]
          assert len(priority) <= 10
          assert all(not (i.get('people') or []) and not i.get('peopleEnrichmentCheckedAt') for i in priority)
          katiusha = next((i for i in items if 'کاتیوشا' in str(i.get('nameFa') or '') or str(i.get('nameEn') or i.get('name') or '').strip().lower() in ('katiusha','katyusha')), None)
          if katiusha and not (katiusha.get('people') or []) and not katiusha.get('peopleEnrichmentCheckedAt'):
              print('Katiusha remains eligible for fresh-empty priority repair.')
          elif katiusha:
              print('Katiusha has already been attempted/enriched in the moving catalog.')
          else:
              print('Katiusha is not in this moving catalog snapshot; generic queue assertions passed.')
          print(f'priority={len(priority)} rotating_capacity={20-len(priority)} candidates={len(candidates)}')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(scripts/sync-upera.mjs)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo 'Unexpected corrective diff scope' >&2
            git diff --name-only >&2
            exit 1
          fi
          read adds dels file < <(git diff --numstat f25ebc56923360d6116c908f441888b974763301^ -- scripts/sync-upera.mjs)
          echo "Final source diff vs healthy base: +$adds -$dels $file"
          if [ "$adds" -gt 80 ] || [ "$dels" -gt 50 ]; then
            echo 'Final source diff is too large; refusing correction.' >&2
            exit 1
          fi

      - name: Commit corrected functional fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs
          git commit -m "fix: preserve sync lanes while prioritizing cast repair [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep $((attempt * 3))
          done
          echo 'Could not push corrected functional fix after retries.' >&2
          exit 1
          # hardened correction 10
