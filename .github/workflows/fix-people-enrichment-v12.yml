name: Fix people enrichment queue v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-people-enrichment-v12.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply exact functional patch
        run: python3 .github/patch-people-v12.py

      - name: Verify syntax and scope
        run: |
          node --check scripts/sync-upera.mjs
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime

          sync = Path('scripts/sync-upera.mjs').read_text()
          mode = sync.index("if (effectiveSyncMode === 'PEOPLE')")
          assert sync.index('await syncPeopleMetadata();', mode) < sync.index('await syncEpisodeArtworkMetadata();', mode)
          assert 'const priorityTake = options.preferRecent' in sync
          assert 'let rotatingVisited = 0;' in sync
          assert '(start + rotatingVisited) % rotatingCandidates.length' in sync

          workflow = Path('.github/workflows/enrich-tmdb-cast.yml').read_text()
          for value in ('catalog-bootstrap.json', 'catalog-stable', 'tmdb-cache.json', 'tmdb-enrichment-report.json'):
              assert value in workflow, value

          catalog = json.loads(Path('catalog.json').read_text())
          items = catalog.get('items', [])
          def stamp(item):
              for key in ('mediaUpdatedAt','sourceUpdatedAt','updatedAt','sourceCreatedAt','createdAt'):
                  value = item.get(key)
                  if value:
                      try:
                          return datetime.fromisoformat(str(value).replace('Z','+00:00')).timestamp()
                      except Exception:
                          pass
              return 0
          def needs(item):
              people = [p for p in (item.get('people') or []) if p and p.get('role') in ('actor','director')]
              return len(people) < 3 or not any(p.get('role') == 'director' for p in people) or len([p for p in people if p.get('role') == 'actor']) < 2
          candidates = sorted([i for i in items if needs(i)], key=stamp, reverse=True)
          priority = [i for i in candidates if not (i.get('people') or []) and not i.get('peopleEnrichmentCheckedAt')][:10]
          katiusha = next((i for i in items if i.get('id') == 'movie-katiusha-2018'), None)
          if katiusha and not (katiusha.get('people') or []) and not katiusha.get('peopleEnrichmentCheckedAt'):
              assert any(i.get('id') == 'movie-katiusha-2018' for i in priority), [i.get('id') for i in priority]
              print('Katiusha is in the first fresh-empty priority batch.')
          elif katiusha:
              print('Katiusha was already attempted/enriched before validation.')
          else:
              raise SystemExit('Katiusha record disappeared unexpectedly')
          print(f'priority={len(priority)} rotating_capacity={20-len(priority)} candidates={len(candidates)}')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(.github/workflows/enrich-tmdb-cast.yml scripts/sync-upera.mjs)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo 'Unexpected functional diff scope' >&2
            git diff --name-only >&2
            exit 1
          fi

      - name: Commit functional fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs .github/workflows/enrich-tmdb-cast.yml
          git commit -m "fix: prioritize cast metadata repair [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            sleep $((attempt * 3))
          done
          echo 'Could not push functional fix after retries.' >&2
          exit 1
