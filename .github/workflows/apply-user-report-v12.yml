name: Apply user report v12 content fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-user-report-v12.mjs'
      - '.github/workflows/apply-user-report-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply v12 content fixes
        run: node scripts/apply-user-report-v12.mjs

      - name: Run full content regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Commit verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/sync-upera.mjs scripts/client-catalog.mjs scripts/tests/user-report-v12.test.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: truthful series freshness and detail previews v12"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "::error::Could not push v12 content fixes after 5 attempts."
          exit 1
