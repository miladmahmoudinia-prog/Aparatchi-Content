name: Finalize bootstrap cast preview v22

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.issue.title == 'RUN FINALIZE BOOTSTRAP CAST V22'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest Content main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Add bounded cast preview to compact bootstrap navigation items
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const path = 'scripts/client-catalog.mjs';
          let source = await fs.readFile(path, 'utf8');
          const before = `  for (const field of BOOTSTRAP_NAVIGATION_FIELDS) {\n    if (Object.prototype.hasOwnProperty.call(item || {}, field)) compact[field] = item[field];\n  }\n  if (item?.type === 'movie') {`;
          const after = `  for (const field of BOOTSTRAP_NAVIGATION_FIELDS) {\n    if (Object.prototype.hasOwnProperty.call(item || {}, field)) compact[field] = item[field];\n  }\n  // Keep only enough people metadata for the first visible cast row. The full\n  // detail shard remains authoritative and replaces this preview after hydration.\n  if (Array.isArray(item?.people) && item.people.length) {\n    compact.people = item.people.slice(0, 4);\n  }\n  if (item?.type === 'movie') {`;
          if (!source.includes(after)) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`bootstrap cast anchor count=${count}`);
            source = source.replace(before, after);
            await fs.writeFile(path, source, 'utf8');
          }
          NODE

      - name: Rebuild client index/bootstrap/detail artifacts
        run: node scripts/rebuild-client-catalog.mjs

      - name: Refresh manifest client/bootstrap revisions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const manifestPath = 'catalog-manifest.json';
          const manifest = JSON.parse(await fs.readFile(manifestPath, 'utf8'));
          const index = await fs.readFile('catalog-index.json');
          const bootstrap = await fs.readFile('catalog-bootstrap.json');
          const digest = (value) => createHash('sha256').update(value).digest('hex');
          manifest.clientRevision = digest(index);
          manifest.clientSizeBytes = index.length;
          manifest.bootstrapRevision = digest(bootstrap);
          manifest.bootstrapSizeBytes = bootstrap.length;
          await fs.writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Validate cast preview, navigation completeness and core artifacts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const index = JSON.parse(await fs.readFile('catalog-index.json', 'utf8'));
          const bootstrap = JSON.parse(await fs.readFile('catalog-bootstrap.json', 'utf8'));
          const manifest = JSON.parse(await fs.readFile('catalog-manifest.json', 'utf8'));
          const bootById = new Map((bootstrap.items || []).map((item) => [`${item.type}:${item.id}`, item]));
          const withPeople = (index.items || []).filter((item) => Array.isArray(item.people) && item.people.length);
          let missingPreview = 0;
          for (const item of withPeople) {
            const boot = bootById.get(`${item.type}:${item.id}`);
            const expected = Math.min(4, item.people.length);
            if (!boot || !Array.isArray(boot.people) || boot.people.length < expected) missingPreview += 1;
          }
          const indexRaw = await fs.readFile('catalog-index.json');
          const bootstrapRaw = await fs.readFile('catalog-bootstrap.json');
          const digest = (value) => createHash('sha256').update(value).digest('hex');
          const report = {
            items: index.items?.length || 0,
            withPeople: withPeople.length,
            missingPreview,
            indexBytes: indexRaw.length,
            bootstrapBytes: bootstrapRaw.length,
          };
          console.log(JSON.stringify(report, null, 2));
          if (!report.items || report.items !== (bootstrap.items?.length || 0)) throw new Error('bootstrap navigation catalog incomplete');
          if (missingPreview !== 0) throw new Error(`missing first-open cast previews: ${missingPreview}`);
          if (bootstrapRaw.length >= indexRaw.length) throw new Error('bootstrap unexpectedly grew to full index size');
          if (manifest.clientRevision !== digest(indexRaw) || manifest.clientSizeBytes !== indexRaw.length) throw new Error('manifest client revision mismatch');
          if (manifest.bootstrapRevision !== digest(bootstrapRaw) || manifest.bootstrapSizeBytes !== bootstrapRaw.length) throw new Error('manifest bootstrap revision mismatch');
          NODE
          test -s catalog.json
          test -s catalog-index.json
          test -s catalog-bootstrap.json
          test -s catalog-manifest.json
          test -d catalog-items
          test -d catalog-stable
          git diff --check

      - name: Commit verified Content repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize-bootstrap-cast-v22.yml
          git add scripts/client-catalog.mjs catalog-index.json catalog-bootstrap.json catalog-manifest.json catalog-items catalog-stable
          git diff --check
          git commit -m "perf: show cast preview on first detail open [skip ci]"
          git push origin HEAD:main
