name: Fix full navigation bootstrap v1
# Content-only repair. This never builds an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-full-navigation-bootstrap-v1.mjs'
      - 'scripts/tests/full-navigation-bootstrap-v1.test.mjs'
      - '.github/workflows/fix-full-navigation-bootstrap-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-full-navigation-bootstrap-v1
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply full navigation bootstrap repair
        run: node scripts/fix-full-navigation-bootstrap-v1.mjs

      - name: Verify bootstrap from current real catalog
        run: node --test scripts/tests/full-navigation-bootstrap-v1.test.mjs scripts/tests/client-catalog.test.mjs

      - name: Rebuild client artifacts
        run: node scripts/rebuild-client-index.mjs

      - name: Verify generated catalog truth
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/full-navigation-bootstrap-v1.test.mjs
          node scripts/diagnose-movie-client-media-loss.mjs | tee /tmp/media-diagnostic.log
          grep -q '"sourceMediaTitlesMissingFromClient":0' /tmp/media-diagnostic.log
          grep -q '"sourceUrlsLostFromClientDetailTitles":0' /tmp/media-diagnostic.log
          grep -q '"sourceUrlsLostFromClientSummaryTitles":0' /tmp/media-diagnostic.log
          grep -q '"dubbedMoviesLost":0' /tmp/media-diagnostic.log
          node - <<'NODE'
          const fs = require('fs');
          const indexRaw = fs.readFileSync('catalog-index.json', 'utf8');
          const bootstrapRaw = fs.readFileSync('catalog-bootstrap.json', 'utf8');
          const index = JSON.parse(indexRaw);
          const bootstrap = JSON.parse(bootstrapRaw);
          const count = (payload, key) => payload.items.filter((item) => (item.categoryKeys || []).includes(key)).length;
          if (bootstrap.items.length !== index.items.length) throw new Error(`bootstrap ${bootstrap.items.length} != index ${index.items.length}`);
          if (count(bootstrap, 'dubbed') !== count(index, 'dubbed')) throw new Error(`dubbed bootstrap ${count(bootstrap, 'dubbed')} != index ${count(index, 'dubbed')}`);
          if (Buffer.byteLength(bootstrapRaw) >= 5000000) throw new Error(`bootstrap too large: ${Buffer.byteLength(bootstrapRaw)}`);
          console.log({
            indexItems: index.items.length,
            bootstrapItems: bootstrap.items.length,
            dubbedIndex: count(index, 'dubbed'),
            dubbedBootstrap: count(bootstrap, 'dubbed'),
            indexBytes: Buffer.byteLength(indexRaw),
            bootstrapBytes: Buffer.byteLength(bootstrapRaw),
          });
          NODE

      - name: Commit validated Content repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/client-catalog.mjs catalog-index.json catalog-bootstrap.json catalog-manifest.json
          if git diff --cached --quiet; then
            echo "Validated artifacts are already current."
            exit 0
          fi
          git commit -m "fix: make bootstrap a complete navigation catalog [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
