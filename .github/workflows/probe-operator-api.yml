name: Probe Upera operator API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-operator-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe sanitized operator API shape
        env:
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://panel-api.upera.tv/api/v1';
          const token = String(process.env.UPERA_PANEL_TOKEN || '').trim();
          if (!token) throw new Error('UPERA_PANEL_TOKEN missing');
          const headers = {
            authorization: /^Bearer\s+/i.test(token) ? token : `Bearer ${token}`,
            'content-type': 'application/json',
            accept: 'application/json',
          };
          const safeText = (v, max = 140) => String(v ?? '').replace(/[\r\n]+/g, ' ').slice(0, max);
          const keysOf = (value) => value && typeof value === 'object' && !Array.isArray(value)
            ? Object.keys(value).sort().slice(0, 100)
            : [];
          const recordsFrom = (payload, key) => {
            const root = payload?.data ?? payload ?? {};
            const candidates = [
              root?.[key], root?.data?.[key], root?.data,
              root?.items, root?.results, root?.rows, root?.list,
              payload?.[key], payload?.items, payload?.results, payload?.rows,
            ];
            for (const value of candidates) if (Array.isArray(value)) return value;
            return [];
          };
          const summarize = (record) => {
            if (!record || typeof record !== 'object') return {};
            const out = {};
            for (const key of [
              'id','t_id','source_id','sourceId','content_id','contentId','target_id','targetId',
              'post_id','postId','upera_id','uperaId','movie_id','series_id','episode_id','specific_id',
              'uuid','slug','name','title','name_fa','title_fa','traffic','traffic_oo','trafficOo',
              'amount','sale_method','payment_method','type','kind','ref_id','refId'
            ]) {
              const value = record[key];
              if (value !== undefined && value !== null && value !== '') {
                out[key] = typeof value === 'string' ? safeText(value) : value;
              }
            }
            for (const key of ['link','url','href','player','player_url','playerUrl','stream','stream_url','streamUrl']) {
              const value = safeText(record[key]);
              if (!value) continue;
              try {
                const u = new URL(value);
                out[key] = `${u.origin}${u.pathname}`;
              } catch {
                out[key] = value.slice(0, 100);
              }
            }
            out._keys = Object.keys(record).sort().slice(0, 100);
            return out;
          };
          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, {headers, ...options});
            const text = await response.text();
            let payload = null;
            try { payload = JSON.parse(text); } catch {}
            console.log(`PROBE ${options.method || 'GET'} ${path} -> ${response.status}`);
            return {response, payload, text};
          }
          for (const kind of ['movies','series']) {
            const body = JSON.stringify({
              query: '', ir: -1, sale_method: 3, payment_method: 0,
              specific_id: null, nodata: 1, owner: 9194919, page: 1,
            });
            const {payload} = await request(`/owner/get/${kind}`, {method:'POST', body});
            const root = payload?.data ?? payload ?? {};
            console.log(`SHAPE ${kind}: payload=${JSON.stringify(keysOf(payload))} root=${JSON.stringify(keysOf(root))} root.data=${JSON.stringify(keysOf(root?.data))}`);
            const records = recordsFrom(payload, kind);
            console.log(`LIST ${kind}: count=${records.length}`);
            records.slice(0,3).forEach((row, i) => console.log(`ROW ${kind} ${i}:`, JSON.stringify(summarize(row))));

            const row = records[0];
            if (!row) continue;
            const ids = [...new Set([
              row.id,row.t_id,row.source_id,row.sourceId,row.content_id,row.contentId,row.target_id,row.targetId,
              row.post_id,row.postId,row.upera_id,row.uperaId,row.movie_id,row.series_id,row.episode_id,row.specific_id,row.uuid
            ].filter(Boolean).map(String))].slice(0,8);
            const type = kind === 'movies' ? 'movie' : 'series';
            for (const id of ids) {
              for (const method of ['GET','POST']) {
                const opts = method === 'POST' ? {method, body:'{}'} : {method};
                const probe = await request(`/owner/show_links/${type}/${encodeURIComponent(id)}`, opts);
                const data = probe.payload?.data ?? probe.payload;
                if (probe.payload) {
                  console.log(`SHOW ${type} id=${safeText(id,60)} ${method}: keys=${JSON.stringify(keysOf(data))} data=${JSON.stringify(summarize(data))}`);
                  const linkRecords = recordsFrom(probe.payload, 'links');
                  linkRecords.slice(0,2).forEach((link, i) => console.log(`LINK ${type} ${i}:`, JSON.stringify(summarize(link))));
                }
              }
            }
          }
          NODE
