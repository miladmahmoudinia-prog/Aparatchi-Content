name: Fix Jester Titles v26

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Add persistent verified Persian overrides
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/persian-title-overrides.mjs')
          text = p.read_text()
          title_anchor = "  ['28 Years Later: The Bone Temple', '۲۸ سال بعد: معبد استخوان'],\n"
          title_patch = title_anchor + "  ['The Jester', 'دلقک'],\n  ['The Jester 2', 'دلقک ۲'],\n"
          if "['The Jester 2', 'دلقک ۲']" not in text:
              if title_anchor not in text:
                  raise RuntimeError('verified title insertion anchor missing')
              text = text.replace(title_anchor, title_patch, 1)
          collection_anchor = "  ['28 Days/Weeks/Years Later Collection', 'مجموعه ۲۸ روز بعد'],\n"
          collection_patch = collection_anchor + "  ['The Jester Collection', 'مجموعه دلقک'],\n"
          if "['The Jester Collection', 'مجموعه دلقک']" not in text:
              if collection_anchor not in text:
                  raise RuntimeError('verified collection insertion anchor missing')
              text = text.replace(collection_anchor, collection_patch, 1)
          p.write_text(text)
          PY

      - name: Repair real catalog and rebuild client artifacts
        env:
          TITLE_TRUTH_MAX_API_REPAIRS: '0'
        run: node scripts/title-collection-truth-v18.mjs

      - name: Audit real Jester collection
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const expected = new Map([
            ['The Jester', 'دلقک'],
            ['The Jester 2', 'دلقک ۲'],
          ]);
          const found = [];
          for (const [name, nameFa] of expected) {
            const item = index.items.find((candidate) => candidate.name === name);
            if (!item) throw new Error(`missing real catalog title: ${name}`);
            if (item.nameFa !== nameFa) throw new Error(`${name} Persian title is ${item.nameFa}, expected ${nameFa}`);
            if (item.collectionName !== 'The Jester Collection') throw new Error(`${name} collection identity changed: ${item.collectionName}`);
            if (item.collectionNameFa !== 'مجموعه دلقک') throw new Error(`${name} Persian collection is ${item.collectionNameFa}`);
            found.push({ name: item.name, nameFa: item.nameFa, collectionNameFa: item.collectionNameFa, order: item.collectionOrder });
          }
          console.log(JSON.stringify(found, null, 2));
          NODE

      - name: Run complete Content regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Remove one-shot workflow and commit validated repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-jester-titles-v26.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct Jester Persian titles and collection"
          git push origin HEAD:${{ github.head_ref }}
