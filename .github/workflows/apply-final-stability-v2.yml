name: Apply final stability v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-stability-v2.yml'
      - 'scripts/apply-final-stability-fixes.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-final-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # This runner is intentionally independent from the hourly catalog lane.
      - name: Apply source fixes
        run: node scripts/apply-final-stability-fixes.mjs

      - name: Run all Content regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Commit validated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f final-fix-output.log
          git add scripts/sync-upera.mjs scripts/client-catalog.mjs .github/workflows/sync-upera.yml scripts/tests/sync-upera-regression.test.mjs scripts/tests/final-stability.test.mjs
          git add -A final-fix-output.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "fix: stabilize series media people and episode backfill"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
