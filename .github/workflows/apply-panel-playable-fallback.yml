name: Apply verified panel playback fallback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-panel-playable-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 100

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Patch verified panel playback fallback
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/sync-upera.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const old = `  if (!verified.length && (rootTraffic === 0 || rootTraffic === 1)) {`;
          const replacement = `  const hasVerifiedPlayablePanelLink = verified.some((link) =>\n    isDirectMediaUrl(link?.link) ||\n    Boolean(operatorPortalDetails(link?.link)?.exactStream),\n  );\n  if (!hasVerifiedPlayablePanelLink && (rootTraffic === 0 || rootTraffic === 1)) {`;
          if (source.includes(old)) {
            source = source.replace(old, replacement);
          } else if (!source.includes('const hasVerifiedPlayablePanelLink = verified.some')) {
            throw new Error('panel fallback condition not found');
          }
          fs.writeFileSync(file, source);
          NODE
          node --check scripts/sync-upera.mjs
          grep -F "const hasVerifiedPlayablePanelLink = verified.some" scripts/sync-upera.mjs
          node --test scripts/tests/*.test.mjs

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs
          if git diff --cached --quiet; then
            echo "Source fix already present."
          else
            git commit -m "fix: preserve verified panel playback for episodes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Run Iranian archive until publication
        id: iranian
        shell: bash
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: 'IRANIAN'
          UPERA_OPERATOR_DISCOVERY_ENABLED: 'false'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '10'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '12000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '220'
          UPERA_REQUEST_DELAY_MS: '400'
          UPERA_IRANIAN_SERIES_REQUEST_QUOTA: '180'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '5'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '1'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '30'
          UPERA_MAX_EPISODE_PAGES: '80'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        run: |
          set -euo pipefail
          count_published() {
            node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("catalog.json","utf8"));process.stdout.write(String((c.items||[]).filter(i=>i?.type==="series"&&i?.categoryKeys?.includes("iranian-series")&&i?.publicationStatus==="published").length));'
          }
          START="$(count_published)"
          echo "IRANIAN_PUBLISHED_BEFORE=${START}"

          RUNTIME="scripts/.sync-upera-panel-fallback-runtime.mjs"
          cp scripts/sync-upera.mjs "$RUNTIME"
          trap 'rm -f "$RUNTIME"' EXIT
          node - "$RUNTIME" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          let source=fs.readFileSync(file,'utf8');
          const needle='      await syncRecentIranianSeriesDiscovery();';
          const replacement="      if (process.env.APARATCHI_SKIP_IRANIAN_RECENT !== 'true') {\n        await syncRecentIranianSeriesDiscovery();\n      }";
          if (!source.includes(needle)) throw new Error('Iranian recent hook not found');
          source=source.replace(needle,replacement);
          fs.writeFileSync(file,source);
          NODE
          node --check "$RUNTIME"
          export APARATCHI_SKIP_IRANIAN_RECENT='true'

          AFTER="$START"
          for pass in $(seq 1 8); do
            echo "PANEL_FALLBACK_IRANIAN_PASS=${pass}"
            node "$RUNTIME"
            AFTER="$(count_published)"
            echo "IRANIAN_PUBLISHED_NOW=${AFTER}"
            if [ "$AFTER" -gt "$START" ]; then
              break
            fi
          done
          rm -f "$RUNTIME"
          trap - EXIT
          node scripts/rebuild-client-catalog.mjs
          echo "before=${START}" >> "$GITHUB_OUTPUT"
          echo "after=${AFTER}" >> "$GITHUB_OUTPUT"

      - name: Commit Iranian progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.sync-upera-panel-fallback-runtime.mjs .git/index.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Iranian catalog changes."
          else
            git commit -m "chore: publish Iranian series through panel playback"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Verify Iranian count moved
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ steps.iranian.outputs.before }}'
          AFTER='${{ steps.iranian.outputs.after }}'
          echo "VERIFIED_IRANIAN_BEFORE=${BEFORE}"
          echo "VERIFIED_IRANIAN_AFTER=${AFTER}"
          test -n "$BEFORE" && test -n "$AFTER"
          if [ "$AFTER" -le "$BEFORE" ]; then
            echo "::error::Iranian published count did not increase."
            exit 1
          fi
