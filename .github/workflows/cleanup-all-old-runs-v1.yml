name: Cleanup old Actions history v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-all-old-runs-v1.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Keep only recent core workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const core = new Set([321308935, 324092659, 334300764]);
            const keepPerCore = 5;
            const kept = new Map();
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let deleted = 0;
            for (const run of runs) {
              if (run.id === context.runId) continue;
              if (run.status !== 'completed') continue;
              if (core.has(run.workflow_id)) {
                const count = kept.get(run.workflow_id) || 0;
                if (count < keepPerCore) {
                  kept.set(run.workflow_id, count + 1);
                  continue;
                }
              }
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              deleted += 1;
            }
            core.notice(`Deleted ${deleted} completed historical runs; kept up to ${keepPerCore} per core workflow.`);
