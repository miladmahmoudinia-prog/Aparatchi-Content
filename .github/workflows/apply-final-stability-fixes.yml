name: Apply final stability fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-final-stability-fixes.mjs'
      - '.github/workflows/apply-final-stability-fixes.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply and validate final Content fixes
        shell: bash
        run: |
          set +e
          : > final-fix-output.log
          node scripts/apply-final-stability-fixes.mjs >> final-fix-output.log 2>&1
          patch_code=$?
          if [ "$patch_code" -eq 0 ]; then
            node --test scripts/tests/*.test.mjs >> final-fix-output.log 2>&1
            test_code=$?
          else
            test_code=0
          fi
          cat final-fix-output.log
          if [ "$patch_code" -ne 0 ] || [ "$test_code" -ne 0 ]; then
            code="$patch_code"
            if [ "$code" -eq 0 ]; then code="$test_code"; fi
            git restore scripts/sync-upera.mjs scripts/client-catalog.mjs .github/workflows/sync-upera.yml 2>/dev/null || true
            rm -f scripts/tests/final-stability.test.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final-fix-output.log
            git commit -m "diagnostic: Content final fixer validation failure" || true
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            exit "$code"
          fi
          rm -f final-fix-output.log

      - name: Commit fixed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs scripts/client-catalog.mjs .github/workflows/sync-upera.yml scripts/tests/final-stability.test.mjs
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "fix: stabilize series media people and episode backfill"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
