name: Stable detail aliases v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-stable-detail-alias-v1.mjs'
      - 'scripts/test-stable-detail-alias-v1.mjs'
      - 'catalog-index.json'
      - '.github/workflows/stable-detail-alias-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

# Stable pointers are tiny and can be rebuilt independently of the long hourly
# catalog sync. If a sync changes catalog-index.json, this workflow runs again
# from that exact revision so pointers never remain stale after content rotates.
concurrency:
  group: aparatchi-content-stable-detail-pointers
  cancel-in-progress: true

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Patch stable detail pointers
        run: node scripts/patch-stable-detail-alias-v1.mjs
      - name: Run full content regressions
        run: node --test scripts/tests/*.test.mjs
      - name: Rebuild client artifacts with stable pointers
        run: node scripts/rebuild-client-index.mjs
      - name: Verify every published title has a stable pointer
        run: node scripts/test-stable-detail-alias-v1.mjs
      - name: Verify real published media audit
        run: node scripts/audit-real-mobile-media-v2.mjs
      - name: Commit stable detail architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not republish catalog-index/catalog-items from this runner. Sync owns
          # those files. We only publish the generator changes and tiny stable
          # pointers built from the checked-out index/detail revision.
          git add -A -- scripts/client-catalog.mjs scripts/tests/client-catalog.test.mjs .github/workflows/sync-upera.yml .github/workflows/compact-client-index-v2.yml catalog-stable
          if git diff --cached --quiet; then
            echo "No stable-detail changes to commit."
            exit 0
          fi
          git commit -m "fix: publish lightweight stable detail pointers"

          # Keep only the verified commit, then rebase it onto any harmless main
          # movement. A later Sync index change triggers this workflow again.
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
