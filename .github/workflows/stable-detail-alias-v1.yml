name: Stable detail aliases v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-stable-detail-alias-v1.mjs'
      - 'scripts/test-stable-detail-alias-v1.mjs'
      - '.github/workflows/stable-detail-alias-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

# Stable aliases and the hourly catalog sync both publish generated client files.
# They must never rewrite main concurrently or the final rebase/push can race.
concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Patch stable detail aliases
        run: node scripts/patch-stable-detail-alias-v1.mjs
      - name: Run full content regressions
        run: node --test scripts/tests/*.test.mjs
      - name: Rebuild client artifacts with stable aliases
        run: node scripts/rebuild-client-index.mjs
      - name: Verify every published title has a stable detail alias
        run: node scripts/test-stable-detail-alias-v1.mjs
      - name: Verify real published media audit
        run: node scripts/audit-real-mobile-media-v2.mjs
      - name: Commit stable detail architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Include generated aliases even though they are new/untracked files.
          git add -A -- scripts/client-catalog.mjs scripts/tests/client-catalog.test.mjs .github/workflows/sync-upera.yml .github/workflows/compact-client-index-v2.yml catalog-index.json catalog-manifest.json catalog-items catalog-stable
          echo "Status before commit:"
          git status --short
          if git diff --cached --quiet; then
            echo "No stable-detail changes to commit."
            exit 0
          fi
          git commit -m "fix: publish stable detail aliases for every title"

          # Generated audit progress outside the intended publication is local to
          # this runner. The verified files are already captured in HEAD.
          git reset --hard HEAD
          git clean -fd

          # The shared aparatchi-content-write-lock prevents Sync Upera from
          # moving main while this publication is in progress.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo "main moved outside the shared content writer lock; refusing a stale publication."
            exit 1
          fi
          git push origin HEAD:main
