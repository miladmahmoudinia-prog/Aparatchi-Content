name: Stable detail audit v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/client-catalog.mjs'
      - 'scripts/tests/client-catalog.test.mjs'
      - 'scripts/test-stable-detail-alias-v1.mjs'
      - 'scripts/audit-real-mobile-media-v2.mjs'
      - '.github/workflows/stable-detail-alias-v1.yml'

permissions:
  contents: read

# Stable pointer generation is native in scripts/client-catalog.mjs and the
# hourly Sync Upera workflow commits catalog-stable together with catalog-index.
# This workflow audits the architecture and the entire currently published
# catalog without adding another write path or rebuilding generated content.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify stable pointer generator contract
        run: node --test scripts/tests/client-catalog.test.mjs

      - name: Verify every published title has a stable pointer
        run: node scripts/test-stable-detail-alias-v1.mjs

      - name: Verify real published media audit
        run: node scripts/audit-real-mobile-media-v2.mjs
