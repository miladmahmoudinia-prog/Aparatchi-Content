name: Stable detail aliases v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-stable-detail-alias-v1.mjs'
      - 'scripts/test-stable-detail-alias-v1.mjs'
      - 'catalog-index.json'
      - '.github/workflows/stable-detail-alias-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

# Stable pointers and the hourly content sync both publish generated client
# files. Serialize those writers so a verified pointer set cannot lose a push
# race against a catalog rebuild.
concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 40
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Patch stable detail pointers
        run: node scripts/patch-stable-detail-alias-v1.mjs
      - name: Run full content regressions
        run: node --test scripts/tests/*.test.mjs
      - name: Rebuild client artifacts with stable pointers
        run: node scripts/rebuild-client-index.mjs
      - name: Verify every published title has a stable pointer
        run: node scripts/test-stable-detail-alias-v1.mjs
      - name: Verify real published media audit
        run: node scripts/audit-real-mobile-media-v2.mjs
      - name: Commit stable detail architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Persist the real generator/test/workflow changes as well as every
          # lightweight per-title pointer. catalog-index/catalog-items remain
          # owned by Sync Upera and are intentionally not staged here.
          git add -A -- \
            scripts/client-catalog.mjs \
            scripts/tests/client-catalog.test.mjs \
            .github/workflows/sync-upera.yml \
            .github/workflows/compact-client-index-v2.yml \
            catalog-stable

          echo "Stable publication status:"
          git status --short

          if git diff --cached --quiet; then
            echo "No stable-detail changes to commit."
            exit 0
          fi

          git commit -m "fix: publish lightweight stable detail pointers"

          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            echo "Repository changed during stable-detail push; retry ${attempt}/5"
            sleep $((attempt * 2))
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Could not publish stable-detail architecture after 5 attempts."
            exit 1
          fi
