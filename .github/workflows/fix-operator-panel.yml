name: Apply operator panel sync fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-operator-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Patch operator panel handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/sync-upera.mjs')
          src = path.read_text()

          old_movie = "if (!hasBasicMetadata(movie) || options.panelCandidate === true) {"
          new_movie = "if (!hasBasicMetadata(movie) && options.panelCandidate !== true) {"
          if src.count(old_movie) != 1:
              raise SystemExit(f'panel movie detail guard: expected 1 match, got {src.count(old_movie)}')
          src = src.replace(old_movie, new_movie)

          series_pattern = re.compile(
              r"  const detail = await fetchSeriesDetail\(id\);\n"
              r"  if \(options\.panelCandidate === true\) \{\n"
              r"    try \{\n"
              r"      const panelEpisodes = await fetchPanelSeriesEpisodes\(id\);\n"
              r"      if \(panelEpisodes\.length\) detail\.episodes = panelEpisodes;\n"
              r"    \} catch \(error\) \{\n"
              r"      rememberError\(`panel-series-episodes-\$\{id\}`, error\);\n"
              r"    \}\n"
              r"  \}\n"
              r"  const series = detail\.series;"
          )
          series_lines = [
              "  let detail;",
              "  if (options.panelCandidate === true) {",
              "    // Panel series IDs belong to Upera's owner API, not Seeko's public API.",
              "    // Use the authenticated panel row as metadata and resolve episodes with the same ID.",
              "    let panelEpisodes = [];",
              "    let episodeDiscoveryComplete = true;",
              "    try {",
              "      panelEpisodes = await fetchPanelSeriesEpisodes(id);",
              "    } catch (error) {",
              "      episodeDiscoveryComplete = false;",
              "      rememberError(`panel-series-episodes-${id}`, error);",
              "    }",
              "    detail = {",
              "      series: { ...candidate, id, type: 'series' },",
              "      episodes: panelEpisodes,",
              "      episodeDiscoveryComplete,",
              "      episodePaginationPagesFetched: 0,",
              "      episodePaginationErrors: episodeDiscoveryComplete ? 0 : 1,",
              "    };",
              "  } else {",
              "    detail = await fetchSeriesDetail(id);",
              "  }",
              "  const series = detail.series;",
          ]
          src, count = series_pattern.subn('\n'.join(series_lines), src, count=1)
          if count != 1:
              raise SystemExit(f'panel series detail source: expected 1 match, got {count}')

          portal_pattern = re.compile(
              r"\.\.\.\(!panelLinks\.length\n"
              r"\s*\? publicLinks\.filter\(\(link\) => operatorPortalDetails\(link\?\.link\)\)\n"
              r"\s*: \[\]\),"
          )
          src, count = portal_pattern.subn(
              "...publicLinks.filter((link) => operatorPortalDetails(link?.link)),",
              src,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'affiliate portal merge: expected 1 match, got {count}')

          path.write_text(src)
          PY

      - name: Run regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs
          if git diff --cached --quiet; then
            echo "No patch changes."
            exit 0
          fi
          git commit -m "fix: use Upera panel IDs for operator catalog"
          git pull --rebase origin main
          git push origin HEAD:main
