name: Apply operator panel sync fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-operator-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Patch operator panel handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/sync-upera.mjs')
          src = path.read_text()

          movie_pattern = re.compile(
              r"  if \(!hasBasicMetadata\(movie\) \|\| options\.panelCandidate === true\) \{\n"
              r"    const detail = await fetchMovieDetail\(id\);\n"
              r"    movie = detail \? \{ \.\.\.candidate, \.\.\.detail, id \} : movie;\n"
              r"  \}"
          )
          movie_lines = [
              "  if (!hasBasicMetadata(movie) || options.panelCandidate === true) {",
              "    try {",
              "      const detail = await fetchMovieDetail(id);",
              "      movie = detail ? { ...candidate, ...detail, id } : movie;",
              "    } catch (error) {",
              "      // Upera owner-panel IDs are not always valid Seeko public IDs.",
              "      // Keep the authenticated panel metadata and continue to show_links.",
              "      if (options.panelCandidate !== true) throw error;",
              "      rememberError(`panel-movie-detail-${id}`, error);",
              "    }",
              "  }",
          ]
          src, count = movie_pattern.subn('\n'.join(movie_lines), src, count=1)
          if count != 1:
              raise SystemExit(f'panel movie detail fallback: expected 1 match, got {count}')

          series_pattern = re.compile(
              r"  const detail = await fetchSeriesDetail\(id\);\n"
              r"  if \(options\.panelCandidate === true\) \{\n"
              r"    try \{\n"
              r"      const panelEpisodes = await fetchPanelSeriesEpisodes\(id\);\n"
              r"      if \(panelEpisodes\.length\) detail\.episodes = panelEpisodes;\n"
              r"    \} catch \(error\) \{\n"
              r"      rememberError\(`panel-series-episodes-\$\{id\}`, error\);\n"
              r"    \}\n"
              r"  \}\n"
              r"  const series = detail\.series;"
          )
          series_lines = [
              "  let detail;",
              "  try {",
              "    detail = await fetchSeriesDetail(id);",
              "  } catch (error) {",
              "    if (options.panelCandidate !== true) throw error;",
              "    // Owner-panel series IDs can be absent from Seeko. Fall back to the",
              "    // authenticated panel row instead of rejecting a valid operator title.",
              "    rememberError(`panel-series-detail-${id}`, error);",
              "    detail = {",
              "      series: { ...candidate, id, type: 'series' },",
              "      episodes: [],",
              "      episodeDiscoveryComplete: true,",
              "      episodePaginationPagesFetched: 0,",
              "      episodePaginationErrors: 0,",
              "    };",
              "  }",
              "  if (options.panelCandidate === true) {",
              "    try {",
              "      const panelEpisodes = await fetchPanelSeriesEpisodes(id);",
              "      // The owner panel is the authoritative episode list for panel IDs.",
              "      detail.episodes = panelEpisodes;",
              "      detail.episodeDiscoveryComplete = true;",
              "      detail.episodePaginationErrors = 0;",
              "    } catch (error) {",
              "      detail.episodeDiscoveryComplete = false;",
              "      detail.episodePaginationErrors = Math.max(1, Number(detail.episodePaginationErrors || 0));",
              "      rememberError(`panel-series-episodes-${id}`, error);",
              "    }",
              "  }",
              "  const series = detail.series;",
          ]
          src, count = series_pattern.subn('\n'.join(series_lines), src, count=1)
          if count != 1:
              raise SystemExit(f'panel series detail fallback: expected 1 match, got {count}')

          portal_pattern = re.compile(
              r"\.\.\.\(!panelLinks\.length\n"
              r"\s*\? publicLinks\.filter\(\(link\) => operatorPortalDetails\(link\?\.link\)\)\n"
              r"\s*: \[\]\),"
          )
          src, count = portal_pattern.subn(
              "...publicLinks.filter((link) => operatorPortalDetails(link?.link)),",
              src,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'affiliate portal merge: expected 1 match, got {count}')

          path.write_text(src)
          PY

      - name: Run regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs
          if git diff --cached --quiet; then
            echo "No patch changes."
            exit 0
          fi
          git commit -m "fix: use Upera panel IDs for operator catalog"
          git pull --rebase origin main
          git push origin HEAD:main
