name: Verify episode play language reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-episode-play-language-reconciliation.mjs'
      - '.github/workflows/verify-episode-play-language-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch-rebuild-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply episode HLS language reconciliation
        run: node scripts/apply-episode-play-language-reconciliation.mjs
      - name: Check syntax
        run: node --check scripts/client-catalog.mjs
      - name: Rebuild app-facing catalog
        run: node scripts/rebuild-client-catalog.mjs
      - name: Verify reported real samples
        run: node scripts/verify-reported-language-samples.mjs
      - name: Run full regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Commit verified reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/client-catalog.mjs catalog-index.json catalog-items catalog-manifest.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "fix: reconcile episode stream language with real files"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
