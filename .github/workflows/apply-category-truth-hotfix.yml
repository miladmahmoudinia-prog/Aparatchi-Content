name: Apply Category Truth Hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-category-truth-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Keep animation and anime out of Programs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/classification.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const before = `  const isProgram = isChildrenProgram || isTalkShow || isRealityCompetition || isGeneralProgram ||\n    (trustedSpecializedKind && existingKind === 'program');`;
          const after = `  const isProgram = !isAnimation && (\n    isChildrenProgram || isTalkShow || isRealityCompetition || isGeneralProgram ||\n    (trustedSpecializedKind && existingKind === 'program')\n  );`;
          if (source.includes(before)) {
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          } else if (!source.includes(after)) {
            throw new Error('Program classification hook not found');
          }
          NODE

      - name: Reclassify existing catalog and rebuild client artifacts
        run: node scripts/migrate-regional-v13.mjs

      - name: Classification regression tests
        run: node --test scripts/tests/classification.test.mjs

      - name: Verify animation and anime are excluded from Programs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const items = Array.isArray(catalog.items) ? catalog.items : [];
          const bad = items.filter((item) =>
            (item?.isAnimation === true || item?.isAnime === true) &&
            (item?.contentKind === 'program' || item?.categoryKeys?.includes('programs'))
          );
          const sword = items.filter((item) => /sword art online/i.test(String(item?.name || '')));
          if (bad.length) {
            console.error(JSON.stringify(bad.slice(0, 20).map((item) => ({
              id: item.id,
              name: item.name,
              nameFa: item.nameFa,
              contentKind: item.contentKind,
              categoryKeys: item.categoryKeys,
            })), null, 2));
            throw new Error(`${bad.length} animation/anime rows still classified as programs`);
          }
          for (const item of sword) {
            if (item?.categoryKeys?.includes('programs')) {
              throw new Error(`Sword Art Online still in programs: ${item.name}`);
            }
          }
          console.log(JSON.stringify({
            animationOrAnimeInPrograms: bad.length,
            swordArtOnline: sword.map((item) => ({
              id: item.id,
              name: item.name,
              nameFa: item.nameFa,
              contentKind: item.contentKind,
              categoryKeys: item.categoryKeys,
            })),
          }, null, 2));
          NODE

      - name: Commit category and client output fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/classification.mjs catalog.json catalog-index.json catalog-bootstrap.json catalog-live.json catalog-manifest.json catalog-items catalog-stable 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No category/client changes to commit.'
            exit 0
          fi
          git commit -m 'fix: keep animation out of program categories'
          git pull --rebase origin main
          git push origin HEAD:main
