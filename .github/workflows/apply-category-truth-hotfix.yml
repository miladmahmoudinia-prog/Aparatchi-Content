name: Apply Category Truth Hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-category-truth-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Keep animation and anime out of Programs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/classification.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              `  const isTalkShow = Boolean(\n    includesAny(programIdentityText, talkShowTerms) ||\n    (trustedSpecializedKind && existingKind === 'talk-show')\n  );`,
              `  const isTalkShow = Boolean(!isAnimation && (\n    includesAny(programIdentityText, talkShowTerms) ||\n    (trustedSpecializedKind && existingKind === 'talk-show')\n  ));`,
            ],
            [
              `  const isRealityCompetition = Boolean(\n    includesAny(programIdentityText, realityTerms) ||\n    (trustedSpecializedKind && existingKind === 'reality-competition') ||\n    (trustedSpecializedKind && existingKeys.includes('reality'))\n  );`,
              `  const isRealityCompetition = Boolean(!isAnimation && (\n    includesAny(programIdentityText, realityTerms) ||\n    (trustedSpecializedKind && existingKind === 'reality-competition') ||\n    (trustedSpecializedKind && existingKeys.includes('reality'))\n  ));`,
            ],
            [
              `  const isGeneralProgram = includesAny(programIdentityText, generalProgramTerms) || includesAny(titleText, promotionalTitleTerms);`,
              `  const isGeneralProgram = !isAnimation && (includesAny(programIdentityText, generalProgramTerms) || includesAny(titleText, promotionalTitleTerms));`,
            ],
            [
              `  const isProgram = isChildrenProgram || isTalkShow || isRealityCompetition || isGeneralProgram ||\n    (trustedSpecializedKind && existingKind === 'program');`,
              `  const isProgram = !isAnimation && (\n    isChildrenProgram || isTalkShow || isRealityCompetition || isGeneralProgram ||\n    (trustedSpecializedKind && existingKind === 'program')\n  );`,
            ],
          ];
          for (const [before, after] of replacements) {
            if (source.includes(before)) source = source.replace(before, after);
            else if (!source.includes(after)) throw new Error(`Classification hook not found: ${before.slice(0, 70)}`);
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Reclassify existing catalog and rebuild client artifacts
        run: node scripts/migrate-regional-v13.mjs

      - name: Classification regression tests
        run: node --test scripts/tests/classification.test.mjs

      - name: Verify animation and anime are excluded from Programs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const items = Array.isArray(catalog.items) ? catalog.items : [];
          const programKinds = new Set(['program', 'reality-competition', 'talk-show']);
          const bad = items.filter((item) =>
            (item?.isAnimation === true || item?.isAnime === true) &&
            (programKinds.has(String(item?.contentKind || '')) ||
              item?.categoryKeys?.includes('programs') ||
              item?.categoryKeys?.includes('reality') ||
              item?.categoryKeys?.includes('talk-shows'))
          );
          const sword = items.filter((item) => /sword art online/i.test(String(item?.name || '')));
          if (bad.length) {
            console.error(JSON.stringify(bad.slice(0, 20).map((item) => ({
              id: item.id,
              name: item.name,
              nameFa: item.nameFa,
              contentKind: item.contentKind,
              categoryKeys: item.categoryKeys,
            })), null, 2));
            throw new Error(`${bad.length} animation/anime rows still carry program identity`);
          }
          for (const item of sword) {
            if (programKinds.has(String(item?.contentKind || '')) || item?.categoryKeys?.includes('programs')) {
              throw new Error(`Sword Art Online still carries program identity: ${item.name}`);
            }
          }
          console.log(JSON.stringify({
            animationOrAnimeWithProgramIdentity: bad.length,
            swordArtOnline: sword.map((item) => ({
              id: item.id,
              name: item.name,
              nameFa: item.nameFa,
              contentKind: item.contentKind,
              categoryKeys: item.categoryKeys,
            })),
          }, null, 2));
          NODE

      - name: Commit category and client output fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/classification.mjs catalog.json catalog-index.json catalog-bootstrap.json catalog-live.json catalog-manifest.json catalog-items catalog-stable 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No category/client changes to commit.'
            exit 0
          fi
          git commit -m 'fix: clear stale program identity from animation'
          git pull --rebase origin main
          git push origin HEAD:main
