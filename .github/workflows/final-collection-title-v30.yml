name: Final Collection Title Guard v30

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest-main repair branch
        uses: actions/checkout@v6
        with:
          ref: fix-collection-regression-v30
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Import already-validated permanent title guards
        run: |
          git fetch origin 160e2b971f664bf3011bf1fd9056be2c82e887ab
          git show 160e2b971f664bf3011bf1fd9056be2c82e887ab:scripts/persian-title-overrides.mjs > scripts/persian-title-overrides.mjs
          git show 160e2b971f664bf3011bf1fd9056be2c82e887ab:scripts/title-collection-truth-v18.mjs > scripts/title-collection-truth-v18.mjs
          git show 160e2b971f664bf3011bf1fd9056be2c82e887ab:scripts/tests/collection-title-preservation-v29.test.mjs > scripts/tests/collection-title-preservation-v29.test.mjs

      - name: Apply title truth to latest catalog and rebuild client artifacts
        env:
          TITLE_TRUTH_MAX_API_REPAIRS: 0
        run: node scripts/title-collection-truth-v18.mjs

      - name: Audit all recently reported collection/title regressions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const items = Array.isArray(catalog.items) ? catalog.items : [];
          const norm = (value) => String(value || '').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
          const expectedCollections = new Map([
            ['28 Days/Weeks/Years Later Collection', 'کالکشن ۲۸ روز بعد'],
            ['The Jester Collection', 'کالکشن دلقک'],
            ['Terrifier Collection', 'کالکشن ترساننده'],
            ['Mission: Impossible Collection', 'کالکشن مأموریت غیرممکن'],
            ["Rosemary's Baby Collection", 'کالکشن بچه رزماری'],
            ['Erdal ile Ece Koleksiyonu', 'کالکشن اردال و اجه'],
            ['Enola Holmes Collection', 'کالکشن انولا هولمز'],
            ['Admiral Yi Trilogy', 'کالکشن دریاسالار یی سون شین'],
            ['One Mile Collection', 'کالکشن یک مایل'],
            ['The Souvenir Collection', 'کالکشن یادگاری'],
            ['Pushpa Collection', 'کالکشن پوشپا'],
            ['Super Monsters Collection', 'کالکشن ابرهیولاها'],
            ['SpongeBob Collection', 'کالکشن باب اسفنجی'],
            ['Jack in the Box Collection', 'کالکشن جعبه اسباب‌بازی'],
            ['Sniper Collection', 'کالکشن تک‌تیرانداز'],
            ['Justice League (Tomorrowverse) Collection', 'کالکشن لیگ عدالت (تومارورس)'],
            ['Miraculous World', 'کالکشن دنیای دختر کفشدوزکی'],
            ['Aurora Teagarden Mystery Collection', 'کالکشن رازهای آرورا تیگاردن'],
            ['Knutsen & Ludvigsen Collection', 'کالکشن زبر و زرنگ'],
            ['Madea Collection', 'کالکشن مادیا'],
            ['PAW Patrol (Theatrical) Collection', 'کالکشن سگ‌های نگهبان'],
            ['Troll (2022) Collection', 'کالکشن غول'],
          ]);
          for (const [name, expected] of expectedCollections) {
            const members = items.filter((item) => norm(item.collectionName) === norm(name));
            if (!members.length) continue;
            const bad = members.filter((item) => item.collectionNameFa !== expected);
            if (bad.length) throw new Error(`${name}: ${bad.map((item) => item.collectionNameFa).join(' | ')}`);
          }
          const expectedTitles = new Map([
            ['The Jester', 'دلقک'], ['The Jester 2', 'دلقک ۲'],
            ['Justice League: Crisis on Infinite Earths Part One', 'لیگ عدالت: بحران در زمین‌های بی‌نهایت – قسمت اول'],
            ['Justice League: Crisis on Infinite Earths Part Two', 'لیگ عدالت: بحران در زمین‌های بی‌نهایت – قسمت دوم'],
            ['Justice League: Crisis on Infinite Earths Part Three', 'لیگ عدالت: بحران در زمین‌های بی‌نهایت – قسمت سوم'],
            ['Miraculous World: New York, United HeroeZ', 'دنیای دختر کفشدوزکی: ماجراجویی در نیویورک'],
            ['Miraculous World: Shanghai – The Legend of Ladydragon', 'دنیای دختر کفشدوزکی: ماجراجویی در شانگهای'],
            ['Aurora Teagarden Mysteries: How to Con a Con', 'رازهای آرورا تیگاردن: چگونه یک شیاد را فریب دهیم'],
            ['Aurora Teagarden Mysteries: A Lesson in Murder', 'رازهای آرورا تیگاردن: درسی در قتل'],
            ['Two Buddies and a Badger', 'زبر و زرنگ'],
            ['Two Buddies and a Badger 2 - The Great Big Beast', 'زبر و زرنگ ۲: هیولای عظیم'],
            ['A Madea Homecoming', 'بازگشت مادیا به خانه'],
            ["Madea's Destination Wedding", 'مادیا راهی عروسی می‌شود'],
            ['PAW Patrol: The Movie', 'سگ‌های نگهبان'],
            ['PAW Patrol: The Mighty Movie', 'سگ‌های نگهبان: فیلم بزرگ'],
            ['Troll', 'غول'], ['Troll 2', 'غول ۲'],
          ]);
          for (const [name, expected] of expectedTitles) {
            const item = items.find((candidate) => norm(candidate.name) === norm(name));
            if (item && item.nameFa !== expected) throw new Error(`${name}: ${item.nameFa}; expected ${expected}`);
          }
          const badCollectionPrefix = items.filter((item) => item.collectionNameFa && /^مجموعه\s/u.test(item.collectionNameFa));
          if (badCollectionPrefix.length) throw new Error(`legacy collection prefix remains: ${badCollectionPrefix.length}`);
          console.log(JSON.stringify({ auditedCollections: expectedCollections.size, auditedTitles: expectedTitles.size }, null, 2));
          NODE

      - name: Run complete Content regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Commit validated latest-main repair and remove one-shot workflow
        run: |
          rm -f .github/workflows/final-collection-title-v30.yml
          git config user.name "miladmahmoudinia-prog"
          git config user.email "milad.mahmoudinia@gmail.com"
          git add -A
          git commit -m "fix: harden Persian movie and collection titles"
          git push origin HEAD:fix-collection-regression-v30
