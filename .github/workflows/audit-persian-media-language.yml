name: Audit Persian Media Language

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-persian-media-language.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Audit live client and Iranian-series truth
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const serverItems = Array.isArray(catalog.items) ? catalog.items : [];
          const clientItems = Array.isArray(index.items) ? index.items : [];

          const normalized = (value) => String(value || '')
            .replace(/[\u200c\u200f\u202a-\u202e]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim()
            .toLowerCase();
          const isIranian = (item) => Boolean(
            item?.ir === true ||
            (Array.isArray(item?.countryCodes) && item.countryCodes.includes('IR')) ||
            (Array.isArray(item?.categoryKeys) && item.categoryKeys.includes('iranian-series'))
          );
          const usable = (file) => {
            const url = String(file?.url || '').trim();
            if (!/^https?:\/\//i.test(url)) return false;
            const mode = String(file?.mode || 'download');
            if (mode === 'operator-play' || mode === 'operator-download') return true;
            if (mode === 'play') return /\.(?:m3u8|mp4)(?:$|[?#])/i.test(url);
            return /\.(?:mp4|m4v|mov|webm|mkv)(?:$|[?#])/i.test(url);
          };
          const episodeTruth = (item) => {
            const keys = new Set();
            for (const section of Array.isArray(item?.downloads) ? item.downloads : []) {
              const episode = Number(section?.episodeNumber || 0);
              if (!(episode > 0)) continue;
              if (!(Array.isArray(section?.files) && section.files.some(usable))) continue;
              keys.add(`${Math.max(1, Number(section?.seasonNumber || 1))}:${episode}`);
            }
            const expected = Math.max(
              Number(item?.episodeCount || 0),
              Number(item?.latestEpisode?.episodeNumber || 0),
            );
            return { expectedEpisodes: expected, usableEpisodes: keys.size };
          };
          const isPeopleOfIran = (item) => {
            const fa = normalized(item?.nameFa || item?.titleFa || '');
            const en = normalized(item?.name || item?.title || '');
            return fa.includes('اهل ایران') || en === 'people of iran' || en.includes('people of iran');
          };
          const compact = (item) => item ? {
            id: item.id,
            nameFa: item.nameFa || item.titleFa || '',
            name: item.name || item.title || '',
            publicationStatus: item.publicationStatus || '',
            archiveComplete: item.archiveComplete === true,
            visibilityLocked: item.visibilityLocked === true,
            categoryKeys: item.categoryKeys || [],
            episodeCount: Number(item.episodeCount || 0),
            latestEpisode: item.latestEpisode || null,
            downloadSections: Array.isArray(item.downloads) ? item.downloads.length : 0,
            ...episodeTruth(item),
          } : null;

          const serverIranianSeries = serverItems.filter((item) => item?.type === 'series' && isIranian(item));
          const clientIranianSeries = clientItems.filter((item) => item?.type === 'series' && isIranian(item));
          const zeroUsable = serverIranianSeries
            .map((item) => ({ item, truth: episodeTruth(item) }))
            .filter(({ truth }) => truth.expectedEpisodes > 0 && truth.usableEpisodes === 0)
            .map(({ item }) => compact(item));
          const incomplete = serverIranianSeries
            .map((item) => ({ item, truth: episodeTruth(item) }))
            .filter(({ truth }) => truth.expectedEpisodes > truth.usableEpisodes)
            .sort((a, b) => (b.truth.expectedEpisodes - b.truth.usableEpisodes) - (a.truth.expectedEpisodes - a.truth.usableEpisodes))
            .slice(0, 20)
            .map(({ item }) => compact(item));

          const foreignWithoutPersianLanguage = clientItems.filter((item) => {
            if (!item || !['movie', 'series'].includes(item.type) || isIranian(item)) return false;
            const languages = Array.isArray(item.availableLanguages) ? item.availableLanguages : [];
            return !languages.includes('dubbed') && !languages.includes('subtitled');
          });
          const originalLeaks = clientItems.filter((item) => {
            const langs = [
              ...(Array.isArray(item?.availableLanguages) ? item.availableLanguages : []),
              ...(Array.isArray(item?.downloads) ? item.downloads.flatMap((section) => [
                section?.language,
                ...(Array.isArray(section?.files) ? section.files.map((file) => file?.language) : []),
              ]) : []),
            ].map(normalized);
            return langs.includes('original') || langs.includes('نسخه اصلی');
          });

          const report = {
            totalCatalogItems: serverItems.length,
            visibleClientItems: clientItems.length,
            iranianSeriesServerCount: serverIranianSeries.length,
            iranianSeriesClientVisibleCount: clientIranianSeries.length,
            serverIranianSeriesWithDeclaredEpisodesButZeroUsable: zeroUsable.length,
            zeroUsableSample: zeroUsable.slice(0, 20),
            incompleteIranianSeriesSample: incomplete,
            peopleOfIranServer: serverItems.filter(isPeopleOfIran).map(compact),
            peopleOfIranClient: clientItems.filter(isPeopleOfIran).map(compact),
            foreignClientWithoutDubOrSub: foreignWithoutPersianLanguage.length,
            originalLanguageLeaksInClient: originalLeaks.length,
            badForeignSample: foreignWithoutPersianLanguage.slice(0, 10).map((item) => ({ id: item.id, nameFa: item.nameFa, name: item.name })),
          };
          console.log('APARATCHI_CURRENT_AUDIT=' + JSON.stringify(report));
          if (foreignWithoutPersianLanguage.length || originalLeaks.length) process.exitCode = 1;
          NODE
