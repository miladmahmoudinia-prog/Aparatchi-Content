name: Diagnose UI truth v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ui-truth-v10.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit current catalog and client truth
        run: node scripts/diagnose-ui-truth-v10.mjs
