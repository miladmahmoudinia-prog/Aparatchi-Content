name: Audit short samples v38 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.title == 'RUN SHORT SAMPLE AUDIT V38'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit samples
        id: audit
        run: |
          node scripts/audit-short-samples-v38.mjs | tee /tmp/audit.txt
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/audit.txt
