name: Apply media language source now

on:
  push:
    paths:
      - 'scripts/apply-media-language-source-now.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-source-only-hotfix
  cancel-in-progress: false

jobs:
  patch-test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 60
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply strict language source patch
        run: node scripts/apply-media-language-truth-hotfix.mjs

      - name: Check syntax
        run: node --check scripts/sync-upera.mjs

      - name: Run regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Commit source-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "fix: never infer missing Upera media language"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
