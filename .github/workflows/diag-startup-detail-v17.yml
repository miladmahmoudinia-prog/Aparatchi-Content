name: Diagnose startup and detail previews v17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-startup-detail-v17.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Compare bootstrap and index truth
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const bootstrap = JSON.parse(fs.readFileSync('catalog-bootstrap.json', 'utf8'));
          const ix = index.items || [];
          const bs = bootstrap.items || [];
          const indexIds = ix.map(x => `${x.type}:${x.id}`);
          const bootstrapIds = bs.map(x => `${x.type}:${x.id}`);
          const sameOrder = indexIds.length === bootstrapIds.length && indexIds.every((id, i) => id === bootstrapIds[i]);
          const brief = x => x ? ({id:x.id,type:x.type,nameFa:x.nameFa,name:x.name,detailPath:x.detailPath,downloads:(x.downloads||[]).map(s=>({episodeNumber:s.episodeNumber,files:(s.files||[]).map(f=>({mode:f.mode,url:!!f.url,operatorOnly:f.operatorOnly,panelVerified:f.panelVerified,trafficOo:f.trafficOo}))})).slice(0,4),episodeCount:x.episodeCount,latestEpisode:x.latestEpisode,publicationStatus:x.publicationStatus,archiveComplete:x.archiveComplete}) : null;
          const find = (items, patterns) => items.find(x => patterns.some(p => `${x.nameFa||''} ${x.name||''}`.toLowerCase().includes(p)));
          const targets = [
            ['13 شمالی','13 shomali','سیزده شمالی'],
            ['نانی آباد','نواب نیاوران','niavaran'],
          ];
          console.log(JSON.stringify({
            counts:{index:indexIds.length,bootstrap:bootstrapIds.length},
            sameOrder,
            first20Index:ix.slice(0,20).map(x=>x.nameFa||x.name),
            first20Bootstrap:bs.slice(0,20).map(x=>x.nameFa||x.name),
            indexSeriesWithPreview:ix.filter(x=>x.type==='series' && Array.isArray(x.downloads) && x.downloads.length).length,
            bootstrapSeriesWithPreview:bs.filter(x=>x.type==='series' && Array.isArray(x.downloads) && x.downloads.length).length,
            targets:targets.map(patterns=>({patterns,index:brief(find(ix,patterns)),bootstrap:brief(find(bs,patterns))})),
          }, null, 2));
          NODE
