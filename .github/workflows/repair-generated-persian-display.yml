name: Repair generated Persian display names

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-generated-persian-display-fallback.mjs
      - .github/workflows/repair-generated-persian-display.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply upgradeable generated-title fallback
        run: node scripts/apply-generated-persian-display-fallback.mjs

      - name: Verify syntax and transliteration fixtures
        run: |
          node --check scripts/persian-title-overrides.mjs
          node --check scripts/enrich-persian-titles.mjs
          node --input-type=module <<'NODE'
          import { generatedPersianDisplayTitle, applyVerifiedPersianTitleOverrides } from './scripts/persian-title-overrides.mjs';
          const fixtures = new Map([
            ['3:10 to Yuma', '۳:۱۰ تو یوما'],
            ['Death Race 2000', 'دث ریس ۲۰۰۰'],
            ['Lupin III: The First', 'لوپین ۳: دِ فرست'],
            ['Rejime Talaei', 'رژیم طلایی'],
            ['Dìdi', 'دیدی'],
          ]);
          for (const [source, expected] of fixtures) {
            const actual = generatedPersianDisplayTitle(source);
            if (actual !== expected) throw new Error(`${source}: expected ${expected}, got ${actual}`);
            if (/\p{Script=Latin}/u.test(actual)) throw new Error(`${source}: Latin characters survived: ${actual}`);
          }
          const fixture = { items: [{ id:'x', type:'movie', name:'Kabir Singh', nameFa:'Kabir Singh' }] };
          applyVerifiedPersianTitleOverrides(fixture);
          if (/\p{Script=Latin}/u.test(fixture.items[0].nameFa)) throw new Error('Generated fallback left Latin script.');
          if (fixture.items[0].nameFaGenerated !== true || fixture.items[0].nameFaSource !== 'generated-transliteration') {
            throw new Error('Generated fallback marker missing.');
          }
          console.log('Generated Persian title fixtures passed.');
          NODE

      - name: Verify authoritative titles remain upgradeable
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('scripts/enrich-persian-titles.mjs', 'utf8');
          if (!source.includes('item?.nameFaGenerated === true')) throw new Error('Generated titles are not rechecked for authoritative metadata.');
          if (!source.includes('delete item.nameFaGenerated')) throw new Error('Authoritative metadata does not clear generated marker.');
          if (!source.includes("item.nameFaSource = 'authoritative-metadata'")) throw new Error('Authoritative source marker missing.');
          console.log('Authoritative upgrade guards passed.');
          NODE

      - name: Commit verified fallback logic
        run: |
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/persian-title-overrides.mjs scripts/enrich-persian-titles.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix: add upgradeable Persian-script display fallback"
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                PUSHED=1
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            [ "$PUSHED" -eq 1 ] || exit 1
          fi

      - name: Apply fallback to current catalog
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PERSIAN_TITLE_MAX_TITLES_PER_RUN: '1'
          PERSIAN_TITLE_REQUEST_DELAY_MS: '0'
          PERSIAN_TITLE_NEGATIVE_CACHE_HOURS: '1'
        run: node scripts/enrich-persian-titles.mjs

      - name: Audit display names and collections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const latin = /\p{Script=Latin}/u;
          const persian = /[\u0600-\u06FF]/;
          const titles = (catalog.items || []).filter((item) => item && ['movie','series'].includes(item.type));
          const latinTitles = titles.filter((item) => latin.test(String(item.nameFa || '')));
          const noPersianTitles = titles.filter((item) => {
            const display = String(item.nameFa || '').trim();
            const source = String(item.name || '').trim();
            const sourceHasLetters = /\p{L}/u.test(source);
            return sourceHasLetters && !persian.test(display);
          });
          const generated = titles.filter((item) => item.nameFaGenerated === true);

          const groups = new Map();
          for (const item of titles) {
            if (!item.collectionId) continue;
            const id = String(item.collectionId);
            if (!groups.has(id)) groups.set(id, []);
            groups.get(id).push(item);
          }
          const latinCollections = [];
          const numberedCollections = [];
          for (const [id, members] of groups) {
            const value = String(members.find((m) => m.collectionNameFa)?.collectionNameFa || '').trim();
            if (latin.test(value)) latinCollections.push({ id, value });
            if (/\s[۰-۹0-9]+\s*$/.test(value)) numberedCollections.push({ id, value });
          }

          console.log(`LATIN_DISPLAY_TITLES=${latinTitles.length}`);
          console.log(`LETTERED_TITLES_WITHOUT_PERSIAN=${noPersianTitles.length}`);
          console.log(`GENERATED_PERSIAN_TITLES=${generated.length}`);
          console.log(`LATIN_COLLECTION_NAMES=${latinCollections.length}`);
          console.log(`NUMBERED_PERSIAN_COLLECTION_NAMES=${numberedCollections.length}`);
          console.log(JSON.stringify(noPersianTitles.slice(0, 40).map((item) => ({id:item.id,name:item.name,nameFa:item.nameFa})), null, 2));
          if (latinTitles.length) throw new Error(`${latinTitles.length} display titles still contain Latin script.`);
          if (noPersianTitles.length) throw new Error(`${noPersianTitles.length} lettered titles still lack Persian script.`);
          if (latinCollections.length) throw new Error(`${latinCollections.length} collection names still contain Latin script.`);
          if (numberedCollections.length) throw new Error(`${numberedCollections.length} collection labels still end in installment numbers.`);
          NODE

      - name: Commit generated display names and rebuilt client catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-items catalog-manifest.json persian-title-cache.json
          if git diff --cached --quiet; then
            echo "No generated display-name changes to commit."
            exit 0
          fi
          git commit -m "fix: remove remaining Latin display names from catalog"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
