name: Repair generated Persian display names

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-generated-persian-display-fallback.mjs
      - .github/workflows/repair-generated-persian-display.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Retire synthetic Persian transliteration
        run: node scripts/apply-generated-persian-display-fallback.mjs

      - name: Verify title-source policy
        run: |
          node --check scripts/persian-title-overrides.mjs
          node --check scripts/enrich-persian-titles.mjs
          node --input-type=module <<'NODE'
          import { applyVerifiedPersianTitleOverrides } from './scripts/persian-title-overrides.mjs';

          const fixture = {
            items: [
              { id:'last', type:'movie', name:'Last appointment', nameFa:'لست اپویینتمنت', nameFaGenerated:true, nameFaSource:'generated-transliteration' },
              { id:'unknown', type:'movie', name:'Kabir Singh', nameFa:'کبیر سینگ', nameFaGenerated:true, nameFaSource:'generated-transliteration' },
              { id:'verified', type:'movie', name:'The Passage', nameFa:'گذرگاه', nameFaSource:'verified-override' },
            ],
          };
          applyVerifiedPersianTitleOverrides(fixture);
          const last = fixture.items.find((item) => item.id === 'last');
          const unknown = fixture.items.find((item) => item.id === 'unknown');
          const verified = fixture.items.find((item) => item.id === 'verified');
          if (last.nameFa !== 'آخرین قرار') throw new Error(`Last appointment was not repaired: ${last.nameFa}`);
          if (last.nameFaGenerated === true || last.nameFaSource === 'generated-transliteration') throw new Error('Verified Last appointment title still carries generated marker.');
          if (unknown.nameFa !== 'Kabir Singh') throw new Error(`Unknown title should use original name, got: ${unknown.nameFa}`);
          if (unknown.nameFaGenerated === true || unknown.nameFaSource !== 'original-title-fallback') throw new Error('Unknown fallback still uses generated transliteration metadata.');
          if (verified.nameFa !== 'گذرگاه') throw new Error('Verified Persian title was damaged.');
          console.log('Title-source policy fixtures passed.');
          NODE

      - name: Commit verified source policy
        run: |
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/persian-title-overrides.mjs scripts/enrich-persian-titles.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix: remove synthetic Persian transliteration fallback"
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                PUSHED=1
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            [ "$PUSHED" -eq 1 ] || exit 1
          fi

      - name: Repair current catalog and rebuild client artifacts
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PERSIAN_TITLE_MAX_TITLES_PER_RUN: '1'
          PERSIAN_TITLE_REQUEST_DELAY_MS: '0'
          PERSIAN_TITLE_NEGATIVE_CACHE_HOURS: '1'
        run: node scripts/enrich-persian-titles.mjs

      - name: Audit generated titles are gone
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const titles = (catalog.items || []).filter((item) => item && ['movie','series'].includes(item.type));
          const generated = titles.filter((item) => item.nameFaGenerated === true || item.nameFaSource === 'generated-transliteration');
          const lastAppointment = titles.filter((item) => String(item.name || '').trim().toLowerCase() === 'last appointment');
          if (generated.length) {
            console.log(JSON.stringify(generated.slice(0, 30).map((item) => ({ id:item.id, name:item.name, nameFa:item.nameFa, source:item.nameFaSource })), null, 2));
            throw new Error(`${generated.length} synthetic transliteration titles remain.`);
          }
          if (!lastAppointment.length) throw new Error('Last appointment fixture not found in catalog.');
          for (const item of lastAppointment) {
            if (item.nameFa !== 'آخرین قرار') throw new Error(`Last appointment still has wrong Persian title: ${item.nameFa}`);
          }
          console.log(`SYNTHETIC_TRANSLITERATIONS=${generated.length}`);
          console.log(`LAST_APPOINTMENT_MATCHES=${lastAppointment.length}`);
          NODE

      - name: Commit repaired catalog and rebuilt client catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-items catalog-manifest.json persian-title-cache.json
          if git diff --cached --quiet; then
            echo "No title-source catalog changes to commit."
            exit 0
          fi
          git commit -m "fix: replace synthetic Persian titles with trusted sources"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
