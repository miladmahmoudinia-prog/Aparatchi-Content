name: Repair Iranian Series Episodes

on:
  workflow_run:
    workflows:
      - 'Sync Upera Catalog'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 34

    steps:
      - name: Checkout latest content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Repair incomplete Iranian episode archives
        id: iranian_repair
        timeout-minutes: 28
        continue-on-error: true
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: 'IRANIAN'
          UPERA_OPERATOR_DISCOVERY_ENABLED: 'false'
          APARATCHI_SKIP_IRANIAN_RECENT: 'true'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '10'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '12000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '220'
          UPERA_REQUEST_DELAY_MS: '520'
          UPERA_IRANIAN_SERIES_REQUEST_QUOTA: '180'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '5'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '1'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '120'
          UPERA_MAX_EPISODE_PAGES: '80'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SYNC="scripts/.sync-upera-iranian-repair-runtime.mjs"
          cp scripts/sync-upera.mjs "$RUNTIME_SYNC"
          trap 'rm -f "$RUNTIME_SYNC"' EXIT
          node scripts/patch-iranian-visible-repair.mjs "$RUNTIME_SYNC"
          node --check "$RUNTIME_SYNC"

          IRANIAN_COMPLETED=0
          for pass in $(seq 1 4); do
            echo "Iranian repair pass ${pass}/4"
            node "$RUNTIME_SYNC"

            if [ ! -f sync-report-iranian.json ]; then
              echo "Iranian report missing; stop repair loop."
              break
            fi

            decision="$(node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("sync-report-iranian.json","utf8")); const processed=Number(report.iranianSeriesProcessed||0); const updated=Number(report.iranianSeriesAddedOrUpdated||0); const diagnostics=Array.isArray(report.iranianSeriesDiagnostics)?report.iranianSeriesDiagnostics:[]; const last=diagnostics.length?diagnostics[diagnostics.length-1]:null; const retry=Boolean(last&&last.retryLater); const stopped=Boolean(report.stoppedByTimeBudget); if(stopped||retry) process.stdout.write("stop"); else if(last&&last.result==="completed") process.stdout.write("completed"); else if(last&&last.result==="advanced") process.stdout.write("progress"); else if(last&&last.result==="rejected") process.stdout.write("skip"); else process.stdout.write(processed>0||updated>0?"progress":"skip");')"

            if [ "$decision" = "completed" ]; then
              IRANIAN_COMPLETED=$((IRANIAN_COMPLETED + 1))
              if [ "$IRANIAN_COMPLETED" -ge 3 ]; then
                echo "Completed three Iranian series episode archives in this repair run."
                break
              fi
              continue
            fi

            echo "Iranian repair made no complete-title progress (${decision}); checkpoint now instead of repeating the same rows."
            break
          done

      - name: Commit repaired Iranian episodes
        id: commit_repair
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .git/index.lock

          git add catalog.json catalog-index.json catalog-bootstrap.json catalog-live.json catalog-live-baseline.json catalog-items catalog-stable catalog-manifest.json sync-state.json sync-report*.json
          if [ -d assets/media ]; then
            git add assets/media
          fi

          if git diff --cached --quiet; then
            echo "No Iranian episode repair changes."
            exit 0
          fi

          git commit -m "chore: repair Iranian series episodes"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            rm -f .git/index.lock
            echo "Repository changed during repair push; retry ${attempt}/5"
            sleep $((attempt * 2))
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Could not push Iranian episode repair after 5 attempts."
            exit 1
          fi

      - name: Report real Iranian repair result
        if: always()
        shell: bash
        run: |
          if [ -f sync-report-iranian.json ]; then
            node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("sync-report-iranian.json","utf8")); const d=Array.isArray(r.iranianSeriesDiagnostics)?r.iranianSeriesDiagnostics:[]; const last=d[d.length-1]||{}; const scope=r.affiliateRequestScopes&&r.affiliateRequestScopes["iranian-series"]||{}; console.log(JSON.stringify({requests:Number(scope.used||0),processed:Number(r.iranianSeriesProcessed||0),updated:Number(r.iranianSeriesAddedOrUpdated||0),last},null,2));'
          fi
          if [ '${{ steps.iranian_repair.outcome }}' = 'failure' ]; then
            echo "::warning::Iranian repair stage failed; committed any checkpointed progress."
          fi
