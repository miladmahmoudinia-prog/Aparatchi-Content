name: Publish live catalog v44

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'RUN LIVE CATALOG V44'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate and publish the cumulative live catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-client-index.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-live.json catalog-live-baseline.json
          git rm .github/workflows/run-live-catalog-v44-temp.yml
          git commit -m "perf: publish current live catalog [skip ci]"
          git push origin HEAD:main
          gh issue comment "$ISSUE_NUMBER" --body "live-catalog-v44=published"
