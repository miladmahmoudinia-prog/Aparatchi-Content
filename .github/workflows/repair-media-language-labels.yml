name: Repair Media Language Labels

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-client-original-language.mjs'
      - '.github/workflows/repair-media-language-labels.yml'
  workflow_run:
    workflows:
      - 'Repair Iranian Series Episodes'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout latest content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply original-version language truth
        run: |
          node --check scripts/patch-client-original-language.mjs
          node scripts/patch-client-original-language.mjs
          node --check scripts/client-catalog.mjs
          node scripts/rebuild-client-catalog.mjs

      - name: Report badge coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const foreign = (index.items || []).filter((item) => item && item.ir !== true && item.operatorOnly !== true);
          const originals = foreign.filter((item) => Array.isArray(item.availableLanguages) && item.availableLanguages.includes('original'));
          const unlabeled = foreign.filter((item) => {
            const languages = Array.isArray(item.availableLanguages) ? item.availableLanguages : [];
            const files = (Array.isArray(item.downloads) ? item.downloads : []).flatMap((section) => Array.isArray(section?.files) ? section.files : []);
            const usable = files.some((file) => /^https?:\/\//i.test(String(file?.url || '')) && !String(file?.mode || '').startsWith('operator-'));
            return usable && languages.length === 0;
          });
          console.log(JSON.stringify({ foreignItems: foreign.length, originalBadges: originals.length, remainingPlayableWithoutLanguageBadge: unlabeled.length, sampleRemaining: unlabeled.slice(0, 12).map((item) => ({ id: item.id, title: item.nameFa || item.name })) }, null, 2));
          NODE

      - name: Commit language badge repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .git/index.lock
          git add scripts/client-catalog.mjs catalog-index.json catalog-bootstrap.json catalog-live.json catalog-live-baseline.json catalog-items catalog-stable catalog-manifest.json
          if git diff --cached --quiet; then
            echo "No media-language badge changes."
            exit 0
          fi
          git commit -m "fix: label neutral foreign media as original version"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            rm -f .git/index.lock
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
