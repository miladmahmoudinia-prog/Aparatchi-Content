name: Verify final content audit v36 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: github.event.issue.title == 'RUN FINAL CONTENT AUDIT V36'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run full content tests
        id: tests
        continue-on-error: true
        run: node --test scripts/tests/*.test.mjs
      - name: Audit current catalog invariants
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const items = Array.isArray(raw) ? raw : (Array.isArray(raw.items) ? raw.items : []);
          const keys = (item) => Array.isArray(item?.categoryKeys) ? item.categoryKeys.map(String) : [];
          const isDoc = (item) => item?.isDocumentary === true || item?.contentKind === 'documentary' || keys(item).some(k => /document/i.test(k));
          const isIranianMovieKey = (k) => /iran/i.test(k) && /movie|film/i.test(k);
          const docInIranianMovies = items.filter(item => item?.type === 'movie' && isDoc(item) && keys(item).some(isIranianMovieKey));
          const samples = ['شاهد','عبای سوخته','زنگ میناب','شه بانو','فرزانه جلیسی','فاطمیه در کلیسا','غدیر از کانت تا وایسکه','نجیب زادگی','سلطان ناصر'];
          const sampleRows = samples.map(title => {
            const item = items.find(x => String(x?.nameFa || x?.name_fa || x?.name || '').trim() === title);
            return item ? {title, type:item.type, isDocumentary:isDoc(item), categoryKeys:keys(item)} : {title, missing:true};
          });
          const operatorLike = (item) => keys(item).some(k => /operator|mobile|hamrah|همراه/i.test(k)) || item?.contentVariant === 'operator' || item?.operatorOnly === true;
          const files = (item) => (Array.isArray(item?.downloads) ? item.downloads : []).flatMap(g => Array.isArray(g?.files) ? g.files : []);
          const operatorFile = (f) => f?.operatorOnly === true || f?.isOperator === true || f?.accessMode === 'operator' || f?.traffic_oo === 1 || f?.trafficOo === 1 || /operator|همراه/i.test(JSON.stringify(f || {}));
          const operatorItems = items.filter(operatorLike);
          const operatorWithoutEvidence = operatorItems.filter(item => !files(item).some(operatorFile) && !/operator/i.test(String(item?.contentVariant || '')));
          const iranianSeries = items.filter(item => item?.type === 'series' && keys(item).some(k => /iran/i.test(k) && /series/i.test(k)) && item?.publicationStatus !== 'building-archive');
          const report = {items:items.length, docInIranianMovies:docInIranianMovies.slice(0,20).map(x=>x.nameFa||x.name), docInIranianMoviesCount:docInIranianMovies.length, operatorItems:operatorItems.length, operatorWithoutEvidenceCount:operatorWithoutEvidence.length, iranianSeriesPublished:iranianSeries.length, sampleRows};
          fs.writeFileSync('/tmp/catalog-audit.json', JSON.stringify(report));
          console.log(JSON.stringify(report,null,2));
          if (docInIranianMovies.length) process.exitCode = 1;
          if (operatorWithoutEvidence.length) process.exitCode = 1;
          for (const row of sampleRows) if (!row.missing && (!row.isDocumentary || row.categoryKeys.some(isIranianMovieKey))) process.exitCode = 1;
          NODE
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TESTS: ${{ steps.tests.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          detail='{}'
          [ -f /tmp/catalog-audit.json ] && detail="$(cat /tmp/catalog-audit.json)"
          gh issue comment "$ISSUE_NUMBER" --body "tests=${TESTS}\naudit=${AUDIT}\nhead=$(git rev-parse HEAD)\n\`${detail}\`"
      - name: Fail on audit failure
        if: steps.tests.outcome != 'success' || steps.audit.outcome != 'success'
        run: exit 1
