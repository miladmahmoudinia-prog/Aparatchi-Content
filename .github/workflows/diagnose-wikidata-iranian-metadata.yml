name: Diagnose strict Wikidata metadata coverage

on:
  push:
    branches:
      - main
    paths:
      - scripts/diagnose-wikidata-iranian-metadata.mjs
      - .github/workflows/diagnose-wikidata-iranian-metadata.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Diagnose strict Wikidata metadata coverage
        run: node scripts/diagnose-wikidata-iranian-metadata.mjs
