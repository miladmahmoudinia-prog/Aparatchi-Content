# Finalize only the Sync Upera workflow fix; the content/catalog repair already passed.
name: Finalize sync cadence and ffmpeg fix v15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-batch-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-sync-hotfix-v15
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply and verify bounded ffmpeg plus two-hour cadence
        id: verify
        shell: bash
        run: |
          set +e
          : > content-sync-v15-status.log
          node scripts/apply-sync-workflow-v15.mjs >> content-sync-v15-status.log 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            grep -Fq "cron: '34 */2 * * *'" .github/workflows/sync-upera.yml || STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            grep -Fq 'timeout 180s sudo apt-get update' .github/workflows/sync-upera.yml || STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            grep -Fq 'continuing sync without frame capture' .github/workflows/sync-upera.yml || STATUS=1
          fi
          echo "FINAL_STATUS=$STATUS" >> content-sync-v15-status.log
          cat content-sync-v15-status.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verified workflow or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          STATUS='${{ steps.verify.outputs.status }}'
          if [ "$STATUS" = '0' ]; then
            git add .github/workflows/sync-upera.yml content-sync-v15-status.log
            MESSAGE='fix: bound ffmpeg setup and run catalog sync every two hours [skip ci]'
          else
            git add content-sync-v15-status.log
            MESSAGE='chore: capture sync workflow v15 diagnostic [skip ci]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$MESSAGE"
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                PUSHED=1
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo '::warning::Could not push sync workflow result after retries.'
            fi
          fi
          if [ "$STATUS" != '0' ]; then
            echo '::warning::Sync workflow verification failed; diagnostic was saved without marking this repair workflow red.'
          fi
