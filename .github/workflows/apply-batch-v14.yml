# Single consolidated repair pass for the current Content batch.
name: Apply consolidated Aparatchi content fixes v15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-batch-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 80

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply migrate and verify current Content batch
        id: verify
        shell: bash
        run: |
          set +e
          : > content-v15-status.log
          STATUS=0

          if ! grep -Fq 'latestForwardEpisode' scripts/sync-upera.mjs; then
            node scripts/apply-user-report-v12.mjs >> content-v15-status.log 2>&1
            STATUS=$?
          else
            echo 'v12 content source fix already present.' >> content-v15-status.log
          fi

          if [ "$STATUS" -eq 0 ]; then
            if ! grep -Fq 'Original language is the strongest identity signal for Korean/Indian shelves' scripts/classification.mjs; then
              node scripts/apply-regional-v13.mjs >> content-v15-status.log 2>&1
              STATUS=$?
            else
              echo 'v13 regional source fix already present.' >> content-v15-status.log
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            node scripts/apply-sync-workflow-v15.mjs >> content-v15-status.log 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            node --test \
              scripts/tests/user-report-v12.test.mjs \
              scripts/tests/classification.test.mjs \
              scripts/tests/home-bootstrap-v1.test.mjs \
              scripts/tests/full-navigation-bootstrap-v1.test.mjs \
              >> content-v15-status.log 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            node scripts/migrate-regional-v13.mjs >> content-v15-status.log 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            node --test \
              scripts/tests/user-report-v12.test.mjs \
              scripts/tests/classification.test.mjs \
              scripts/tests/home-bootstrap-v1.test.mjs \
              scripts/tests/full-navigation-bootstrap-v1.test.mjs \
              >> content-v15-status.log 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            node scripts/audit-regional-v13.mjs >> content-v15-status.log 2>&1
            STATUS=$?
          fi

          echo "FINAL_STATUS=$STATUS" >> content-v15-status.log
          cat content-v15-status.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verified result or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          STATUS='${{ steps.verify.outputs.status }}'
          if [ "$STATUS" = '0' ]; then
            git add scripts/sync-upera.mjs scripts/client-catalog.mjs scripts/classification.mjs scripts/persian-title-overrides.mjs \
              .github/workflows/sync-upera.yml \
              catalog.json catalog-index.json catalog-bootstrap.json catalog-manifest.json catalog-items catalog-stable content-v15-status.log
            MESSAGE='fix: apply verified freshness detail regional sync and catalog truth v15 [skip ci]'
          else
            git add content-v15-status.log
            MESSAGE='chore: capture content v15 repair diagnostic [skip ci]'
          fi

          if ! git diff --cached --quiet; then
            git commit -m "$MESSAGE"
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                PUSHED=1
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo '::warning::Could not push Content v15 result after retries.'
            fi
          fi

          if [ "$STATUS" != '0' ]; then
            echo '::warning::Content v15 verification did not pass; diagnostic was saved without marking the workflow red.'
          fi
