name: Final content fixes retry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/final-user-batch-retry-trigger-20260814.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply final fixes
        run: node scripts/apply-final-user-batch-20260814-retry.mjs
      - name: Validate
        run: |
          node --check scripts/sync-upera.mjs
          node --test scripts/tests/*.test.mjs
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: enforce strict dub subtitle and verified operator transport"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
