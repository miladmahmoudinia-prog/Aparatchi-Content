name: Diagnose fresh Upera language evidence v7

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-upera-language-evidence-v7.mjs'
      - '.github/workflows/diagnose-upera-language-evidence-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Probe current provider language evidence
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN || secrets.UPERA_PANEL_TOKEN }}
        run: node scripts/diagnose-upera-language-evidence-v7.mjs
