name: Verify overview and cast enrichment

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-overview-cast-enrichment-fix.mjs'
      - 'scripts/rebuild-client-catalog.mjs'
      - '.github/workflows/verify-overview-cast-enrichment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  patch-enrich-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify TMDB secret
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          test -n "$TMDB_READ_ACCESS_TOKEN" || { echo "TMDB_READ_ACCESS_TOKEN is missing" >&2; exit 1; }
      - name: Apply overview and cast enrichment repair
        run: node scripts/apply-overview-cast-enrichment-fix.mjs
      - name: Check enrichment syntax
        run: node --check scripts/enrich-tmdb.mjs
      - name: Check rebuild command syntax
        run: node --check scripts/rebuild-client-catalog.mjs
      - name: Run regression locks before live enrichment
        run: node --test scripts/tests/overview-cast-enrichment.test.mjs scripts/tests/final-stability.test.mjs
      - name: Enrich missing overview, cast and crew from TMDB
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_MAX_TITLES_PER_RUN: '3000'
          TMDB_REQUEST_DELAY_MS: '260'
          TMDB_REFRESH_DAYS: '30'
          TMDB_MAX_ACTORS: '18'
          TMDB_MAX_DIRECTORS: '4'
        run: node scripts/enrich-tmdb.mjs
      - name: Rebuild client catalog
        run: node scripts/rebuild-client-catalog.mjs
      - name: Run full regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Commit verified metadata enrichment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts catalog.json catalog-index.json catalog-items catalog-manifest.json tmdb-cache.json tmdb-enrichment-report.json assets/media
          if git diff --cached --quiet; then
            echo "No metadata changes."
            exit 0
          fi
          git commit -m "fix: fill missing overviews cast and crew"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
