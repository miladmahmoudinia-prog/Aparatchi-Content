name: Reclassify smart categories v38 temp

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.issue.title == 'RUN CATALOG RECLASSIFY V38'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 40
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Reclassify current catalog
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN || secrets.TMDB_READ_ACCESS_TOKEN }}
          UPERA_SYNC_MODE: 'PEOPLE'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '7'
          APARATCHI_CHECKPOINT_RESERVE_MS: '20000'
          APARATCHI_REQUEST_TIMEOUT_MS: '10000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '1'
          UPERA_MAX_REQUESTS_PER_RUN: '20'
          APARATCHI_PEOPLE_TITLES_PER_RUN: '0'
          APARATCHI_OPERATOR_OVERVIEWS_PER_RUN: '0'
          APARATCHI_EPISODE_ARTWORK_SERIES_PER_RUN: '0'
          APARATCHI_EPISODE_ARTWORK_MIRROR_PER_RUN: '0'
          APARATCHI_EPISODE_FRAME_CAPTURES_PER_RUN: '0'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
          APARATCHI_OPERATOR_CLASSIFICATION_PER_RUN: '40'
        run: node scripts/sync-upera.mjs
      - name: Verify reported categories
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const catalog = JSON.parse(await fs.readFile('catalog.json','utf8'));
          const items = catalog.items || [];
          const norm = v => String(v || '').toLowerCase().normalize('NFKC').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\s+/g,' ').trim();
          const find = name => items.find(i => norm(i.nameFa) === norm(name) || norm(i.name) === norm(name));
          const shortNames = ['لمس جهان','دنیای شیرین','محبت بی واژه','ملودی چوب','معلم معلول','داستان زندگی دو خواهر ناشنوا','همنشین آبی','داستانی از تلاش و امید','دستان گچی','دغدغه','یک روز معمولی'];
          const docNames = ['فروغ فرخزاد: ۱۳۱۳-۱۳۴۵','پا به پای آزادی','امپراتور و ما','اشغال جزایر','اتو استاپ','آزادی در مه'];
          const failures = [];
          for (const name of shortNames) {
            const item = find(name); if (!item) continue;
            if (!item.categoryKeys?.includes('short-films') || item.categoryKeys?.includes('iranian-movies')) failures.push({name, keys:item.categoryKeys, kind:item.contentKind});
          }
          for (const name of docNames) {
            const item = find(name); if (!item) continue;
            if (!item.categoryKeys?.includes('documentaries') || item.categoryKeys?.includes('iranian-movies')) failures.push({name, keys:item.categoryKeys, kind:item.contentKind});
          }
          const teaser = find('تیزر جشنواره ارغوان');
          if (teaser && (!teaser.categoryKeys?.includes('programs') || teaser.categoryKeys?.includes('iranian-movies'))) failures.push({name:teaser.nameFa, keys:teaser.categoryKeys, kind:teaser.contentKind});
          const weakRegionalOperator = items.filter(i => i.operatorOnly === true && i.operatorClassificationStatus === 'pending' && (i.categoryKeys?.includes('iranian-movies') || i.categoryKeys?.includes('foreign-movies') || i.categoryKeys?.includes('iranian-series') || i.categoryKeys?.includes('foreign-series')));
          if (weakRegionalOperator.length) failures.push({weakRegionalOperator: weakRegionalOperator.slice(0,10).map(i=>({name:i.nameFa,keys:i.categoryKeys}))});
          console.log(JSON.stringify({shortFound:shortNames.filter(n=>find(n)).length, documentaryFound:docNames.filter(n=>find(n)).length, teaser:teaser?{kind:teaser.contentKind,keys:teaser.categoryKeys}:null, pendingOperatorRegional:weakRegionalOperator.length, failures},null,2));
          if (failures.length) process.exit(1);
          NODE
      - name: Commit catalog repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-bootstrap.json catalog-items catalog-stable catalog-manifest.json sync-state.json sync-report*.json
          if git diff --cached --quiet; then
            echo "No generated catalog changes."
          else
            git commit -m "chore: reclassify smart content categories v38"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue comment ${{ github.event.issue.number }} --body "catalog-reclassify-v38=success\nhead=$(git rev-parse HEAD)"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue comment ${{ github.event.issue.number }} --body "catalog-reclassify-v38=failure\nrun=${{ github.run_id }}\nhead=$(git rev-parse HEAD)"