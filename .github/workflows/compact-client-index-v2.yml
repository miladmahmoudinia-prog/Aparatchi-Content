name: Compact mobile client index v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-client-index-performance-v2.mjs'
      - 'scripts/rebuild-client-index.mjs'
      - '.github/workflows/compact-client-index-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-compact-client-index-v2
  cancel-in-progress: true

jobs:
  compact-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Patch client index builder
        run: node scripts/patch-client-index-performance-v2.mjs

      - name: Run content regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Rebuild compact client index
        run: node scripts/rebuild-client-index.mjs

      - name: Audit compact client index
        shell: bash
        run: |
          node scripts/audit-client-index-size.mjs | tee /tmp/index-audit.txt
          BYTES=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('catalog-manifest.json','utf8')); process.stdout.write(String(p.clientSizeBytes||0))")
          echo "clientSizeBytes=$BYTES"
          if [ "$BYTES" -ge 8500000 ]; then
            echo "::error::Client index is still too large: $BYTES bytes"
            exit 1
          fi

      - name: Commit compact verified client index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/client-catalog.mjs scripts/tests/client-catalog.test.mjs scripts/tests/final-stability.test.mjs catalog-index.json catalog-manifest.json catalog-items
          if git diff --cached --quiet; then
            echo "No compact-index changes to commit."
            exit 0
          fi
          git commit -m "perf: compact mobile client index"
          git pull --rebase origin main
          git push origin HEAD:main
