name: Fix Collection Title Truth v28

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply systemic collection-title repair
        run: node scripts/fix-collection-title-batch-v28.mjs

      - name: Rebuild real collection truth and client artifacts
        env:
          TITLE_TRUTH_MAX_API_REPAIRS: '0'
        run: node scripts/title-collection-truth-v18.mjs

      - name: Audit reported collections and systemic guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { applyVerifiedPersianTitleOverrides } from './scripts/persian-title-overrides.mjs';

          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const items = Array.isArray(index.items) ? index.items : [];
          const norm = (value) => String(value || '').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

          const expectedCollections = new Map([
            ['28 Days/Weeks/Years Later Collection', 'کالکشن ۲۸ روز بعد'],
            ['The Jester Collection', 'کالکشن دلقک'],
            ['Terrifier Collection', 'کالکشن ترساننده'],
            ['Mission: Impossible Collection', 'کالکشن مأموریت غیرممکن'],
            ["Rosemary's Baby Collection", 'کالکشن بچه رزماری'],
            ['Erdal ile Ece Koleksiyonu', 'کالکشن اردال و اجه'],
            ['Enola Holmes Collection', 'کالکشن انولا هولمز'],
            ['Admiral Yi Trilogy', 'کالکشن دریاسالار یی سون شین'],
            ['One Mile Collection', 'کالکشن یک مایل'],
            ['The Souvenir Collection', 'کالکشن یادگاری'],
            ['Pushpa Collection', 'کالکشن پوشپا'],
            ['Downton Abbey (Films) Collection', 'کالکشن دانتون ابی'],
            ['Miraculous World', 'کالکشن دنیای میراکلس'],
            ['Rurouni Kenshin Collection', 'کالکشن شمشیرزن دوره‌گرد'],
            ['Super Monsters Collection', 'کالکشن ابرهیولاها'],
            ['SpongeBob Collection', 'کالکشن باب اسفنجی'],
            ['Jack in the Box Collection', 'کالکشن جعبه اسباب‌بازی'],
            ['Sniper Collection', 'کالکشن تک‌تیرانداز'],
          ]);

          const audited = [];
          for (const [collectionName, expectedFa] of expectedCollections) {
            const members = items.filter((item) => norm(item.collectionName) === norm(collectionName));
            if (!members.length) throw new Error(`reported collection missing from real index: ${collectionName}`);
            const bad = members.filter((item) => item.collectionNameFa !== expectedFa);
            if (bad.length) throw new Error(`${collectionName} still has bad Persian collection names: ${bad.map((item) => item.collectionNameFa).join(' | ')}`);
            audited.push({ collectionName, collectionNameFa: expectedFa, count: members.length });
          }

          const expectedTitles = new Map([
            ['Terrifier', 'ترساننده'],
            ['Terrifier 2', 'ترساننده ۲'],
            ['Terrifier 3', 'ترساننده ۳'],
            ["Rosemary's Baby", 'بچه رزماری'],
            ['Apartment 7A', 'آپارتمان ۷A'],
            ['Erdal and Ece', 'اردال و اجه'],
            ['Erdal and Ece 2', 'اردال و اجه ۲'],
            ['Enola Holmes 2', 'انولا هولمز ۲'],
            ['Enola Holmes 3', 'انولا هولمز ۳'],
            ['One Mile: Chapter One', 'یک مایل: بخش اول'],
            ['One Mile: Chapter Two', 'یک مایل: بخش دوم'],
            ['The Souvenir: Part II', 'یادگاری: قسمت دوم'],
            ['The Eternal Daughter', 'دختر ابدی'],
            ['Pushpa: The Rise - Part 1', 'پوشپا: ظهور – قسمت ۱'],
            ['Pushpa 2: The Rule', 'پوشپا ۲: قانون'],
            ['Super Monsters: The New Class', 'ابرهیولاها: کلاس جدید'],
            ["Super Monsters: Santa's Super Monster Helpers", 'ابرهیولاها: دستیاران بابانوئل'],
            ['The SpongeBob Movie: Search for SquarePants', 'فیلم باب اسفنجی: جست‌وجوی شلوار مکعبی'],
            ['The SpongeBob Movie: Sponge on the Run', 'فیلم باب اسفنجی: اسفنج در حال فرار'],
            ['The Jack in the Box', 'جعبه اسباب‌بازی'],
            ['The Jack in the Box Rises', 'جعبه جهنمی'],
            ['Sniper: G.R.I.T. - Global Response & Intelligence Team', 'تک‌تیرانداز: G.R.I.T. – تیم واکنش و اطلاعات جهانی'],
            ['Sniper: The Last Stand', 'تک‌تیرانداز: آخرین سنگر'],
            ['Sniper No Nation', 'تک‌تیرانداز: بی‌وطن'],
          ]);
          for (const [name, expectedFa] of expectedTitles) {
            const item = items.find((candidate) => norm(candidate.name) === norm(name));
            if (!item) continue;
            if (item.nameFa !== expectedFa) throw new Error(`${name} = ${item.nameFa}; expected ${expectedFa}`);
          }

          const eternal = items.find((item) => norm(item.name) === norm('The Eternal Daughter'));
          if (eternal && norm(eternal.collectionName) === norm('The Souvenir Collection')) {
            throw new Error('The Eternal Daughter is still incorrectly inside The Souvenir Collection');
          }
          const souvenir = items.find((item) => norm(item.name) === norm('The Souvenir'));
          const souvenir2 = items.find((item) => norm(item.name) === norm('The Souvenir: Part II'));
          if (souvenir && souvenir2 && souvenir.collectionId !== souvenir2.collectionId) {
            throw new Error('The Souvenir Part I is not grouped with Part II');
          }

          const oldPrefix = items.filter((item) => /^مجموعه\s+/u.test(String(item.collectionNameFa || '')));
          if (oldPrefix.length) throw new Error(`old مجموعه prefix remains on ${oldPrefix.length} collection members`);

          const synthetic = {
            items: [
              { id: 'future-1', type: 'movie', name: 'Future Saga: Chapter One', nameFa: 'حماسه آینده: بخش اول', collectionId: 'future', collectionName: 'Future Saga Collection', collectionNameFa: 'مجموعه حماسه آینده: بخش اول', collectionOrder: 1 },
              { id: 'future-2', type: 'movie', name: 'Future Saga: Chapter Two', nameFa: 'حماسه آینده: بخش دوم', collectionId: 'future', collectionName: 'Future Saga Collection', collectionNameFa: 'مجموعه حماسه آینده: بخش اول', collectionOrder: 2 },
            ],
          };
          applyVerifiedPersianTitleOverrides(synthetic);
          for (const item of synthetic.items) {
            if (item.collectionNameFa !== 'کالکشن Future Saga') {
              throw new Error(`systemic guard still inherits member title: ${item.collectionNameFa}`);
            }
          }

          console.log(JSON.stringify({ auditedCollections: audited, oldPrefixCount: oldPrefix.length, systemicFallback: synthetic.items[0].collectionNameFa }, null, 2));
          NODE

      - name: Run complete Content regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Remove one-shot files and commit validated repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-collection-titles-v28.yml
          rm -f scripts/fix-collection-title-batch-v28.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make collection titles safe and consistent"
          git push origin HEAD:${{ github.head_ref }}
