name: One-shot apply operator detail v34 to current main

on:
  push:
    branches: [main]
    paths:
      - 'operator-detail-v34-current-trigger.txt'

permissions:
  contents: write

concurrency:
  group: aparatchi-operator-detail-v34-current
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact current main trigger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Rebuild current catalog with v34 truth
        run: node scripts/rebuild-operator-detail-v34-current.mjs

      - name: Full content regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Verify reported categories and current bootstrap
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('catalog-index.json', 'utf8'));
          const bootstrap = JSON.parse(fs.readFileSync('catalog-bootstrap.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('catalog-manifest.json', 'utf8'));
          const normalize = (v) => String(v || '')
            .normalize('NFKC')
            .replace(/[\u064B-\u065F\u0670\u0640\u200C\u200D]/g, '')
            .replace(/[يىئ]/g, 'ی').replace(/ك/g, 'ک').replace(/[أإٱآ]/g, 'ا').replace(/[ۀة]/g, 'ه')
            .replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim();
          const wanted = ['شاهد','عبای سوخته','زنگ میناب','شه بانو','فرزانه جلیسی','فاطمیه در کلیسا','غدیر از کانت تا وایسکه','نجیب زادگی','سلطان ناصر'];
          const report = [];
          for (const name of wanted) {
            const full = catalog.items.find((entry) => normalize(entry.nameFa) === normalize(name));
            const client = index.items.find((entry) => normalize(entry.nameFa) === normalize(name));
            const item = client || full;
            if (!item) { report.push({ name, found: false }); continue; }
            const keys = item.categoryKeys || [];
            if (!keys.includes('documentaries') || keys.includes('iranian-movies')) {
              throw new Error(`${name}: wrong categories ${JSON.stringify(keys)}`);
            }
            report.push({ name, found: true, clientVisible: Boolean(client), categories: keys, overview: Boolean(item.overview), people: item.people?.length || 0 });
          }
          if (bootstrap.clientRevision !== manifest.clientRevision) throw new Error('bootstrap/clientRevision mismatch');
          if (bootstrap.items.some((item) => Array.isArray(item.people) && item.people.length > 8)) throw new Error('bootstrap people preview exceeded 8');
          const operatorRows = index.items.filter((item) => (item.categoryKeys || []).includes('mobile-operator'));
          if (operatorRows.some((item) => item.operatorOnly !== true && item.access !== 'operator')) {
            throw new Error('mobile-operator client row is not operator-only');
          }
          console.log(JSON.stringify({ report, operatorRows: operatorRows.length, bootstrapItems: bootstrap.items.length, bootstrapBytes: Buffer.byteLength(JSON.stringify(bootstrap)), clientRevision: manifest.clientRevision }, null, 2));
          NODE

      - name: Commit rebuilt current artifacts and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/operator-detail-v34-current.yml scripts/rebuild-operator-detail-v34-current.mjs operator-detail-v34-current-trigger.txt
          git add -A
          git commit -m "fix: publish operator category and first-paint detail truth"
          git push origin HEAD:main
