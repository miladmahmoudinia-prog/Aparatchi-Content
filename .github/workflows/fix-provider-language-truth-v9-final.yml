name: Fix provider language truth v9 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-provider-language-truth-v9-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Patch persistent Upera language parser
        run: node scripts/fix-provider-language-truth-v9.mjs
      - name: Syntax-check sync parser
        run: node --check scripts/sync-upera.mjs
      - name: Recover current catalog from direct provider truth
        run: node scripts/repair-current-provider-language-truth-v9.mjs
      - name: Rebuild complete client artifacts
        run: node scripts/rebuild-client-catalog.mjs
      - name: Verify language and media truth
        run: |
          node scripts/test-provider-language-truth-v9.mjs
          node scripts/tests/full-navigation-bootstrap-v1.test.mjs
          node scripts/tests/fast-movie-media-v2.test.mjs
          node scripts/diagnose-movie-client-media-loss.mjs | tee /tmp/media.txt
          grep -q '"sourceMediaTitlesMissingFromClient":0' /tmp/media.txt
          grep -q '"sourceUrlsLostFromClientDetailTitles":0' /tmp/media.txt
          grep -q '"sourceUrlsLostFromClientSummaryTitles":0' /tmp/media.txt
          grep -q '"dubbedMoviesLost":0' /tmp/media.txt
          node scripts/diagnose-mobile-media-ui-v7.mjs | tee /tmp/mobile-ui.txt
      - name: Commit validated source and generated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs catalog.json catalog-index.json catalog-bootstrap.json catalog-manifest.json catalog-items catalog-stable
          if git diff --cached --quiet; then
            echo "Provider language truth is already current."
            exit 0
          fi
          git commit -m "fix: derive dubbed media from provider title truth [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
