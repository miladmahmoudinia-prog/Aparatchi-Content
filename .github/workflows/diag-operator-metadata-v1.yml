name: Diagnose operator metadata v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-operator-metadata-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inspect Kan Pamenar source fields
        shell: node {0}
        run: |
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const items = Array.isArray(catalog) ? catalog : (catalog.items || []);
          const text = (v) => String(v || '').replace(/\s+/g, ' ').trim();
          const norm = (v) => text(v).toLowerCase().normalize('NFKC').replace(/[يى]/g, 'ی').replace(/ك/g, 'ک');
          const target = items.filter((item) => {
            const joined = `${norm(item?.nameFa)} ${norm(item?.nameEn)}`;
            return /کن\s*پامنار/.test(joined) || /kan\s*pamenar/.test(joined) || /kan\s*p[aä]menar/.test(joined);
          });
          console.log('KAN_PAMENAR_SOURCE_FIELDS=' + JSON.stringify(target.map((item) => ({
            id: item.id,
            nameFa: item.nameFa,
            nameEn: item.nameEn,
            year: item.year,
            source: item.source,
            sourceContentId: item.sourceContentId,
            contentVariant: item.contentVariant,
            operatorOnly: item.operatorOnly,
            operatorAccess: item.operatorAccess,
            access: item.access,
            overview: item.overview,
            people: item.people,
            downloads: (item.downloads || []).map((group) => ({
              id: group.id,
              title: group.title,
              files: (group.files || []).slice(0, 2).map((file) => ({ id: file.id, label: file.label, url: file.url, operatorOnly: file.operatorOnly, access: file.access }))
            }))
          })), null, 2));

      - name: Show panel detail code path
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PANEL API REFERENCES ==='
          grep -n -B 8 -A 28 "PANEL_API_BASE" scripts/sync-upera.mjs | head -n 180 || true
          echo '=== PANEL MOVIE DETAIL ==='
          grep -n -B 12 -A 45 "fetchPanelMovieDetail" scripts/sync-upera.mjs | head -n 220 || true
          echo '=== PANEL FETCH HELPERS ==='
          grep -n -B 10 -A 35 "panelFetch" scripts/sync-upera.mjs | head -n 220 || true
          grep -n -B 10 -A 35 "fetchPanel" scripts/sync-upera.mjs | head -n 260 || true
