name: Diagnose operator metadata v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-operator-metadata-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compare Kan Pamenar panel metadata payloads
        shell: node {0}
        env:
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
        run: |
          const token = String(process.env.UPERA_PANEL_TOKEN || '').trim();
          if (!token) throw new Error('UPERA_PANEL_TOKEN is missing');
          const auth = /^Bearer\s+/i.test(token) ? token : `Bearer ${token}`;
          const endpoint = 'https://panel-api.upera.tv/api/v1/owner/get/movies';
          const targetId = 'b8327f70-010c-11f1-a9bd-99c9fc183b8b';
          const targetTitle = 'کن پامنار';

          function text(v) { return String(v ?? '').replace(/\s+/g, ' ').trim(); }
          function looksLikeTarget(value) {
            if (!value || typeof value !== 'object') return false;
            const joined = [value.id, value.t_id, value.title, value.name, value.name_fa, value.nameFa]
              .map(text).join(' ');
            return joined.includes(targetId) || joined.includes(targetTitle);
          }
          function findTargets(value, out = [], depth = 0) {
            if (!value || depth > 8) return out;
            if (Array.isArray(value)) {
              for (const child of value) findTargets(child, out, depth + 1);
              return out;
            }
            if (typeof value !== 'object') return out;
            if (looksLikeTarget(value)) out.push(value);
            for (const child of Object.values(value)) {
              if (child && typeof child === 'object') findTargets(child, out, depth + 1);
            }
            return out;
          }
          function pick(record) {
            if (!record) return null;
            const fields = [
              'id','t_id','title','name','name_fa','nameFa','name_en','nameEn','year',
              'description','description_fa','overview','summary','story','plot','content','about',
              'actors','actor','cast','people','director','directors','crew','imdb','imdb_id','imdbId',
              'poster','image','cover','created_at','updated_at'
            ];
            const result = { rawKeys: Object.keys(record).sort() };
            for (const key of fields) {
              if (record[key] !== undefined && record[key] !== null) result[key] = record[key];
            }
            return result;
          }
          async function fetchVariant(nodata) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { Authorization: auth, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query: targetTitle,
                ir: -1,
                sale_method: 3,
                payment_method: 0,
                specific_id: null,
                nodata,
                owner: 9194919,
                page: 1,
              }),
            });
            if (!response.ok) throw new Error(`panel ${nodata} HTTP ${response.status}`);
            const json = await response.json();
            const matches = findTargets(json).map(pick);
            console.log(`PANEL_NODATA_${nodata}=` + JSON.stringify({
              topKeys: json && typeof json === 'object' ? Object.keys(json).sort() : [],
              matches,
            }, null, 2));
          }

          await fetchVariant(1);
          await fetchVariant(0);
