name: Diagnose operator metadata v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-operator-metadata-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify operator movie_id bridge for Kan Pamenar
        shell: node {0}
        env:
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
        run: |
          const token = String(process.env.UPERA_PANEL_TOKEN || '').trim();
          if (!token) throw new Error('UPERA_PANEL_TOKEN is missing');
          const auth = /^Bearer\s+/i.test(token) ? token : `Bearer ${token}`;
          const targetTitle = 'کن پامنار';
          const panel = await fetch('https://panel-api.upera.tv/api/v1/owner/get/movies', {
            method: 'POST',
            headers: { Authorization: auth, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: targetTitle,
              ir: -1,
              sale_method: 3,
              payment_method: 0,
              specific_id: null,
              nodata: 1,
              owner: 9194919,
              page: 1,
            }),
            signal: AbortSignal.timeout(12000),
          });
          if (!panel.ok) throw new Error(`panel HTTP ${panel.status}`);
          const payload = await panel.json();
          const rows = payload?.data?.data || payload?.data?.movies || payload?.data || [];
          const list = Array.isArray(rows) ? rows : Object.values(rows || {}).filter((v) => v && typeof v === 'object');
          const row = list.find((r) => String(r?.name || '').includes(targetTitle)) || list[0];
          if (!row) throw new Error('Kan Pamenar panel row not found');
          console.log('PANEL_IDS=' + JSON.stringify({ id:row.id, movie_id:row.movie_id, name:row.name, year:row.year }, null, 2));

          for (const [kind, id] of [['panel_id', row.id], ['movie_id', row.movie_id]]) {
            if (!id) continue;
            const url = `https://seeko.film/api/v1/ghost/get/movie/${encodeURIComponent(id)}`;
            const response = await fetch(url, { headers: { accept:'application/json' }, signal: AbortSignal.timeout(12000) });
            let body = null;
            try { body = await response.json(); } catch { body = null; }
            const data = body?.data ?? body ?? {};
            const movie = data?.movie || data;
            console.log(`SEEKO_${kind}=` + JSON.stringify({
              status: response.status,
              keys: movie && typeof movie === 'object' ? Object.keys(movie).sort() : [],
              id: movie?.id,
              name: movie?.name,
              name_fa: movie?.name_fa,
              title: movie?.title,
              year: movie?.year,
              overview: movie?.overview || movie?.description || movie?.summary || movie?.story || null,
              people: movie?.people || movie?.cast || movie?.actors || null,
              imdb: movie?.imdb || movie?.imdb_id || null,
            }, null, 2));
          }
