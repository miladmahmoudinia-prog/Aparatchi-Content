name: Diagnose operator metadata v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-operator-metadata-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect operator identity hints for Kan Pamenar
        shell: node {0}
        env:
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
        run: |
          const token=String(process.env.UPERA_PANEL_TOKEN||'').trim();
          if(!token) throw new Error('UPERA_PANEL_TOKEN missing');
          const auth=/^Bearer\s+/i.test(token)?token:`Bearer ${token}`;
          const target='کن پامنار';
          const response=await fetch('https://panel-api.upera.tv/api/v1/owner/get/movies',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({query:target,ir:-1,sale_method:3,payment_method:0,specific_id:null,nodata:1,owner:9194919,page:1}),signal:AbortSignal.timeout(12000)});
          const payload=await response.json();
          const found=[]; const clean=v=>String(v??'').trim();
          function walk(v,d=0){if(!v||d>10)return;if(Array.isArray(v)){for(const c of v)walk(c,d+1);return;}if(typeof v!=='object')return;if([v.name,v.id].map(clean).join(' ').includes(target))found.push(v);for(const c of Object.values(v))if(c&&typeof c==='object')walk(c,d+1);}
          walk(payload);
          const row=found.find(r=>clean(r.name).includes(target));
          if(!row) throw new Error('row missing');
          console.log('IDENTITY_HINTS='+JSON.stringify({id:row.id,movie_id:row.movie_id,name:row.name,year:row.year,one_edit_title:row.one_edit_title,one_edit_token:row.one_edit_token,upera:row.upera,vod:row.vod,show:row.show,internal_studio:row.internal_studio},null,2));

          const suggestion=await fetch(`https://v2.sg.media-imdb.com/suggestion/x/${encodeURIComponent(target)}.json`,{signal:AbortSignal.timeout(12000)});
          const json=suggestion.ok?await suggestion.json():{};
          console.log('IMDB_SUGGESTION='+JSON.stringify((json.d||[]).slice(0,10).map(x=>({id:x.id,title:x.l,year:x.y,type:x.q,aka:x.aka})),null,2));
