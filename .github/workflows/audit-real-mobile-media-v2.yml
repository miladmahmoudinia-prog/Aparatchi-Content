name: Audit real mobile media v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-real-mobile-media-v2.mjs'
      - '.github/workflows/audit-real-mobile-media-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Audit real published media
        run: node scripts/audit-real-mobile-media-v2.mjs
