name: Audit user report v12

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-user-report-v12.mjs'
      - '.github/workflows/audit-user-report-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Audit reported catalog freshness and hydration data
        run: node scripts/audit-user-report-v12.mjs

# audit trigger
