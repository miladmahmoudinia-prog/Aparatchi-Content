name: Fix UI truth compact v10b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ui-truth-v10b.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply v10b source and test repair
        run: node scripts/fix-ui-truth-v10b.mjs
      - name: Apply verified Persian titles to current catalog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { applyVerifiedPersianTitleOverrides } from './scripts/persian-title-overrides.mjs';
          const catalog = JSON.parse(await fs.readFile('catalog.json', 'utf8'));
          console.log(applyVerifiedPersianTitleOverrides(catalog));
          await fs.writeFile('catalog.json', JSON.stringify(catalog, null, 2) + '\n');
          NODE
      - name: Rebuild app-facing artifacts
        run: node scripts/rebuild-client-catalog.mjs
      - name: Run full Content regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Audit real generated truth
        run: |
          node scripts/diagnose-ui-truth-v10.mjs
          node scripts/diagnose-movie-client-media-loss.mjs
      - name: Commit verified functional repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/persian-title-overrides.mjs scripts/client-catalog.mjs scripts/sync-upera.mjs .github/workflows/sync-upera.yml \
            scripts/tests/current-media-truth.test.mjs scripts/tests/final-user-batch-20260814.test.mjs scripts/tests/mock-sync-fetch.mjs scripts/tests/ui-truth-v10.test.mjs \
            scripts/fix-ui-truth-v10b.mjs .github/workflows/fix-ui-truth-v10b.yml \
            catalog.json catalog-index.json catalog-bootstrap.json catalog-items catalog-stable catalog-manifest.json
          if git diff --cached --quiet; then
            echo "Already current."
            exit 0
          fi
          git commit -m "fix: make fresh ordering actions titles and episode artwork truthful [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
