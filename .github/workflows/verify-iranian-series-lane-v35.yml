name: Verify Iranian series lane v35

on:
  push:
    branches:
      - fix/iranian-series-skip-foreign-v35

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run sync regression tests
        run: node --test scripts/tests/*.test.mjs
