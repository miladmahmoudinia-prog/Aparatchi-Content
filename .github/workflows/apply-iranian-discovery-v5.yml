name: Apply Iranian Discovery V5

on:
  push:
    paths:
      - '.github/workflows/apply-iranian-discovery-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply discovery patch
        run: |
          node scripts/apply-iranian-discovery-v5.cjs
          node --check scripts/sync-upera.mjs
      - name: Run regression tests
        run: node --test scripts/tests/*.test.mjs
      - name: Run real Iranian discovery
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: IRANIAN
          UPERA_OPERATOR_DISCOVERY_ENABLED: 'false'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '15'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '12000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '220'
          UPERA_REQUEST_DELAY_MS: '520'
          UPERA_IRANIAN_SERIES_REQUEST_QUOTA: '180'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '19'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '1'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '120'
          UPERA_MAX_EPISODE_PAGES: '80'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        shell: bash
        run: |
          BEFORE=$(node -e 'const c=require("./catalog.json");process.stdout.write(String((c.items||[]).filter(i=>i?.type==="series"&&i?.categoryKeys?.includes("iranian-series")&&i?.publicationStatus==="published").length))')
          echo "Published Iranian before: $BEFORE"
          node scripts/sync-upera.mjs
          AFTER=$(node -e 'const c=require("./catalog.json");process.stdout.write(String((c.items||[]).filter(i=>i?.type==="series"&&i?.categoryKeys?.includes("iranian-series")&&i?.publicationStatus==="published").length))')
          echo "Published Iranian after: $AFTER"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("sync-report-iranian.json","utf8"));const s=JSON.parse(fs.readFileSync("sync-state.json","utf8"));console.log(JSON.stringify({requests:r?.affiliateRequestScopes?.["iranian-series"],page:s.iranianSeriesPage,offset:s.iranianSeriesOffset,active:s.iranianSeriesActiveId,diagnostics:r.iranianSeriesDiagnostics},null,2))'
      - name: Commit code and real progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: discover genuinely new Iranian series"
          git pull --rebase origin main
          git push origin HEAD:main
