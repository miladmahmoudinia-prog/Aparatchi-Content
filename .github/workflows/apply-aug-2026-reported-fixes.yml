name: Apply Aug 2026 reported fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-aug-2026-reported-fixes-v2.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 80

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply root-cause fixes
        run: node scripts/apply-aug-2026-reported-fixes-v2.mjs

      - name: Syntax-check patched scripts
        run: |
          node --check scripts/sync-upera.mjs
          node --check scripts/enrich-persian-titles.mjs

      - name: Run catalog regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Repair Persian titles across current catalog
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PERSIAN_TITLE_MAX_TITLES_PER_RUN: '3500'
          PERSIAN_TITLE_REQUEST_DELAY_MS: '45'
          PERSIAN_TITLE_NEGATIVE_CACHE_HOURS: '6'
        run: node scripts/enrich-persian-titles.mjs

      - name: Commit verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-upera.mjs scripts/enrich-persian-titles.mjs .github/workflows/sync-upera.yml .github/workflows/enrich-tmdb-cast.yml catalog.json catalog-index.json catalog-items catalog-manifest.json persian-title-cache.json sync-state.json || true
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix: exact episode artwork, Persian titles and sync pushes"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            echo "Repository changed during push; retry ${attempt}/5"
            sleep $((attempt * 2))
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Could not publish verified content repairs after 5 attempts."
            exit 1
          fi
