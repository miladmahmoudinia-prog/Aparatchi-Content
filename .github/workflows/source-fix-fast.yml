name: Source-only regression fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/source-fix-fast-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-source-only
  cancel-in-progress: false

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 40
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply source fixes
        run: |
          node scripts/apply-final-user-batch-20260814-retry.mjs
          node scripts/apply-episode-frame-http-fix.mjs
      - name: Validate all regressions
        run: |
          node --check scripts/sync-upera.mjs
          node --test scripts/tests/*.test.mjs
      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preserve media truth and exact episode artwork source"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
