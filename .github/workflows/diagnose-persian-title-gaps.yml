name: Diagnose Persian title gaps

on:
  push:
    branches:
      - main
    paths:
      - scripts/diagnose-persian-title-gaps.mjs
      - .github/workflows/diagnose-persian-title-gaps.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Diagnose Persian title gaps
        run: node scripts/diagnose-persian-title-gaps.mjs
