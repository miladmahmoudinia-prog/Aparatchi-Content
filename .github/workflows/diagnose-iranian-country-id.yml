name: Diagnose Iranian country id

on:
  push:
    paths:
      - '.github/workflows/diagnose-iranian-country-id.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Probe Seeko Iranian country identity
        shell: bash
        run: |
          node - <<'NODE'
          const API='https://seeko.film/api/v1';
          const req=async(u,opt={})=>{const r=await fetch(u,{...opt,headers:{Accept:'application/json','User-Agent':'Aparatchi-Diagnose/2',...(opt.headers||{})}}); const t=await r.text(); console.log('HTTP',r.status,String(u)); if(!r.ok)return null; try{return JSON.parse(t)}catch{return null}};
          for(const [name,id] of [['سیاوش','84d22220-5f0f-11eb-98ca-adc674f51d6c'],['شهرزاد','09070160-3a34-11e8-976b-cbc7d564706f']]){
            const j=await req(`${API}/ghost/get/series/${id}?affiliate=1`); const s=j?.data?.series??j?.data??j;
            console.log('KNOWN',name,JSON.stringify({id:s?.id,name_fa:s?.name_fa,name:s?.name,ir:s?.ir,country:s?.country,country_id:s?.country_id,original_language:s?.original_language}));
          }
          const variants=[
            ['generic',{free:1,country:0,persian:0}],
            ['persian1',{free:1,country:0,persian:1}],
            ['countryIR',{free:1,country:'IR',persian:''}],
            ['countryIran',{free:1,country:'iran',persian:''}],
            ['freePersian',{free:'',country:0,persian:1}],
          ];
          for(const [label,q] of variants){
            const u=new URL(`${API}/ghost/get/series/sort`);
            for(const [k,v] of Object.entries({trending:1,genre:'all',query:'',affiliate:1,traffic:1,page:1,...q}))u.searchParams.set(k,String(v));
            const j=await req(u,{method:'POST'});
            const root=j?.data??j??{}; const node=root?.series??root; const rows=Array.isArray(node)?node:Array.isArray(node?.data)?node.data:Array.isArray(root?.data)?root.data:[];
            const simplified=rows.slice(0,20).map(x=>({id:x.id||x.t_id,nameFa:x.name_fa,name:x.name,ir:x.ir,country:x.country,country_id:x.country_id,original_language:x.original_language}));
            console.log('VARIANT',label,'rows',rows.length,'last',node?.last_page??root?.last_page,'irRows',simplified.filter(x=>Number(x.ir)===1).length);
            console.log(JSON.stringify(simplified));
          }
          NODE
