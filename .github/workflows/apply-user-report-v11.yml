name: Apply user report v11 content fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-user-report-v11.mjs'
      - '.github/workflows/apply-user-report-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply audited fixes
        run: |
          node scripts/apply-user-report-v11.mjs
          node - <<'NODE'
          const fs = require('fs');
          const path = 'scripts/tests/ui-truth-v10.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ["APARATCHI_EPISODE_ARTWORK_SERIES_PER_RUN: '24'", "APARATCHI_EPISODE_ARTWORK_SERIES_PER_RUN: '48'"],
            ["APARATCHI_EPISODE_FRAME_CAPTURES_PER_RUN: '36'", "APARATCHI_EPISODE_FRAME_CAPTURES_PER_RUN: '96'"],
            ["APARATCHI_RUN_TIME_LIMIT_MINUTES: '6'", "APARATCHI_RUN_TIME_LIMIT_MINUTES: '10'"],
          ];
          for (const [before, after] of replacements) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${before}: expected exactly one match, found ${count}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Run full content regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/classification.mjs scripts/client-catalog.mjs scripts/tests/user-report-v11.test.mjs scripts/tests/ui-truth-v10.test.mjs .github/workflows/sync-upera.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: classification freshness and episode artwork v11"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "::error::Could not push v11 fixes after 5 attempts."
          exit 1

# trigger: aligned v11 episode artwork budget
