name: Diagnose collection title v18

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.issue.title == 'RUN COLLECTION TITLE DIAGNOSTIC V18'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/diagnose-collection-title-v18.mjs
      - name: Commit diagnostic and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/diagnose-collection-title-v18.mjs .github/workflows/diagnose-collection-title-v18.yml
          git add collection-title-v18-diagnostic.json
          git commit -m "chore: record collection title v18 diagnostic [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
