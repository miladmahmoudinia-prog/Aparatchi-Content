name: Complete Iranian Series Backfill

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/iranian-series-backfill.yml'
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 60

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Complete one Iranian archive title without repair blocking
        timeout-minutes: 42
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: 'IRANIAN'
          UPERA_OPERATOR_DISCOVERY_ENABLED: 'false'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '8'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '12000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '220'
          UPERA_REQUEST_DELAY_MS: '520'
          UPERA_IRANIAN_SERIES_REQUEST_QUOTA: '180'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '5'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '1'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '120'
          UPERA_MAX_EPISODE_PAGES: '80'
          UPERA_OPERATOR_MOVIE_REQUEST_QUOTA: '8'
          UPERA_OPERATOR_SERIES_REQUEST_QUOTA: '8'
          UPERA_OPERATOR_MOVIE_PAGES_PER_RUN: '2'
          UPERA_OPERATOR_SERIES_PAGES_PER_RUN: '2'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const state = JSON.parse(fs.readFileSync('sync-state.json', 'utf8'));
          const published = (catalog.items || []).filter((item) =>
            item?.type === 'series' &&
            item?.categoryKeys?.includes('iranian-series') &&
            item?.publicationStatus === 'published'
          ).length;
          console.log(JSON.stringify({
            publishedIranianSeriesBefore: published,
            iranianSeriesPage: state.iranianSeriesPage,
            iranianSeriesOffset: state.iranianSeriesOffset,
            iranianSeriesActiveId: state.iranianSeriesActiveId,
            iranianSeriesCurrentId: state.iranianSeriesCurrentId,
            iranianSeriesCurrentEpisode: state.iranianSeriesCurrentEpisode,
          }, null, 2));
          NODE

          RUNTIME_SYNC="scripts/.sync-upera-iranian-backfill-runtime.mjs"
          cp scripts/sync-upera.mjs "$RUNTIME_SYNC"
          trap 'rm -f "$RUNTIME_SYNC"' EXIT

          node - "$RUNTIME_SYNC" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          let source = fs.readFileSync(file, 'utf8');
          const needle = '      await syncRecentIranianSeriesDiscovery();';
          const replacement = "      if (process.env.APARATCHI_SKIP_IRANIAN_RECENT !== 'true') {\n        await syncRecentIranianSeriesDiscovery();\n      }";
          if (!source.includes(needle)) throw new Error('Iranian recent-discovery hook not found');
          source = source.replace(needle, replacement);
          fs.writeFileSync(file, source);
          NODE

          # The normal catalog sync already handles newly airing titles and
          # visible repairs. This lane is archive-only from its very first pass,
          # so a stale visible repair can never consume the backfill slot.
          export APARATCHI_SKIP_IRANIAN_RECENT='true'
          COMPLETED=0
          for pass in $(seq 1 30); do
            echo "Iranian archive-only backfill pass ${pass}/30"
            node "$RUNTIME_SYNC"

            if [ ! -f sync-report-iranian.json ]; then
              echo "Iranian report missing; stop."
              break
            fi

            decision="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("sync-report-iranian.json","utf8")); const d=Array.isArray(r.iranianSeriesDiagnostics)?r.iranianSeriesDiagnostics:[]; const last=d.length?d[d.length-1]:null; const retry=Boolean(last&&last.retryLater); const stopped=Boolean(r.stoppedByTimeBudget); const newlyPublished=Boolean(last&&last.newlyPublished); if(stopped||retry) process.stdout.write("stop"); else if(last&&last.result==="completed"&&newlyPublished) process.stdout.write("published"); else process.stdout.write("continue");')"

            echo "Iranian archive-only decision: ${decision}"
            if [ "$decision" = "published" ]; then
              COMPLETED=$((COMPLETED + 1))
              echo "Published one Iranian archive series in this run."
              break
            fi
            if [ "$decision" = "stop" ]; then
              break
            fi
          done

          rm -f "$RUNTIME_SYNC"
          trap - EXIT
          node scripts/rebuild-client-catalog.mjs

          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf8'));
          const state = JSON.parse(fs.readFileSync('sync-state.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('sync-report-iranian.json', 'utf8'));
          const published = (catalog.items || []).filter((item) =>
            item?.type === 'series' &&
            item?.categoryKeys?.includes('iranian-series') &&
            item?.publicationStatus === 'published'
          ).length;
          console.log(JSON.stringify({
            publishedIranianSeriesAfter: published,
            iranianSeriesPage: state.iranianSeriesPage,
            iranianSeriesOffset: state.iranianSeriesOffset,
            iranianSeriesActiveId: state.iranianSeriesActiveId,
            iranianSeriesCurrentId: state.iranianSeriesCurrentId,
            iranianSeriesCurrentEpisode: state.iranianSeriesCurrentEpisode,
            lastDiagnostics: (report.iranianSeriesDiagnostics || []).slice(-3),
          }, null, 2));
          NODE

      - name: Commit Iranian backfill progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-bootstrap.json catalog-live.json catalog-live-baseline.json catalog-items catalog-stable catalog-manifest.json sync-state.json sync-report*.json
          if git diff --cached --quiet; then
            echo "No Iranian backfill changes to commit."
            exit 0
          fi
          git commit -m "chore: advance Iranian archive backfill"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Could not push Iranian backfill progress."
            exit 1
          fi
