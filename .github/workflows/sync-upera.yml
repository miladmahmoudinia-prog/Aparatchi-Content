name: Isolated catalog preview
on: workflow_dispatch
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/tests/existing-audit.test.mjs scripts/tests/existing-subtitles.test.mjs scripts/tests/reviewed-media.test.mjs
      - name: Sample catalog in temporary checkout only
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: IRANIAN
          UPERA_OPERATOR_DISCOVERY_ENABLED: 'false'
          UPERA_APPLY_REVIEWED_REMOVALS: 'false'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '2'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '24'
        run: |
          cp catalog.json "$RUNNER_TEMP/before.json"
          node scripts/sync-upera.mjs > "$RUNNER_TEMP/private-sync.log" 2>&1
          python - <<'PY'
          import os,json
          def items(path):
              data=json.load(open(path)); rows=data if isinstance(data,list) else data['items']; return {str(x['id']):x for x in rows}
          a=items(os.environ['RUNNER_TEMP']+'/before.json'); b=items('catalog.json'); added=b.keys()-a.keys(); removed=a.keys()-b.keys(); changed=[k for k in a.keys()&b.keys() if a[k]!=b[k]]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: print(f'Sample only: added={len(added)}, changed={len(changed)}, removed={len(removed)}; no publication.',file=out)
          assert not removed
          PY
