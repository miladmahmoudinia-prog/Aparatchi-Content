name: Sync Upera Catalog

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:
    inputs:
      movie_pages:
        description: 'تعداد صفحات فیلم برای بررسی محتوای تازه'
        required: false
        default: '8'

      series_pages:
        description: 'تعداد صفحات سریال برای بررسی محتوای تازه'
        required: false
        default: '8'

      new_hours:
        description: 'بررسی تغییرات چند ساعت اخیر'
        required: false
        default: '168'

permissions:
  contents: write

concurrency:
  group: upera-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout content repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve sync settings
        shell: bash
        run: |
          MOVIE_PAGES='${{ github.event.inputs.movie_pages }}'
          SERIES_PAGES='${{ github.event.inputs.series_pages }}'
          NEW_HOURS='${{ github.event.inputs.new_hours }}'

          echo "MOVIE_PAGES_PER_RUN=${MOVIE_PAGES:-8}" >> "$GITHUB_ENV"
          echo "SERIES_PAGES_PER_RUN=${SERIES_PAGES:-8}" >> "$GITHUB_ENV"
          echo "NEW_TITLES_HOURS=${NEW_HOURS:-168}" >> "$GITHUB_ENV"

      - name: Sync new and currently airing content
        id: normal_sync
        continue-on-error: true
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_SYNC_MODE: 'NORMAL'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '8'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '15000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '55'
          UPERA_REQUEST_DELAY_MS: '900'
          UPERA_AIRING_SERIES_TITLES_PER_RUN: '6'
          UPERA_SERIES_TITLES_PER_RUN: '6'
          UPERA_INCREMENTAL_LIMIT: '30'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '2'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '6'
          UPERA_OPERATOR_SERIES_PAGES_PER_RUN: '2'
          UPERA_OPERATOR_SERIES_TITLES_PER_RUN: '5'
          UPERA_OPERATOR_MOVIE_PAGES_PER_RUN: '2'
          UPERA_OPERATOR_MOVIE_TITLES_PER_RUN: '6'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '12'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '30'
          APARATCHI_IMAGE_MIRROR_CONCURRENCY: '4'
        run: node scripts/sync-upera.mjs

      - name: Commit new-content progress
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json sync-state.json sync-report.json
          if [ -d assets/media ]; then
            git add assets/media
          fi

          if git diff --cached --quiet; then
            echo "No new-content changes."
          else
            git commit -m "chore: sync new and airing content"
            git push
          fi

      - name: Advance incomplete series archives
        id: archive_sync
        continue-on-error: true
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_SYNC_MODE: 'BACKFILL'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '18'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '15000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '120'
          UPERA_BACKFILL_EPISODES_PER_RUN: '120'
          UPERA_BACKFILL_SERIES_PER_RUN: '16'
          UPERA_BACKFILL_EPISODES_PER_SERIES: '8'
          UPERA_MAX_EPISODE_PAGES: '50'
          UPERA_BACKFILL_MAX_NO_PROGRESS_RUNS: '8'
          UPERA_EPISODE_UNAVAILABLE_AFTER_ATTEMPTS: '3'
          UPERA_RETRY_BLOCKED: 'true'
          UPERA_REQUEST_DELAY_MS: '900'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        run: node scripts/sync-upera.mjs

      - name: Commit archive progress
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json sync-state.json sync-report.json

          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "chore: advance incomplete series archives"
            git push
          fi

      - name: Report sync failure
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.normal_sync.outcome }}' = 'failure' ] || [ '${{ steps.archive_sync.outcome }}' = 'failure' ]; then
            echo "One or more sync stages failed after saving available progress."
            exit 1
          fi
