name: Sync Upera Catalog

on:
  schedule:
    # GitHub cron uses UTC; :34 UTC is :04 in Iran (UTC+03:30).
    - cron: '34 * * * *'

  push:
    branches: [main]
    paths:
      - 'scripts/sync-upera.mjs'
      - 'scripts/classification.mjs'
      - 'scripts/client-catalog.mjs'
      - '.github/workflows/sync-upera.yml'

  workflow_dispatch:
    inputs:
      movie_pages:
        description: 'تعداد صفحات فیلم برای بررسی محتوای تازه'
        required: false
        default: '12'

      series_pages:
        description: 'تعداد صفحات سریال برای بررسی محتوای تازه'
        required: false
        default: '12'

      new_hours:
        description: 'بررسی تغییرات چند ساعت اخیر'
        required: false
        default: '24'

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

# Keep this workflow on the current main branch so language/operator/artwork regression locks are applied before publishing.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
      UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
      UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      TMDB_MAX_TITLES_PER_RUN: '40'
      TMDB_REQUEST_DELAY_MS: '160'
      TMDB_NEGATIVE_CACHE_HOURS: '6'
      APARATCHI_CAST_CACHE_BASE_URL: ${{ secrets.APARATCHI_CAST_CACHE_BASE_URL }}
      APARATCHI_CAST_CACHE_UPLOAD_URL: ${{ secrets.APARATCHI_CAST_CACHE_UPLOAD_URL }}
      APARATCHI_CAST_CACHE_TOKEN: ${{ secrets.APARATCHI_CAST_CACHE_TOKEN }}
      UPERA_SYNC_MODE: ${{ github.event_name == 'schedule' && 'AUTO' || 'BACKFILL' }}
      APARATCHI_RUN_TIME_LIMIT_MINUTES: '18'
      APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
      APARATCHI_REQUEST_TIMEOUT_MS: '12000'
      APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
      UPERA_REQUEST_DELAY_MS: '420'
      UPERA_BACKFILL_REQUEST_DELAY_MS: '100'
      UPERA_MAX_REQUESTS_PER_RUN: '220'
      UPERA_BACKFILL_REQUEST_RESERVE: '180'
      UPERA_BACKFILL_EPISODE_LIMIT_PER_RUN: '240'
      UPERA_BACKFILL_SERIES_CHECKPOINT_SIZE: '20'
      APARATCHI_AIRING_REFRESH_PER_RUN: '10'
      APARATCHI_INCOMPLETE_REPAIR_PER_RUN: '1'
      APARATCHI_IRANIAN_SERIES_PER_RUN: '1'
      APARATCHI_IRANIAN_SERIES_RESERVE: '100'
      APARATCHI_IRANIAN_SERIES_PAGES_PER_RUN: '4'
      APARATCHI_OPERATOR_MOVIE_PAGES_PER_RUN: '4'
      APARATCHI_OPERATOR_MOVIE_CANDIDATES_PER_RUN: '8'
      APARATCHI_OPERATOR_SERIES_PAGES_PER_RUN: '4'
      APARATCHI_OPERATOR_SERIES_CANDIDATES_PER_RUN: '4'
      APARATCHI_OPERATOR_SERIES_EPISODES_PER_RUN: '10'
      APARATCHI_PEOPLE_TITLES_PER_RUN: '40'
      APARATCHI_PEOPLE_MAX_PER_TITLE: '14'
      APARATCHI_PEOPLE_RETRY_HOURS: '1'
      APARATCHI_EPISODE_ARTWORK_SERIES_PER_RUN: '24'
      APARATCHI_EPISODE_FRAME_CAPTURES_PER_RUN: '48'
      APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'

    steps:
      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve sync inputs
        shell: bash
        run: |
          MOVIE_PAGES="${{ github.event.inputs.movie_pages }}"
          SERIES_PAGES="${{ github.event.inputs.series_pages }}"
          NEW_HOURS="${{ github.event.inputs.new_hours }}"
          echo "UPERA_MOVIE_PAGES=${MOVIE_PAGES:-12}" >> "$GITHUB_ENV"
          echo "UPERA_SERIES_PAGES=${SERIES_PAGES:-12}" >> "$GITHUB_ENV"
          echo "UPERA_NEW_HOURS=${NEW_HOURS:-24}" >> "$GITHUB_ENV"

      - name: Sync Upera content
        run: node scripts/sync-upera.mjs

      - name: Build client catalog
        run: node scripts/client-catalog.mjs

      - name: Commit catalog updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-items catalog-manifest.json sync-state.json sync-report*.json assets/media || true
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "chore: sync Upera catalog"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
