name: Sync Upera Catalog

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:
    inputs:
      movie_pages:
        description: 'تعداد صفحات فیلم برای بررسی در این اجرا'
        required: false
        default: '8'

      series_pages:
        description: 'تعداد صفحات سریال برای بررسی در این اجرا'
        required: false
        default: '8'

      new_hours:
        description: 'بررسی تغییرات چند ساعت اخیر'
        required: false
        default: '168'

permissions:
  contents: write

concurrency:
  group: upera-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout content repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve sync settings
        shell: bash
        run: |
          MOVIE_PAGES='${{ github.event.inputs.movie_pages }}'
          SERIES_PAGES='${{ github.event.inputs.series_pages }}'
          NEW_HOURS='${{ github.event.inputs.new_hours }}'

          echo "MOVIE_PAGES_PER_RUN=${MOVIE_PAGES:-8}" >> "$GITHUB_ENV"
          echo "SERIES_PAGES_PER_RUN=${SERIES_PAGES:-8}" >> "$GITHUB_ENV"
          echo "NEW_TITLES_HOURS=${NEW_HOURS:-168}" >> "$GITHUB_ENV"

      - name: Fast complete old series archives
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_SYNC_MODE: 'BACKFILL'
          SYNC_CONCURRENCY: '6'
          UPERA_MAX_REQUESTS_PER_RUN: '260'
          UPERA_BACKFILL_EPISODES_PER_RUN: '240'
          UPERA_BACKFILL_SERIES_PER_RUN: '24'
          UPERA_BACKFILL_EPISODES_PER_SERIES: '12'
          UPERA_MAX_EPISODE_PAGES: '100'
          UPERA_BACKFILL_MAX_NO_PROGRESS_RUNS: '8'
          UPERA_EPISODE_UNAVAILABLE_AFTER_ATTEMPTS: '3'
          UPERA_RETRY_BLOCKED: 'true'
          UPERA_REQUEST_DELAY_MS: '900'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '180'
          APARATCHI_IMAGE_MIRROR_CONCURRENCY: '6'
        run: node scripts/sync-upera.mjs

      - name: Sync movies series and new episodes
        if: ${{ always() }}
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_SYNC_MODE: 'NORMAL'
          SYNC_CONCURRENCY: '6'
          UPERA_MAX_REQUESTS_PER_RUN: '140'
          UPERA_REQUEST_DELAY_MS: '1100'
          UPERA_AIRING_SERIES_TITLES_PER_RUN: '12'
          UPERA_SERIES_TITLES_PER_RUN: '16'
          UPERA_INCREMENTAL_LIMIT: '40'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '4'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '12'
          UPERA_OPERATOR_SERIES_PAGES_PER_RUN: '3'
          UPERA_OPERATOR_SERIES_TITLES_PER_RUN: '8'
          UPERA_OPERATOR_MOVIE_PAGES_PER_RUN: '3'
          UPERA_OPERATOR_MOVIE_TITLES_PER_RUN: '10'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '18'
          UPERA_EPISODE_UNAVAILABLE_AFTER_ATTEMPTS: '3'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '180'
          APARATCHI_IMAGE_MIRROR_CONCURRENCY: '6'
        run: node scripts/sync-upera.mjs

      - name: Commit updated catalog
        if: ${{ always() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json sync-state.json sync-report.json assets/media

          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi

          git commit -m "chore: fast archive completion and catalog sync"
          git push
