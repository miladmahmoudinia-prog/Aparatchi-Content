name: Audit Persian display titles

on:
  push:
    branches:
      - main
    paths:
      - scripts/audit-persian-display-titles.mjs
      - .github/workflows/audit-persian-display-titles.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Audit Persian display titles
        run: node scripts/audit-persian-display-titles.mjs
