name: Diagnose historical language truth v7

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-historical-language-truth-v7.mjs'
      - '.github/workflows/diagnose-historical-language-truth-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Recover only conflict-free historical language truth
        run: node scripts/diagnose-historical-language-truth-v7.mjs
