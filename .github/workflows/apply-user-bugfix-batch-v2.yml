name: Apply user bugfix batch v2

on:
  push:
    paths:
      - 'scripts/apply-user-bugfix-followup.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 60
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply root-cause batch
        run: node scripts/apply-user-bugfix-batch.mjs

      - name: Apply follow-up hardening
        run: node scripts/apply-user-bugfix-followup.mjs

      - name: Run all regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Exercise real Iranian and panel lanes
        id: source_check
        continue-on-error: true
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: 'IRANIAN'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '14'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '12000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '200'
          UPERA_REQUEST_DELAY_MS: '520'
          UPERA_IRANIAN_SERIES_REQUEST_QUOTA: '160'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '5'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '1'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '120'
          UPERA_MAX_EPISODE_PAGES: '80'
          UPERA_OPERATOR_MOVIE_REQUEST_QUOTA: '12'
          UPERA_OPERATOR_SERIES_REQUEST_QUOTA: '12'
          UPERA_OPERATOR_MOVIE_PAGES_PER_RUN: '2'
          UPERA_OPERATOR_SERIES_PAGES_PER_RUN: '2'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        run: node scripts/sync-upera.mjs

      - name: Commit source and validated progress
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.source_check.outcome }}' = 'failure' ]; then
            echo '::warning title=Source verification::Real-source check failed; source changes are still committed only after local regression tests passed.'
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts .github/workflows catalog.json catalog-index.json catalog-items catalog-manifest.json sync-state.json sync-report*.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "fix: resolve reported catalog, language and Iranian-series bugs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
