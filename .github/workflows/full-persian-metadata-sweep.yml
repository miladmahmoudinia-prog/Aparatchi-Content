name: Full Persian metadata sweep

on:
  push:
    branches: [main]
    paths:
      - 'scripts/full-persian-metadata-sweep-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Repair every missing Persian title and collection name
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PERSIAN_TITLE_MAX_TITLES_PER_RUN: '3000'
          PERSIAN_TITLE_REQUEST_DELAY_MS: '75'
          PERSIAN_TITLE_NEGATIVE_CACHE_HOURS: '1'
        run: node scripts/enrich-persian-titles.mjs
      - name: Rebuild strict client catalog
        run: node scripts/client-catalog.mjs
      - name: Run regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Commit sweep
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-items catalog-manifest.json persian-title-cache.json
          if git diff --cached --quiet; then
            echo "No Persian metadata changes."
            exit 0
          fi
          git commit -m "fix: complete Persian titles and collection names"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
