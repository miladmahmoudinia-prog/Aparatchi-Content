name: Fix 28 Later Title Truth v25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-28-later-title-truth-v25.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current Content main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Add verified Persian title and collection truth
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/persian-title-overrides.mjs')
          text = p.read_text()

          title_anchor = "  [\"aunt nasrin's songs for kids 7\", 'ترانه‌های کودکانه خاله نسرین ۷'],\n"
          title_rows = (
              "  ['28 days later', '۲۸ روز بعد'],\n"
              "  ['28 weeks later', '۲۸ هفته بعد'],\n"
              "  ['28 years later', '۲۸ سال بعد'],\n"
              "  ['28 years later: the bone temple', '۲۸ سال بعد: معبد استخوان'],\n"
          )
          if "['28 weeks later', '۲۸ هفته بعد']" not in text:
              if title_anchor not in text:
                  raise RuntimeError('missing title override insertion anchor')
              text = text.replace(title_anchor, title_anchor + title_rows, 1)

          collection_anchor = "  ['dance with the jackals collection', 'مجموعه رقص با شغال‌ها'],\n"
          collection_row = "  ['28 days/weeks/years later collection', 'مجموعه ۲۸ روز/هفته/سال بعد'],\n"
          if collection_row.strip() not in text:
              if collection_anchor not in text:
                  raise RuntimeError('missing collection override insertion anchor')
              text = text.replace(collection_anchor, collection_anchor + collection_row, 1)

          p.write_text(text)
          PY

          cat > scripts/tests/28-later-title-truth-v25.test.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { applyVerifiedPersianTitleOverrides } from '../persian-title-overrides.mjs';

          test('28 Later members and collection keep verified Persian titles', () => {
            const collectionName = '28 Days/Weeks/Years Later Collection';
            const catalog = {
              items: [
                { type: 'movie', name: '28 Days Later', nameFa: '28 روز بعد', collectionName, collectionNameFa: '۲۸ روز بعد' },
                { type: 'movie', name: '28 Weeks Later', nameFa: '۲۸ أسبوعاً لاحقاً', collectionName, collectionNameFa: '۲۸ روز بعد' },
                { type: 'movie', name: '28 Years Later', nameFa: '۲۸ سال بعد', collectionName, collectionNameFa: '۲۸ روز بعد' },
                { type: 'movie', name: '28 Years Later: The Bone Temple', nameFa: '۲۸ سال بعد: معبد استخوان', collectionName, collectionNameFa: '۲۸ روز بعد' },
              ],
            };

            const result = applyVerifiedPersianTitleOverrides(catalog);
            assert.deepEqual(catalog.items.map((item) => item.nameFa), [
              '۲۸ روز بعد',
              '۲۸ هفته بعد',
              '۲۸ سال بعد',
              '۲۸ سال بعد: معبد استخوان',
            ]);
            assert.ok(catalog.items.every((item) => item.collectionNameFa === 'مجموعه ۲۸ روز/هفته/سال بعد'));
            assert.ok(result.titleChanges >= 2);
            assert.equal(result.collectionChanges, 4);
          });
          TEST

      - name: Apply verified names to real catalog and rebuild client artifacts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { applyVerifiedPersianTitleOverrides } from './scripts/persian-title-overrides.mjs';
          import { writeClientCatalogArtifacts } from './scripts/client-catalog.mjs';

          const catalog = JSON.parse(await fs.readFile('catalog.json', 'utf8'));
          const changes = applyVerifiedPersianTitleOverrides(catalog);
          const serialized = `${JSON.stringify(catalog, null, 2)}\n`;
          await fs.writeFile('catalog.json', serialized, 'utf8');

          const artifacts = await writeClientCatalogArtifacts(process.cwd(), catalog);
          const previous = JSON.parse(await fs.readFile('catalog-manifest.json', 'utf8'));
          const manifest = {
            ...previous,
            schemaVersion: 2,
            revision: createHash('sha256').update(serialized).digest('hex'),
            clientRevision: artifacts.clientRevision,
            catalogVersion: String(catalog.version || previous.catalogVersion || ''),
            catalogUpdatedAt: String(catalog.updatedAt || previous.catalogUpdatedAt || ''),
            sizeBytes: Buffer.byteLength(serialized),
            clientSizeBytes: artifacts.clientSizeBytes,
            clientIndex: 'catalog-index.json',
            bootstrapRevision: artifacts.bootstrapRevision,
            bootstrapSizeBytes: artifacts.bootstrapSizeBytes,
            bootstrapIndex: 'catalog-bootstrap.json',
            detailBase: 'catalog-items/',
            stableDetailBase: 'catalog-stable/',
          };
          await fs.writeFile('catalog-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(changes));
          NODE

      - name: Run complete Content regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Audit exact real 28 Later source, index and bootstrap truth
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const expected = new Map([
            ['28 Days Later', '۲۸ روز بعد'],
            ['28 Weeks Later', '۲۸ هفته بعد'],
            ['28 Years Later', '۲۸ سال بعد'],
            ['28 Years Later: The Bone Temple', '۲۸ سال بعد: معبد استخوان'],
          ]);
          const collectionEn = '28 Days/Weeks/Years Later Collection';
          const collectionFa = 'مجموعه ۲۸ روز/هفته/سال بعد';

          for (const file of ['catalog.json', 'catalog-index.json', 'catalog-bootstrap.json']) {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            const items = Array.isArray(payload) ? payload : payload.items;
            for (const [name, nameFa] of expected) {
              const item = items.find((candidate) => candidate?.name === name);
              if (!item) throw new Error(`${file} is missing ${name}`);
              if (item.nameFa !== nameFa) throw new Error(`${file}: ${name} has wrong Persian title: ${item.nameFa}`);
              if (item.collectionName !== collectionEn) throw new Error(`${file}: ${name} has wrong English collection: ${item.collectionName}`);
              if (item.collectionNameFa !== collectionFa) throw new Error(`${file}: ${name} has wrong Persian collection: ${item.collectionNameFa}`);
            }
          }
          console.log('28 Later title/collection truth verified in source + index + bootstrap');
          NODE

      - name: Commit validated repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-28-later-title-truth-v25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct 28 Later Persian titles and collection"
          git push origin HEAD:main
