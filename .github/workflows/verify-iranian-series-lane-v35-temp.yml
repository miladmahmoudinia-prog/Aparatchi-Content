name: Verify Iranian lane v35 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == 'RUN IRANIAN LANE V35 TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run sync regression tests
        id: tests
        continue-on-error: true
        run: node --test scripts/tests/*.test.mjs
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.tests.outcome }}
        run: gh issue comment "$ISSUE_NUMBER" --body "iranian_lane_tests=${RESULT}"
      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
