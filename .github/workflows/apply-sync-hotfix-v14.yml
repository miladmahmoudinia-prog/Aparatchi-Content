name: Prepare observable Sync Upera validation v16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sync-hotfix-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-sync-v16-prep
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Content main
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Insert one-shot run-id marker into Sync Upera
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/sync-upera.yml')
          text = path.read_text()
          marker_name = 'Expose one-shot Sync validation run id'
          if marker_name not in text:
              anchor = "      - name: Run sync regression tests\n        run: node --test scripts/tests/*.test.mjs\n"
              marker = """      - name: Expose one-shot Sync validation run id
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name \"github-actions[bot]\"
          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"
          printf 'run_id=%s\\nhead_sha=%s\\nstarted_at=%s\\n' \"${{ github.run_id }}\" \"${{ github.sha }}\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > sync-v16-run.txt
          git add sync-v16-run.txt
          git commit -m \"chore: expose Sync Upera v16 run id [skip ci]\"
          git push origin HEAD:main

"""
              if anchor not in text:
                  raise SystemExit('sync regression anchor not found')
              text = text.replace(anchor, marker + anchor, 1)
              path.write_text(text)
          PY

      - name: Commit Sync validation hook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/sync-upera.yml
          if git diff --cached --quiet; then
            echo 'Validation hook already present.'
            exit 0
          fi
          git commit -m 'ci: expose one-shot Sync Upera validation run id'
          git pull --rebase origin main
          git push origin HEAD:main
