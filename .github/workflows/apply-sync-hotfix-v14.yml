name: Apply sync hotfix v14
# one-shot helper; remove after the sync workflow is patched

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sync-hotfix-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 30

      - name: Patch sync schedule and ffmpeg guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sync-upera.yml')
          s = p.read_text()
          old_cron = "    - cron: '34 * * * *'"
          new_cron = "    - cron: '34 */2 * * *'"
          if old_cron in s:
              s = s.replace(old_cron, new_cron, 1)
          elif new_cron not in s:
              raise SystemExit('sync cron shape not found')

          old = '''      - name: Ensure ffmpeg for episode thumbnails
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
'''
          new = '''      - name: Ensure ffmpeg for episode thumbnails
        shell: bash
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set +e
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          echo "::warning title=ffmpeg missing::Trying a bounded install; sync will continue even if the package mirror is slow."
          timeout 90s sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          UPDATE_STATUS=$?
          if [ "$UPDATE_STATUS" -ne 0 ]; then
            echo "::warning title=ffmpeg install skipped::apt-get update did not finish in time. Episode frames will retry next run."
            exit 0
          fi
          timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          INSTALL_STATUS=$?
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "::warning title=ffmpeg install skipped::ffmpeg install did not finish in time. Episode frames will retry next run."
            exit 0
          fi
          ffmpeg -version | head -n 1 || true
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'timeout-minutes: 4\n        continue-on-error: true' not in s:
              raise SystemExit('ffmpeg step shape not found')
          p.write_text(s)
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -F "cron: '34 */2 * * *'" .github/workflows/sync-upera.yml
          grep -A28 -F 'name: Ensure ffmpeg for episode thumbnails' .github/workflows/sync-upera.yml | grep -F 'timeout-minutes: 4'
          grep -A28 -F 'name: Ensure ffmpeg for episode thumbnails' .github/workflows/sync-upera.yml | grep -F 'continue-on-error: true'

      - name: Commit sync hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/sync-upera.yml
          if git diff --cached --quiet; then
            echo 'Sync workflow already patched.'
            exit 0
          fi
          git commit -m 'fix: bound ffmpeg setup and run Upera sync every two hours'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
