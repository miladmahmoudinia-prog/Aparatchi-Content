name: Dispatch Iranian series v39

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == 'RUN IRANIAN SERIES V39'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Dispatch catalog sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-upera.yml/dispatches" \
            -d '{"ref":"main","inputs":{"movie_pages":"12","series_pages":"12","new_hours":"24"}}'

      - name: Report dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "iranian-series-v39-sync=dispatched"

      - name: Remove temporary dispatcher
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-iranian-series-v39-temp.yml
          git commit -m "chore: remove Iranian series v39 dispatcher"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
