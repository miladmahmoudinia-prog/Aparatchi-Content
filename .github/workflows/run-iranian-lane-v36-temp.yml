name: Run Iranian lane v36 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aparatchi-content-write-lock
  cancel-in-progress: false

jobs:
  run:
    if: github.event.issue.title == 'RUN IRANIAN LANE V36 NOW'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run content tests first
        run: node --test scripts/tests/*.test.mjs
      - name: Advance dedicated Iranian series lane
        id: iranian
        continue-on-error: true
        env:
          UPERA_REF_ID: ${{ secrets.UPERA_REF_ID }}
          UPERA_TOKEN: ${{ secrets.UPERA_TOKEN }}
          UPERA_PANEL_TOKEN: ${{ secrets.UPERA_PANEL_TOKEN }}
          UPERA_SYNC_MODE: 'IRANIAN'
          UPERA_OPERATOR_DISCOVERY_ENABLED: 'false'
          APARATCHI_RUN_TIME_LIMIT_MINUTES: '12'
          APARATCHI_CHECKPOINT_RESERVE_MS: '45000'
          APARATCHI_REQUEST_TIMEOUT_MS: '12000'
          APARATCHI_REQUEST_MAX_ATTEMPTS: '2'
          UPERA_MAX_REQUESTS_PER_RUN: '220'
          UPERA_REQUEST_DELAY_MS: '520'
          UPERA_IRANIAN_SERIES_REQUEST_QUOTA: '180'
          UPERA_IRANIAN_SERIES_PAGES_PER_RUN: '5'
          UPERA_IRANIAN_SERIES_TITLES_PER_RUN: '1'
          UPERA_PRIORITY_EPISODES_PER_SERIES: '120'
          UPERA_MAX_EPISODE_PAGES: '80'
          APARATCHI_SYNC_MAX_MIRRORED_IMAGES: '0'
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 24); do
            echo "Iranian lane live pass ${pass}/24"
            node scripts/sync-upera.mjs
            decision="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("sync-report-iranian.json","utf8")); const d=Array.isArray(r.iranianSeriesDiagnostics)?r.iranianSeriesDiagnostics:[]; const last=d.at(-1)||{}; process.stdout.write(Number(r.iranianSeriesProcessed||0)>0||Number(r.iranianSeriesAddedOrUpdated||0)>0||Boolean(last.retryLater)||Boolean(r.stoppedByTimeBudget)?"stop":"skip")')"
            [ "$decision" = "skip" ] || break
          done
      - name: Commit Iranian lane progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog-index.json catalog-bootstrap.json catalog-items catalog-stable catalog-manifest.json sync-state.json sync-report*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: advance Iranian series after v36 lane fix"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.iranian.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          summary='{}'
          if [ -f sync-report-iranian.json ]; then
            summary="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("sync-report-iranian.json","utf8")); const c=JSON.parse(fs.readFileSync("catalog.json","utf8")); const items=Array.isArray(c)?c:(c.items||[]); const published=items.filter(x=>x?.type==="series"&&Array.isArray(x.categoryKeys)&&x.categoryKeys.some(k=>/iran/i.test(String(k))&&/series/i.test(String(k)))&&x.publicationStatus!=="building-archive").length; const d=Array.isArray(r.iranianSeriesDiagnostics)?r.iranianSeriesDiagnostics:[]; process.stdout.write(JSON.stringify({outcome:process.env.OUTCOME,iranianSeriesPublished:published,processed:r.iranianSeriesProcessed,addedOrUpdated:r.iranianSeriesAddedOrUpdated,candidates:r.iranianSeriesCandidates,last:d.at(-1)||null}))')"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "run=${RUN_ID}\n${summary}"
      - name: Fail if Iranian lane failed
        if: steps.iranian.outcome != 'success'
        run: exit 1
